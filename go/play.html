<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d12" id="tc">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="sbstyle">
<title>Игра</title>
<link rel="icon" href="assets/icon.svg">
<script src="games.js"></script>
<script>
/* До первой отрисовки: фон и цвет системной строки берём у игры — никакой вспышки чёрного */
(function () {
  var s = new URLSearchParams(location.search).get('g') || '';
  var g = (window.GAMES || []).find(function (x) { return x.slug === s; });
  if (!g) return;
  var bg = /^#[0-9a-f]{6}$/i.test(g.bg || '') ? g.bg : (g.colors && g.colors[0]) || '#0b0d12';
  document.documentElement.style.setProperty('--bg', bg);
  var m = document.getElementById('tc');
  if (m) m.content = bg;
})();
</script>
<style>
:root{
  --bg:#0b0d12;
  --acc1:#5b8cff; --acc2:#22d3a6; --ink:#06121a;
  --ctl-fg:rgba(255,255,255,.62); --ctl-fg-hi:#fff;
  --ctl-bg:rgba(10,12,18,.34); --ctl-bg-hi:rgba(10,12,18,.78);
  --ctl-bd:rgba(255,255,255,.14);
  --scrim:rgba(0,0,0,.62); --dim:rgba(255,255,255,.6);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;
  font:14px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}

#f{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg);
  opacity:0;transition:opacity .28s ease}
#f.ready{opacity:1}

/* Экран загрузки — продолжение игры, а не чёрный провал */
#boot{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:10px;
  background:var(--bg);transition:opacity .35s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .em{font-size:46px;line-height:1;animation:pulse 1.4s ease-in-out infinite}
#boot .ttl{font-size:13px;letter-spacing:.5px;color:var(--dim);font-weight:600}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.12);opacity:1}}

/* Управление — по центру сверху, чтобы не лезть на HUD игр */
#ctl{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;
  transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:14px;
  background:var(--ctl-bg);border:1px solid var(--ctl-bd);transition:background .22s}
#ctl.awake{background:var(--ctl-bg-hi)}
#ctl button{width:46px;height:38px;border:0;background:none;color:var(--ctl-fg);border-radius:11px;
  display:grid;place-items:center;transition:color .22s,background .22s,transform .12s}
#ctl.awake button{color:var(--ctl-fg-hi)}
#ctl button:active{transform:scale(.9)}
#ctl svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#ask{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;
  background:var(--scrim);animation:fade .25s;transition:opacity .35s}
#ask.gone{opacity:0;pointer-events:none}
#ask button{
  width:100%;max-width:340px;height:60px;border-radius:20px;border:0;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));color:var(--ink);
  font:800 17px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 18px 44px rgba(0,0,0,.45);
}
#ask button:active{transform:scale(.97)}
#ask small{display:block;text-align:center;margin-top:12px;color:var(--dim);font-size:12.5px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="boot"><div class="em" id="boot-em">🎮</div><div class="ttl" id="boot-ttl"></div></div>

<iframe id="f" allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope" allowfullscreen></iframe>

<div id="ctl">
  <button id="back" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="toggle" aria-label="Полный экран"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/></svg></button>
</div>

<div id="ask" hidden>
  <div>
    <button id="ask-fs">⤢ На весь экран</button>
    <small>или просто играй — выйти можно кнопкой ←</small>
  </div>
</div>

<script>
(function () {
  'use strict';

  const $ = s => document.getElementById(s);
  const p = new URLSearchParams(location.search);
  const slug = p.get('g') || '';
  const raw = p.get('u') || '';
  const list = Array.isArray(window.GAMES) ? window.GAMES : [];
  const game = list.find(x => x.slug === slug);
  const target = raw || (game ? game.url : '');

  /* Внешняя игра или игра не найдена — открываем напрямую */
  if (!target || /^https?:/i.test(target)) {
    location.replace(target || 'index.html');
    return;
  }

  /* ── Оформление берём из игры, чтобы сайт и игра были одним целым ── */
  const hex = h => /^#[0-9a-f]{6}$/i.test(h) ? h : '#0b0d12';
  const bg = hex((game && game.bg) || (game && game.colors && game.colors[0]) || '#0b0d12');
  const c1 = hex((game && game.colors && game.colors[0]) || '#5b8cff');
  const c2 = hex((game && game.colors && game.colors[1]) || '#22d3a6');
  const lum = (0.2126 * parseInt(bg.slice(1, 3), 16) + 0.7152 * parseInt(bg.slice(3, 5), 16) + 0.0722 * parseInt(bg.slice(5, 7), 16)) / 255;
  const rs = document.documentElement.style;
  rs.setProperty('--bg', bg);
  rs.setProperty('--acc1', c1);
  rs.setProperty('--acc2', c2);
  if (lum > .55) {   // светлая игра — тёмные элементы управления
    rs.setProperty('--ink', '#0d1a26');
    rs.setProperty('--ctl-fg', 'rgba(16,28,44,.58)');
    rs.setProperty('--ctl-fg-hi', '#0f1c2b');
    rs.setProperty('--ctl-bg', 'rgba(255,255,255,.42)');
    rs.setProperty('--ctl-bg-hi', 'rgba(255,255,255,.92)');
    rs.setProperty('--ctl-bd', 'rgba(16,28,44,.14)');
    rs.setProperty('--scrim', 'rgba(255,255,255,.45)');
    rs.setProperty('--dim', 'rgba(16,28,44,.6)');
  }
  $('tc').content = bg;
  $('sbstyle').content = lum > .55 ? 'default' : 'black-translucent';
  document.title = (game ? game.title : 'Игра') + ' — Игры';
  $('boot-em').textContent = (game && game.cover) || '🎮';
  $('boot-ttl').textContent = game ? game.title : 'Игра';

  const fr = $('f'), boot = $('boot');

  /* Игра плавно проявляется поверх того же фона — без чёрного провала */
  fr.addEventListener('load', () => {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fr.classList.add('ready');
      boot.classList.add('gone');
      setTimeout(() => { boot.hidden = true; }, 420);
      if (needAsk) showAsk();
    }));
  });
  fr.src = target;

  /* ── Полный экран ─────────────────────────────────── */
  const el = document.documentElement;
  const canFS = !!(el.requestFullscreen || el.webkitRequestFullscreen);
  const ask = $('ask');
  let needAsk = false;
  let pending = false;
  let manual = false;   // игрок сам вышел из полного экрана — не навязываемся

  function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

  function enterFS() {
    if (!canFS || isFS() || pending) return false;
    pending = true;
    setTimeout(() => { pending = false; }, 800);
    const std = !!el.requestFullscreen;
    const fn = std ? el.requestFullscreen : el.webkitRequestFullscreen;
    let res;
    try { res = std ? fn.call(el, { navigationUI: 'hide' }) : fn.call(el); } catch (e) { res = null; }
    manual = false;
    if (res && res.catch) res.catch(() => { if (!isFS()) showAsk(); });
    return true;
  }

  function exitFS() {
    const fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (fn && isFS()) { manual = true; fn.call(document); }
  }

  function showAsk() {
    if (!canFS) return;
    ask.hidden = false;
    ask.classList.remove('gone');
    clearTimeout(showAsk._t);
    showAsk._t = setTimeout(dismissAsk, 6000);   // не мешаем играть, если полный экран не нужен
  }

  function dismissAsk() {
    clearTimeout(showAsk._t);
    ask.classList.add('gone');
    setTimeout(() => { ask.hidden = true; }, 400);
  }

  function sync() {
    if (isFS() || manual) dismissAsk();
    else showAsk();
    wake();
  }

  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);

  let wakeT = null;
  function wake() {
    const c = $('ctl');
    c.classList.add('awake');
    clearTimeout(wakeT);
    wakeT = setTimeout(() => c.classList.remove('awake'), 2200);
  }

  /* Разворачиваем сразу, пока жест «Играть» ещё свежий */
  requestAnimationFrame(() => { if (!enterFS()) needAsk = true; });

  /* Первый тап по подсказке — гарантированный вход в полный экран */
  ask.addEventListener('pointerdown', () => enterFS(), { capture: true });

  /* Любой тап — на секунду проявляем кнопки управления */
  document.addEventListener('pointerdown', wake, { passive: true });

  $('toggle').addEventListener('click', () => { isFS() ? exitFS() : enterFS(); });

  $('back').addEventListener('click', () => {
    exitFS();
    const ref = document.referrer ? new URL(document.referrer) : null;
    if (ref && ref.origin === location.origin) history.back();
    else location.href = 'index.html';
  });

  /* Системная «назад» / Esc: сначала выходим из полного экрана, потом из игры */
  window.addEventListener('popstate', () => exitFS());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && isFS()) exitFS(); });

  if (!canFS) { ask.hidden = true; $('toggle').hidden = true; }
})();
</script>
</body>
</html>
