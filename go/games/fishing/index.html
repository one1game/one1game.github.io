<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#87CEEB">
<title>Рыбалка 2D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:none;background:#87CEEB;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0}
#hud{position:fixed;top:12px;left:14px;z-index:10;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.statBar{width:130px;height:14px;background:rgba(0,0,0,.5);border:2px solid #fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.statFill{height:100%;width:100%;transition:width .3s}
#foodFill{background:linear-gradient(90deg,#e89b2c,#ffd166)}
#waterFill{background:linear-gradient(90deg,#3a8ab8,#7ec8e0)}
.statLabel{font-size:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);font-weight:700;letter-spacing:.5px}
#cb{position:fixed;bottom:34px;right:24px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#ffe8a3 0%,#ffd87a 30%,#e89b2c 70%,#c47a1a 100%);border:4px solid #fff;box-shadow:0 8px 20px rgba(200,120,40,.4),0 0 0 6px rgba(255,200,100,.2),inset 0 -4px 10px rgba(160,90,20,.3),inset 0 4px 10px rgba(255,255,255,.5);z-index:30;display:flex;align-items:center;justify-content:center;color:#7a4a10;font-weight:800;font-size:14px;letter-spacing:.5px;text-shadow:0 1px 0 rgba(255,255,255,.6);touch-action:none;user-select:none;cursor:pointer;will-change:transform;transform:translateZ(0)}
#cb.a{transform:scale(.9) translateZ(0)}
#cb.bite{animation:bp .3s infinite alternate;background:radial-gradient(circle at 35% 25%,#ff9090 0%,#ff5555 30%,#c41a1a 70%,#7a0808 100%)}
@keyframes bp{from{box-shadow:0 8px 20px rgba(200,40,40,.5),0 0 0 6px rgba(255,100,100,.3),inset 0 -4px 10px rgba(120,20,20,.3),inset 0 4px 10px rgba(255,255,255,.5)}to{box-shadow:0 8px 30px rgba(255,60,60,.8),0 0 0 14px rgba(255,100,100,.1),inset 0 -4px 10px rgba(120,20,20,.3),inset 0 4px 10px rgba(255,255,255,.5)}}
#cb span{position:relative;z-index:2;pointer-events:none}
#pr{position:absolute;inset:-14px;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .15s}
#pr.v{opacity:1;visibility:visible}
#soundBtn{position:fixed;top:12px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid rgba(120,180,230,.5);color:#e89b2c;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:40;cursor:pointer;transition:transform .12s;box-shadow:0 3px 10px rgba(80,140,200,.15)}
#soundBtn.off{opacity:.5}
#soundBtn:active{transform:scale(.9)}
#closeInv{position:fixed;top:12px;right:60px;width:38px;height:38px;border-radius:50%;background:rgba(255,80,80,.9);border:2px solid #fff;color:#fff;font-size:20px;font-weight:800;display:none;align-items:center;justify-content:center;z-index:50;cursor:pointer;box-shadow:0 3px 12px rgba(200,40,40,.5);line-height:1}
#closeInv.show{display:flex}
#closeInv:active{transform:scale(.9)}
#invBar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(20,30,50,.97),rgba(20,30,50,.85));padding:10px 12px;display:none;z-index:45;border-top:3px solid rgba(160,220,255,.4)}
#invBar.show{display:block}
#invBarLabel{color:#ffe8a3;font-size:11px;font-weight:800;text-align:center;margin-bottom:6px;letter-spacing:.5px}
#invSlots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:500px;margin:0 auto}
.invSlot{aspect-ratio:1;background:rgba(255,255,255,.1);border:2px dashed rgba(160,220,255,.3);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px;user-select:none;transition:transform .1s}
.invSlot:active{transform:scale(.93)}
.invSlot.hasFish{background:linear-gradient(160deg,rgba(255,232,163,.9),rgba(255,216,122,.9));border:2px solid #e89b2c;border-style:solid}
.invSlot.cooking{background:linear-gradient(160deg,rgba(255,208,160,.9),rgba(255,144,96,.9));border:2px solid #e86a2c;border-style:solid}
.invSlot.ready{background:linear-gradient(160deg,rgba(122,222,128,.9),rgba(58,168,64,.9));border:2px solid #2a8828;border-style:solid;animation:readyPulse 1s infinite alternate}
@keyframes readyPulse{from{box-shadow:0 0 0 0 rgba(122,222,128,.7)}to{box-shadow:0 0 0 6px rgba(122,222,128,0)}}
.invEmoji{font-size:20px;line-height:1}
.invLabel{font-size:8px;font-weight:800;color:#3a2a10;text-align:center;line-height:1;margin-top:1px}
@media(orientation:landscape){#cb{bottom:20px;right:20px;width:86px;height:86px;font-size:12px}#soundBtn{top:8px;right:10px;width:34px;height:34px;font-size:16px}#hud{top:8px;left:10px}.statBar{width:110px;height:12px}#closeInv{top:8px;right:52px;width:34px;height:34px;font-size:18px}#invSlots{max-width:420px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
    <div>
        <div class="statLabel">🍖 ГОЛОД</div>
        <div class="statBar"><div class="statFill" id="foodFill"></div></div>
    </div>
    <div>
        <div class="statLabel">💧 ЖАЖДА</div>
        <div class="statBar"><div class="statFill" id="waterFill"></div></div>
    </div>
</div>

<div id="cb"><span>ЗАБРОС</span><canvas id="pr" width="240" height="240"></canvas></div>
<div id="soundBtn">🔊</div>
<div id="closeInv">✕</div>

<div id="invBar">
    <div id="invBarLabel">🎒 ИНВЕНТАРЬ · тап на рыбу → на мангал</div>
    <div id="invSlots"></div>
</div>

<script>
(function(){
'use strict';
// Слабым считаем тач-устройство с 4 ядрами/2 ГБ и меньше: 30 кадров и разрешение ниже
// (логика считается по dt, так что скорость игры от частоты не зависит)
const LE=((navigator.hardwareConcurrency||4)<=4||(navigator.deviceMemory||4)<=2)&&matchMedia('(pointer:coarse)').matches,FI=1000/(LE?30:60);
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false,desynchronized:true});
const cb=document.getElementById('cb'),pr=document.getElementById('pr'),pc=pr.getContext('2d',{alpha:true,desynchronized:true});
const sBtn=document.getElementById('soundBtn');
const foodFill=document.getElementById('foodFill'),waterFill=document.getElementById('waterFill');
const invBar=document.getElementById('invBar'),invSlots=document.getElementById('invSlots'),invBarLabel=document.getElementById('invBarLabel');
const closeInvBtn=document.getElementById('closeInv');
let W=0,H=0,HW=0,HH=0,DPR=Math.min(window.devicePixelRatio||1,LE?1.25:2);
let paused=false,lastInteraction=performance.now(),IDLE_TIMEOUT=6000;

// ============================================================
// ИГРОВЫЕ ДАННЫЕ
// ============================================================
const player={food:1,water:1};
const INVENTORY_SIZE=6;
const inventory=new Array(INVENTORY_SIZE).fill(null);
const COOK_TIME=60000;

const FISH_TYPES={
    karas:{name:'Карась',emoji:'🐟',color:'#c4a044',color2:'#8a6a20',minW:0.3,maxW:1.5,rate:0.55,waitTime:[3,7],biteWindow:1.8,food:0.35},
    rotan:{name:'Ротан',emoji:'🐠',color:'#3a4a3a',color2:'#1a2a1a',minW:0.1,maxW:0.4,rate:0.3,waitTime:[2,5],biteWindow:1.2,food:0.15},
    skumbriya:{name:'Скумбрия',emoji:'🐡',color:'#4a8aaa',color2:'#2a5a7a',minW:0.4,maxW:1.8,rate:0.15,waitTime:[4,9],biteWindow:2.2,food:0.4}
};
function rollFish(){const r=Math.random();let acc=0;for(const k in FISH_TYPES){acc+=FISH_TYPES[k].rate;if(r<acc)return k}return 'karas'}
function rnd(a,b){return a+Math.random()*(b-a)}

// ============================================================
// ЗВУК (сокращено для краткости — ключевое оставлено)
// ============================================================
const Snd=(function(){
    let ac=null,master=null,musicBus=null,sfxBus=null,enabled=true;
    let voiceCount=0,MAX_VOICES=6;
    let noiseBufWhite=null,noiseBufPink=null;
    let musicPlaying=false,musicTimer=null,nextNoteTime=0,currentStep=0;
    const TEMPO=132,BEAT=60/TEMPO,STEP=BEAT/2;
    const MELODY=[[72,1],[76,1],[79,2],[76,1],[72,1],[67,2],[69,1],[72,1],[76,2],[72,1],[69,1],[64,2],[77,1],[81,1],[84,2],[81,1],[77,1],[72,2],[76,1],[74,1],[72,1],[71,1],[72,2],[0,2]];
    const BASS=[[48,2],[55,2],[48,2],[55,2],[45,2],[52,2],[45,2],[52,2],[41,2],[48,2],[41,2],[48,2],[43,2],[50,2],[48,2],[55,2]];
    const ARP=[[60,64,67,64],[60,64,67,64],[57,60,64,60],[57,60,64,60],[53,57,60,57],[53,57,60,57],[55,59,62,59],[55,59,62,59]];
    function init(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.22;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7000;lp.Q.value=0.4;const lim=ac.createDynamicsCompressor();lim.threshold.value=-12;lim.knee.value=5;lim.ratio.value=8;lim.attack.value=0.003;lim.release.value=0.15;master.connect(lp);lp.connect(lim);lim.connect(ac.destination);musicBus=ac.createGain();musicBus.gain.value=0.55;musicBus.connect(master);sfxBus=ac.createGain();sfxBus.gain.value=0.65;sfxBus.connect(master);noiseBufWhite=createNoise(2,'white');noiseBufPink=createNoise(2,'pink')}catch(e){enabled=false}}
    function createNoise(dur,type){const size=Math.max(1,Math.floor(ac.sampleRate*dur));const buf=ac.createBuffer(1,size,ac.sampleRate);const d=buf.getChannelData(0);if(type==='pink'){let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(let i=0;i<size;i++){const w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926}}else{for(let i=0;i<size;i++)d[i]=Math.random()*2-1}return buf}
    function resume(){try{if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}catch(e){}}
    function mtof(m){return 440*Math.pow(2,(m-69)/12)}
    function lEnv(g,now,peak,dur){try{g.gain.cancelScheduledValues(now);g.gain.setValueAtTime(0.0001,now);g.gain.linearRampToValueAtTime(peak,now+0.01);g.gain.linearRampToValueAtTime(0.0001,now+dur)}catch(e){}}
    function duckQuack(pan,distress){if(!enabled||!ac||voiceCount>=MAX_VOICES)return;try{voiceCount++;const now=ac.currentTime,dur=distress?0.35:0.22,pb=distress?150:125;const osc=ac.createOscillator();osc.type='sine';osc.frequency.value=pb;const vib=ac.createOscillator();vib.frequency.value=18;const vg=ac.createGain();vg.gain.value=pb*0.05;vib.connect(vg);vg.connect(osc.frequency);osc.frequency.setValueAtTime(pb*0.95,now);osc.frequency.linearRampToValueAtTime(pb*1.05,now+0.04);osc.frequency.linearRampToValueAtTime(pb*0.85,now+dur);const env=ac.createGain();lEnv(env,now,0.22,dur);osc.connect(env);env.connect(sfxBus);osc.start(now);osc.stop(now+dur+0.05);vib.start(now);vib.stop(now+dur+0.05);osc.onended=()=>{voiceCount--}}catch(e){voiceCount--}}
    function birdChirp(pan){if(!enabled||!ac||voiceCount>=MAX_VOICES)return;try{voiceCount++;const now=ac.currentTime,base=2200+Math.random()*500;for(let n=0;n<2;n++){const start=now+n*0.12,dur=0.09,freq=base*(0.95+Math.random()*0.1);const osc=ac.createOscillator();osc.type='sine';osc.frequency.setValueAtTime(freq*0.85,start);osc.frequency.linearRampToValueAtTime(freq*1.2,start+0.025);osc.frequency.linearRampToValueAtTime(freq*0.9,start+dur);const env=ac.createGain();env.gain.setValueAtTime(0.0001,start);env.gain.linearRampToValueAtTime(0.05,start+0.015);env.gain.linearRampToValueAtTime(0.0001,start+dur);osc.connect(env);env.connect(sfxBus);osc.start(start);osc.stop(start+dur+0.05);if(n===1)osc.onended=()=>{voiceCount--}}}catch(e){voiceCount--}}
    function splash(power,pan){if(!enabled||!ac||voiceCount>=MAX_VOICES)return;try{voiceCount++;const now=ac.currentTime,p=power||0.5;const b=ac.createBufferSource();b.buffer=noiseBufPink;const bf=ac.createBiquadFilter();bf.type='lowpass';bf.frequency.value=500;const bg=ac.createGain();lEnv(bg,now,0.2*p,0.35);b.connect(bf);bf.connect(bg);const s=ac.createBufferSource();s.buffer=noiseBufWhite;const sf=ac.createBiquadFilter();sf.type='bandpass';sf.frequency.value=1400;sf.Q.value=0.8;const sg=ac.createGain();lEnv(sg,now,0.1*p,0.4);s.connect(sf);sf.connect(sg);const mix=ac.createGain();mix.gain.value=1;bg.connect(mix);sg.connect(mix);mix.connect(sfxBus);b.start(now);b.stop(now+0.4);s.start(now);s.stop(now+0.45);b.onended=()=>{voiceCount--}}catch(e){voiceCount--}}
    function castWhoosh(power){if(!enabled||!ac||voiceCount>=MAX_VOICES)return;try{voiceCount++;const now=ac.currentTime,p=power||0.5,dur=0.28+p*0.18;const src=ac.createBufferSource();src.buffer=noiseBufWhite;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=1.5;f.frequency.value=800;const env=ac.createGain();lEnv(env,now,0.06*p,dur);src.connect(f);f.connect(env);env.connect(sfxBus);src.start(now);src.stop(now+dur+0.05);src.onended=()=>{voiceCount--}}catch(e){voiceCount--}}
    let chargeSrc=null,chargeGain=null;
    function chargeStart(){if(!enabled||!ac||chargeSrc)return;try{const now=ac.currentTime;chargeSrc=ac.createBufferSource();chargeSrc.buffer=noiseBufPink;chargeSrc.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=350;f.Q.value=1.2;chargeGain=ac.createGain();chargeGain.gain.setValueAtTime(0.0001,now);chargeGain.gain.linearRampToValueAtTime(0.035,now+0.15);chargeSrc.connect(f);f.connect(chargeGain);chargeGain.connect(sfxBus);chargeSrc.start(now)}catch(e){}}
    function chargeStop(){if(!chargeSrc||!chargeGain||!ac)return;try{const now=ac.currentTime;chargeGain.gain.cancelScheduledValues(now);chargeGain.gain.setValueAtTime(chargeGain.gain.value||0.0001,now);chargeGain.gain.linearRampToValueAtTime(0.0001,now+0.12);chargeSrc.stop(now+0.15)}catch(e){}chargeSrc=null;chargeGain=null}
    function stoneSplash(pan){if(!enabled||!ac||voiceCount>=MAX_VOICES)return;try{voiceCount++;const now=ac.currentTime;const src=ac.createBufferSource();src.buffer=noiseBufWhite;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;const g=ac.createGain();lEnv(g,now,0.18,0.25);src.connect(f);f.connect(g);g.connect(sfxBus);src.start(now);src.stop(now+0.3);src.onended=()=>{voiceCount--}}catch(e){voiceCount--}}
    function duckHit(){if(!enabled||!ac||voiceCount>=MAX_VOICES)return;try{voiceCount++;const now=ac.currentTime;const osc=ac.createOscillator();osc.type='sine';osc.frequency.setValueAtTime(140,now);osc.frequency.linearRampToValueAtTime(60,now+0.12);const g=ac.createGain();lEnv(g,now,0.2,0.18);osc.connect(g);g.connect(sfxBus);osc.start(now);osc.stop(now+0.22);osc.onended=()=>{voiceCount--};setTimeout(()=>duckQuack(0,true),120)}catch(e){voiceCount--}}
    function bubble(pan){if(!enabled||!ac||voiceCount>=MAX_VOICES)return;try{voiceCount++;const now=ac.currentTime,f=320+Math.random()*350;const osc=ac.createOscillator();osc.type='sine';osc.frequency.setValueAtTime(f,now);osc.frequency.linearRampToValueAtTime(f*1.6,now+0.03);const g=ac.createGain();g.gain.setValueAtTime(0.0001,now);g.gain.linearRampToValueAtTime(0.02,now+0.01);g.gain.linearRampToValueAtTime(0.0001,now+0.06);osc.connect(g);g.connect(sfxBus);osc.start(now);osc.stop(now+0.09);osc.onended=()=>{voiceCount--}}catch(e){voiceCount--}}
    function bite(){if(!enabled||!ac)return;try{const now=ac.currentTime;const s=ac.createBufferSource();s.buffer=noiseBufWhite;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=1.2;const g=ac.createGain();lEnv(g,now,0.2,0.18);s.connect(f);f.connect(g);g.connect(sfxBus);s.start(now);s.stop(now+0.2);const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(1000,now);o.frequency.linearRampToValueAtTime(700,now+0.12);const oe=ac.createGain();lEnv(oe,now,0.14,0.15);o.connect(oe);oe.connect(sfxBus);o.start(now);o.stop(now+0.18)}catch(e){}}
    function reel(){if(!enabled||!ac)return;try{const now=ac.currentTime;const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(300,now);o.frequency.linearRampToValueAtTime(600,now+0.4);const g=ac.createGain();lEnv(g,now,0.05,0.5);o.connect(g);g.connect(sfxBus);o.start(now);o.stop(now+0.55)}catch(e){}}
    function success(){if(!enabled||!ac)return;try{const now=ac.currentTime;[79,84].forEach((m,i)=>{const o=ac.createOscillator();o.type='square';o.frequency.value=mtof(m);const filt=ac.createBiquadFilter();filt.type='lowpass';filt.frequency.value=4000;o.connect(filt);const e=ac.createGain();const t=now+i*0.1;e.gain.setValueAtTime(0.0001,t);e.gain.linearRampToValueAtTime(0.1,t+0.01);e.gain.linearRampToValueAtTime(0.0001,t+0.25);filt.connect(e);e.connect(sfxBus);o.start(t);o.stop(t+0.3)})}catch(e){}}
    function fail(){if(!enabled||!ac)return;try{const now=ac.currentTime;const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(400,now);o.frequency.linearRampToValueAtTime(150,now+0.35);const g=ac.createGain();lEnv(g,now,0.1,0.4);o.connect(g);g.connect(sfxBus);o.start(now);o.stop(now+0.45)}catch(e){}}
    function eat(){if(!enabled||!ac)return;try{const now=ac.currentTime;[60,64].forEach((m,i)=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=mtof(m);const e=ac.createGain();const t=now+i*0.1;e.gain.setValueAtTime(0.0001,t);e.gain.linearRampToValueAtTime(0.1,t+0.02);e.gain.linearRampToValueAtTime(0.0001,t+0.3);o.connect(e);e.connect(sfxBus);o.start(t);o.stop(t+0.35)})}catch(e){}}
    function drink(){if(!enabled||!ac)return;try{const now=ac.currentTime;for(let i=0;i<3;i++){const o=ac.createOscillator();o.type='sine';o.frequency.value=mtof(48+i*2);const e=ac.createGain();const t=now+i*0.08;e.gain.setValueAtTime(0.0001,t);e.gain.linearRampToValueAtTime(0.08,t+0.02);e.gain.linearRampToValueAtTime(0.0001,t+0.15);o.connect(e);e.connect(sfxBus);o.start(t);o.stop(t+0.2)}}catch(e){}}
    function readyDing(){if(!enabled||!ac)return;try{const now=ac.currentTime;[84,88].forEach((m,i)=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=mtof(m);const e=ac.createGain();const t=now+i*0.15;e.gain.setValueAtTime(0.0001,t);e.gain.linearRampToValueAtTime(0.12,t+0.02);e.gain.linearRampToValueAtTime(0.0001,t+0.4);o.connect(e);e.connect(sfxBus);o.start(t);o.stop(t+0.45)})}catch(e){}}
    function chipLead(midi,when,dur,vol){if(!enabled||!ac)return;try{const o=ac.createOscillator();o.type='square';o.frequency.value=mtof(midi);const filt=ac.createBiquadFilter();filt.type='lowpass';filt.frequency.value=4000;o.connect(filt);const env=ac.createGain();env.gain.setValueAtTime(0.0001,when);env.gain.linearRampToValueAtTime(vol,when+0.008);env.gain.linearRampToValueAtTime(0.0001,when+dur);filt.connect(env);env.connect(musicBus);o.start(when);o.stop(when+dur+0.05)}catch(e){}}
    function chipBass(midi,when,dur,vol){if(!enabled||!ac)return;try{const o=ac.createOscillator();o.type='triangle';o.frequency.value=mtof(midi);const env=ac.createGain();env.gain.setValueAtTime(0.0001,when);env.gain.linearRampToValueAtTime(vol,when+0.015);env.gain.linearRampToValueAtTime(0.0001,when+dur);o.connect(env);env.connect(musicBus);o.start(when);o.stop(when+dur+0.05)}catch(e){}}
    function chipArp(midi,when,dur,vol){if(!enabled||!ac)return;try{const o=ac.createOscillator();o.type='square';o.frequency.value=mtof(midi);const filt=ac.createBiquadFilter();filt.type='lowpass';filt.frequency.value=3000;o.connect(filt);const env=ac.createGain();env.gain.setValueAtTime(0.0001,when);env.gain.linearRampToValueAtTime(vol,when+0.005);env.gain.linearRampToValueAtTime(0.0001,when+dur*0.9);filt.connect(env);env.connect(musicBus);o.start(when);o.stop(when+dur+0.02)}catch(e){}}
    function scheduleStep(step,startTime){const barIdx=Math.floor(step/8)%4;let cumStep=0;for(let i=0;i<MELODY.length;i++){const note=MELODY[i];if(step===cumStep){if(note[0]>0)chipLead(note[0],startTime,note[1]*STEP*0.95,0.16);break}cumStep+=note[1];if(cumStep>step)break}const arp=ARP[barIdx],nib=step%8;if(nib<4)chipArp(arp[nib],startTime,STEP*0.9,0.05);else chipArp(arp[7-nib],startTime,STEP*0.9,0.05);if(nib===0){const b=BASS[barIdx*4];chipBass(b[0],startTime,STEP*3.8,0.12)}else if(nib===4){const b=BASS[barIdx*4+2];chipBass(b[0],startTime,STEP*3.8,0.1)}}
    function planMusic(){if(!musicPlaying||!ac)return;try{const now=ac.currentTime;let safety=0;while(nextNoteTime<now+2&&safety<100){scheduleStep(currentStep,nextNoteTime);nextNoteTime+=STEP;currentStep=(currentStep+1)%32;safety++}}catch(e){}}
    function startMusic(){if(musicPlaying||!ac)return;musicPlaying=true;nextNoteTime=ac.currentTime+0.15;currentStep=0;planMusic();musicTimer=setInterval(()=>{if(musicPlaying&&!document.hidden)planMusic()},500)}
    function stopMusic(){musicPlaying=false;if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
    function toggle(){enabled=!enabled;try{if(master&&ac){const t=enabled?0.22:0.0001;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(t,ac.currentTime,0.2)}}catch(e){}if(enabled){resume();if(!musicPlaying)startMusic()}else{stopMusic();if(chargeSrc)chargeStop()}return enabled}
    document.addEventListener('visibilitychange',()=>{if(!ac)return;try{if(document.hidden){if(ac.state==='running')ac.suspend().catch(()=>{})}else{if(enabled&&ac.state==='suspended')ac.resume().catch(()=>{})}}catch(e){}});
    return{init,resume,toggle,startMusic,duckQuack,birdChirp,splash,castWhoosh,chargeStart,chargeStop,stoneSplash,duckHit,bubble,bite,reel,success,fail,eat,drink,readyDing,isEnabled:()=>enabled};
})();

function drawCloud(c,x,y,scale,alpha){
    c.save();c.globalAlpha=alpha;
    const parts=[{dx:0,dy:0,r:22},{dx:24,dy:-8,r:28},{dx:52,dy:0,r:20},{dx:28,dy:10,r:24},{dx:-15,dy:5,r:18}];
    c.fillStyle='rgba(200,220,240,.5)';
    parts.forEach(p=>{c.beginPath();c.arc(x+p.dx*scale,y+p.dy*scale+6,p.r*scale,0,6.28318);c.fill()});
    const g=c.createRadialGradient(x,y-5,10,x,y,60*scale);
    g.addColorStop(0,'#ffffff');g.addColorStop(.7,'#f8fcff');g.addColorStop(1,'#e8f4fc');
    c.fillStyle=g;
    parts.forEach(p=>{c.beginPath();c.arc(x+p.dx*scale,y+p.dy*scale,p.r*scale,0,6.28318);c.fill()});
    c.fillStyle='rgba(255,255,255,.7)';
    parts.forEach(p=>{c.beginPath();c.arc(x+p.dx*scale,y+p.dy*scale-3,p.r*scale*.6,0,6.28318);c.fill()});
    c.restore();
}

        c.fillStyle=p[3];c.beginPath();c.ellipse(x,y,s,s*.65,0,0,6.28318);c.fill();
        c.fillStyle='rgba(255,250,230,.6)';c.beginPath();c.ellipse(x-s*.3,y-s*.3,s*.35,s*.2,0,0,6.28318);c.fill();
    });
}
function drawGrass(c,W,H,sT){
    for(let i=0;i<12;i++){const x=(i*83.7)%W,y=H*.87+(i%4)*6,gh=14+(i%5)*4,sway=Math.sin(i*.8)*1;

        c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+4+sway,y-gh*.6,x+2+sway,y-gh);c.stroke();
        c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x-3+sway,y-gh*.5,x-5+sway,y-gh*.8);c.stroke();

}

let invOpen=false;

function addFishToInventory(fishType,weight){
    for(let i=0;i<INVENTORY_SIZE;i++){
        if(inventory[i]===null){
            inventory[i]={type:'fish',fishType,weight};
            return true;
        }
    }
    return false;
}

    invOpen=true;
    invBar.classList.add('show');
    closeInvBtn.classList.add('show');

}
function closeInventory(){
    invOpen=false;
    invBar.classList.remove('show');
    closeInvBtn.classList.remove('show');
}

// Съесть готовую рыбу (из инвентаря или с мангала)
function eatReadyFish(){
    // Ищем готовую рыбу
    for(let i=0;i<INVENTORY_SIZE;i++){
        const slot=inventory[i];
        if(slot&&slot.type==='ready'){
            const type=FISH_TYPES[slot.fishType];
            player.food=Math.min(1,player.food+type.food);
            updateHUD();
            try{Snd.eat()}catch(e){}
            inventory[i]=null;
            if(invOpen)renderInventory();
            return true;
        }
    }
    return false;
}

function renderInventory(){
    invSlots.innerHTML='';
    for(let i=0;i<INVENTORY_SIZE;i++){
        const slot=inventory[i];
        const div=document.createElement('div');
        div.className='invSlot';
        if(slot){
            if(slot.type==='fish'){
                div.classList.add('hasFish');
                div.innerHTML=`<div class="invEmoji">${FISH_TYPES[slot.fishType].emoji}</div><div class="invLabel">${FISH_TYPES[slot.fishType].name}</div>`;
                div.onclick=()=>{
                    inventory[i]={type:'cooking',fishType:slot.fishType,weight:slot.weight,startTime:performance.now()};
                    try{Snd.reel()}catch(e){}
                    renderInventory();
                };
            } else if(slot.type==='cooking'){
                div.classList.add('cooking');
                const emoji=FISH_TYPES[slot.fishType].emoji;
                const elapsed=performance.now()-slot.startTime;
                const progress=Math.min(1,elapsed/COOK_TIME);
                const percent=Math.round(progress*100);
                div.innerHTML=`<div class="invEmoji">${emoji}</div><div class="invLabel">🔥 ${percent}%</div>`;
            } else if(slot.type==='ready'){
                div.classList.add('ready');
                div.innerHTML=`<div class="invEmoji">🍢</div><div class="invLabel">СЪЕСТЬ</div>`;
                div.onclick=()=>{ eatReadyFish(); };
            }
        } else {
            div.innerHTML=`<div class="invEmoji" style="opacity:.25">·</div>`;
        }
        invSlots.appendChild(div);
    }
}

    foodFill.style.width=Math.max(0,Math.min(100,player.food*100))+'%';
    waterFill.style.width=Math.max(0,Math.min(100,player.water*100))+'%';
}

function cbtn(x,y){const r=cb.getBoundingClientRect();return Math.hypot(x-r.left-r.width/2,y-r.top-r.height/2)<r.width*.7}
function hitDuck(x,y){const yO=pl.yaw*W*.15;for(let i=ducks.length-1;i>=0;i--){const d=ducks[i];if(d.state==='drowning'||d.state==='dead')continue;if(Math.hypot(x-(d.x-yO*.5),y-d.y)<22*d.sc)return d}return null}
function throwStone(t){const yO=pl.yaw*W*.15;stones.push({x:t.x-yO*.5,y:H*.82,tx:t.x-yO*.5,ty:t.y,t:0,dur:.4,target:t})}
function onTap(x,y){if(!js.a&&!lk.a){const d=hitDuck(x,y);if(d){throwStone(d);return true}}return false}

function hitSadok(x,y){const sx=W*.32,sy=H*.815;return Math.hypot(x-sx,y-sy)<55}
function hitBeer(x,y){const bx2=W*.82,by=H*.85;return Math.hypot(x-bx2,y-by+10)<32}
function hitMangal(x,y){const mx=W*.72,my=H*.815;return Math.hypot(x-mx,y-my+15)<70}

function hTS(e){
    e.preventDefault();markInteraction();
    if(invOpen)return;
    for(let i=0;i<e.changedTouches.length;i++){
        const t=e.changedTouches[i],x=t.clientX,y=t.clientY;
        if(hitSadok(x,y)){openInventory();continue}
        if(hitMangal(x,y)){ 
            // Тап по мангалу: если есть готовое — съесть, иначе открыть инвентарь
            if(!eatReadyFish()){ openInventory(); }
            continue;
        }
        if(hitBeer(x,y)){player.water=Math.min(1,player.water+0.4);updateHUD();try{Snd.drink()}catch(e){};continue}
        if(cbtn(x,y)){onCastDown();continue}
        const isDuckZone=x<lz.x||y>lz.y+lz.h;
        if(isDuckZone&&onTap(x,y))continue;
        if(!js.a&&x<jz.x+jz.w&&y>jz.y){js.a=true;js.tid=t.identifier;js.sX=x;js.sY=y;js.dx=0;js.dy=0;continue}
        if(!lk.a&&x>lz.x&&y<lz.y+lz.h){lk.a=true;lk.tid=t.identifier;lk.lX=x;lk.lY=y}
    }
}
function hTM(e){
    e.preventDefault();markInteraction();
    if(invOpen)return;
    for(let i=0;i<e.changedTouches.length;i++){
        const t=e.changedTouches[i],x=t.clientX,y=t.clientY;
        if(js.a&&t.identifier===js.tid){let dx=x-js.sX,dy=y-js.sY;const d=Math.sqrt(dx*dx+dy*dy);if(d>js.mD){const k=js.mD/d;dx*=k;dy*=k}js.dx=dx/js.mD;js.dy=dy/js.mD;aim.x=js.dx;aim.y=-js.dy}
        else if(lk.a&&t.identifier===lk.tid){const dx=x-lk.lX,dy=y-lk.lY;lk.lX=x;lk.lY=y;tg.yaw-=dx*.0045;tg.pitch-=dy*.0035;tg.yaw=Math.max(-1,Math.min(1,tg.yaw));tg.pitch=Math.max(-.8,Math.min(.8,tg.pitch))}
    }
}
function hTE(e){
    e.preventDefault();markInteraction();
    for(let i=0;i<e.changedTouches.length;i++){
        const t=e.changedTouches[i];
        if(js.a&&t.identifier===js.tid){js.a=false;js.tid=null;js.dx=0;js.dy=0}
        if(lk.a&&t.identifier===lk.tid){lk.a=false;lk.tid=null}
    }
}

cv.addEventListener('touchstart',hTS,{passive:false});
cv.addEventListener('touchmove',hTM,{passive:false});
cv.addEventListener('touchend',hTE,{passive:false});
cv.addEventListener('touchcancel',hTE,{passive:false});

let mD=false,mM=null;
cv.addEventListener('mousedown',e=>{
    markInteraction();
    if(invOpen)return;
    const x=e.clientX,y=e.clientY;
    if(hitSadok(x,y)){openInventory();return}
    if(hitMangal(x,y)){
        if(!eatReadyFish()){openInventory();}
        return;
    }
    if(hitBeer(x,y)){player.water=Math.min(1,player.water+0.4);updateHUD();try{Snd.drink()}catch(e){};return}
    if(cbtn(x,y)){onCastDown();mD=true;mM='c';return}
    if(x<jz.x+jz.w&&y>jz.y){mM='j';js.a=true;js.sX=x;js.sY=y}
    else if(x>lz.x&&y<lz.y+lz.h){mM='l';lk.a=true;lk.lX=x;lk.lY=y}
    else{mM='t'}
    mD=true;
});
addEventListener('mousemove',e=>{
    if(!mD||invOpen)return;markInteraction();
    const x=e.clientX,y=e.clientY;
    if(mM==='j'){let dx=x-js.sX,dy=y-js.sY;const d=Math.sqrt(dx*dx+dy*dy);if(d>js.mD){const k=js.mD/d;dx*=k;dy*=k}js.dx=dx/js.mD;js.dy=dy/js.mD;aim.x=js.dx;aim.y=-js.dy}
    else if(mM==='l'){const dx=x-lk.lX,dy=y-lk.lY;lk.lX=x;lk.lY=y;tg.yaw-=dx*.0045;tg.pitch-=dy*.0035;tg.yaw=Math.max(-1,Math.min(1,tg.yaw));tg.pitch=Math.max(-.8,Math.min(.8,tg.pitch))}
});
addEventListener('mouseup',e=>{
    if(mM==='c')onCastUp();
    else if(mM==='t'&&!mMoved)onTap(e.clientX,e.clientY);
    mD=false;mM=null;js.a=false;js.dx=0;js.dy=0;lk.a=false;
});

closeInvBtn.addEventListener('click',()=>closeInventory());
closeInvBtn.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();closeInventory()},{passive:false});

function onCastDown(){
    if(G.state==='bite'){hookFish();return}
    if(G.state==='reeling')return;
    if(G.state==='waiting')return;
    if(G.state==='idle'&&floatInWater){retrieve();return}
    if(G.state!=='idle')return;
    G.state='charging';G.chS=performance.now();G.pow=0;
    cb.classList.add('a');pr.classList.add('v');
    try{Snd.init();Snd.resume();Snd.chargeStart()}catch(e){}
}
function onCastUp(){
    if(G.state!=='charging')return;
    cb.classList.remove('a');pr.classList.remove('v');
    try{Snd.chargeStop()}catch(e){}
    if(G.pow<.06){G.state='idle';G.pow=0;return}

let floatInWater=false;

function launch(p){
    G.state='flying';G.fP=0;G.pow=p;
    const t=tip();G.fSX=t.x;G.fSY=t.y;
    const hz=H*.42+pl.pitch*H*.25,wT=hz+15,wB=H*.82;
    const aN=(aim.y+1)*.5,aF=aN*.6+p*.4,fB=wT+20,nB=wB-20;let tY=nB-(nB-fB)*aF;
    const yS=pl.yaw*W*.15;let tX=HW+yS+aim.x*W*.3;tX+=(Math.random()-.5)*16;
    tX=Math.max(W*.08,Math.min(W*.92,tX));tY=Math.max(wT+10,Math.min(wB-10,tY));
    G.fTX=tX;G.fTY=tY;G.fCX=(G.fSX+tX)*.5;G.fCY=Math.min(G.fSY,tY)-(55+p*90);G.fD=.55+p*.45;
    try{Snd.castWhoosh(p)}catch(e){}
    scareDucksNear(tX,tY);
}
function scareDucksNear(x,y){const yO=pl.yaw*W*.15;ducks.forEach(d=>{if(d.state!=='swim')return;const dx=d.x-yO*.5,dy=d.y;if(Math.hypot(x-dx,y-dy)<80){d.state='fleeing';d.targetX=d.x+(d.x-x>0?1:-1)*(120+Math.random()*100);d.vx=(d.targetX>d.x?1:-1)*.9;d.flip=d.vx>0?1:-1;const pan=Math.max(-1,Math.min(1,((d.x-yO*.5)/W)*2-1));if(canPlaySound())try{Snd.duckQuack(pan,true)}catch(e){}}})}
function startWaiting(){G.fishType=rollFish();const t=FISH_TYPES[G.fishType];G.waitDur=rnd(t.waitTime[0],t.waitTime[1]);G.waitTimer=0;G.state='waiting'}
function hookFish(){
    if(G.state!=='bite')return;

    G.weight=t.minW+Math.random()*(t.maxW-t.minW);

function updateWorld(dt){
    if(document.hidden)return;
    const now=performance.now();
    birds.forEach(b=>{b.x+=b.sp*b.dir*dt*30;b.ph+=dt*8;if(b.dir>0&&b.x>W+50){b.x=-50;b.y=H*.1+Math.random()*H*.2}if(b.dir<0&&b.x<-50){b.x=W+50;b.y=H*.1+Math.random()*H*.2}});
    if(now-lastBirdChirp>5000&&Math.random()<dt*0.4&&canPlaySound()){lastBirdChirp=now;try{Snd.birdChirp((Math.random()-.5)*1.5)}catch(e){}}
    let aliveCount=0;
    ducks.forEach(d=>{if(d.state==='dead')return;aliveCount++;
    if(d.state==='swim'){d.x+=d.vx*dt*60;d.ph+=dt*3;if(d.x<W*.1){d.x=W*.1;d.vx*=-1;d.flip*=-1}if(d.x>W*.9){d.x=W*.9;d.vx*=-1;d.flip*=-1}if(now-lastDuckQuack>6000&&Math.random()<dt*0.15&&canPlaySound()){lastDuckQuack=now;const pan=Math.max(-1,Math.min(1,((d.x-pl.yaw*W*.15*.5)/W)*2-1));try{Snd.duckQuack(pan,false)}catch(e){}}}
    else if(d.state==='fleeing'){d.x+=d.vx*dt*60;d.ph+=dt*6;if(Math.abs(d.x-d.targetX)<10||d.x<W*.08||d.x>W*.92){d.state='swim';d.vx=(Math.random()-.5)*.3;if(d.x<W*.1){d.x=W*.1;d.vx=Math.abs(d.vx)}if(d.x>W*.9){d.x=W*.9;d.vx=-Math.abs(d.vx)}}}
    else if(d.state==='drowning'){d.drownT+=dt;d.alpha=Math.max(0,1-d.drownT/1.2);d.bobOffset=d.drownT*15;if(d.drownT>1.4)d.state='dead'}});
    if(aliveCount<2){duckRespawnTimer+=dt;if(duckRespawnTimer>6){for(let i=0;i<ducks.length;i++){if(ducks[i].state==='dead'){const edge=Math.random()>.5?W*.1:W*.9;ducks[i]=makeDuck(edge);ducks[i].vx=edge<W*.5?Math.abs(ducks[i].vx):-Math.abs(ducks[i].vx);ducks[i].flip=ducks[i].vx>0?1:-1;if(canPlaySound())try{Snd.duckQuack(edge<W*.5?-0.6:0.6,false)}catch(e){};break}}duckRespawnTimer=0}}
    fishes.forEach(f=>{f.t+=dt;const cycle=(f.t+f.delay)%14;if(cycle<f.dur){f.jump=true;f.jp=cycle/f.dur}else{f.jump=false}});
    flies.forEach(fl=>{fl.ph+=dt*fl.sp*4;fl.x+=Math.sin(fl.ph)*.8;fl.y+=Math.cos(fl.ph*1.3)*.4;if(fl.x<0)fl.x=W;if(fl.x>W)fl.x=0;if(fl.y<H*.5)fl.y=H*.5;if(fl.y>H*.8)fl.y=H*.8});
    if(now-lastBubble>5000&&Math.random()<dt*0.2&&canPlaySound()){lastBubble=now;try{Snd.bubble((Math.random()-.5)*1.2)}catch(e){}}
    for(let i=stones.length-1;i>=0;i--){const s=stones[i];s.t+=dt/s.dur;if(s.t>=1){if(s.target&&(s.target.state==='swim'||s.target.state==='fleeing')){s.target.state='drowning';s.target.drownT=0;s.target.vx=0;if(canPlaySound())try{Snd.duckHit()}catch(e){}}if(canPlaySound())try{Snd.stoneSplash(Math.max(-1,Math.min(1,((s.tx-W/2)/W)*2)))}catch(e){};for(let j=0;j<6;j++)splashes.push({x:s.tx+(Math.random()-.5)*15,y:s.ty,vx:(Math.random()-.5)*2,vy:-2-Math.random()*2,t:0,life:.8});stones.splice(i,1)}}
    for(let i=splashes.length-1;i>=0;i--){const sp=splashes[i];sp.t+=dt;sp.x+=sp.vx;sp.y+=sp.vy;sp.vy+=.15;if(sp.t>sp.life)splashes.splice(i,1)}
}

let cookingCheckTimer=0;
function updateFishing(dt){
    pl.yaw+=(tg.yaw-pl.yaw)*.2;pl.pitch+=(tg.pitch-pl.pitch)*.2;
    const m=Math.sqrt(js.dx*js.dx+js.dy*js.dy);pl.speed=m>1?1:m;pl.bob+=dt*(m>.05?9*m:2);
    js.vX+=(js.dx-js.vX)*.3;js.vY+=(js.dy-js.vY)*.3;

    player.food=Math.max(0,player.food-dt*0.003);
    player.water=Math.max(0,player.water-dt*0.005);
    updateHUD();

    cookingCheckTimer+=dt;
    if(cookingCheckTimer>0.5){
        cookingCheckTimer=0;
        let needRerender=false;
        for(let i=0;i<INVENTORY_SIZE;i++){
            const slot=inventory[i];
            if(slot&&slot.type==='cooking'){
                const elapsed=performance.now()-slot.startTime;
                if(elapsed>=COOK_TIME){
                    inventory[i]={type:'ready',fishType:slot.fishType,weight:slot.weight};
                    try{Snd.readyDing()}catch(e){}
                    needRerender=true;
                } else if(invOpen){
                    needRerender=true;
                }
            }
        }
        if(needRerender&&invOpen)renderInventory();
    }

    if(G.state==='charging'){const el=performance.now()-G.chS;G.pow=Math.min(1,el/G.chD);drawPR();return}
    if(G.state==='flying'){
        G.fP+=dt/G.fD;
        if(G.fP>=1){
            G.fP=1;G.flX=G.fTX;G.flY=G.fTY;G.spT=performance.now();floatInWater=true;
            const pan=Math.max(-1,Math.min(1,((G.fTX-W/2)/W)*2));
            if(canPlaySound())try{Snd.splash(G.pow,pan)}catch(e){}
            startWaiting();
        }
        return;
    }
    if(G.state==='waiting'){
        G.waitTimer+=dt;
        if(G.waitTimer>=G.waitDur){
            const t=FISH_TYPES[G.fishType];
            G.state='bite';G.biteTimer=0;G.biteWindow=t.biteWindow;
            cb.classList.add('bite');
            setTimeout(()=>{if(canPlaySound())try{Snd.bite()}catch(e){}},0);
        }
        return;
    }
    if(G.state==='bite'){
        G.biteTimer+=dt;
        if(G.biteTimer>=G.biteWindow){
            cb.classList.remove('bite');
            if(canPlaySound())try{Snd.fail()}catch(e){}
            G.state='idle';G.fishType=null;floatInWater=false;G.missDelay=1.5;
        }
        return;
    }
    if(G.state==='reeling'){
        const elapsed=(performance.now()-G.reelStartTime)/1000;
        const t=Math.min(1,elapsed/G.reelDur);
        G.flX=G.reelStartX+(G.reelEndX-G.reelStartX)*t;
        G.flY=G.reelStartY+(G.reelEndY-G.reelStartY)*t-Math.sin(t*Math.PI)*80;
        return;
    }
    if(G.missDelay>0){G.missDelay-=dt;if(G.missDelay<=0)G.missDelay=0}
}

    requestAnimationFrame(loop);
    try{
        const idle=performance.now()-lastInteraction;
        if(idle>IDLE_TIMEOUT&&!paused)paused=true;
        if(paused){if(n-lFT<3000)return;lFT=n;drawDyn();return}
        if(n-lFT<FI)return;
        lFT=n;
        const dt=Math.min((n-lUT)*.001,.05);lUT=n;
        updateWorld(dt);
        updateFishing(dt);
        drawDyn();
    }catch(e){
        console.error('Loop error:',e);
    }
}

addEventListener('resize',resize);
requestAnimationFrame(loop);
document.addEventListener('touchmove',e=>{if(e.target===cv||e.target===cb)e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
applyResize();
})();
</script>
</body>
</html>
