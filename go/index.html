<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d" media="(prefers-color-scheme:dark)">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme:light)">
<meta name="description" content="Коллекция браузерных мини-игр. Без установки, каждая игра — своя ссылка.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Игры</title>
<link rel="icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#08090d; --bg-soft:#0d0f15; --card:#14161f; --card-hi:#1b1e2a;
  --txt:#f3f5fa; --dim:#8b90a0; --line:rgba(255,255,255,.09);
  --acc:#5b8cff; --acc-soft:rgba(91,140,255,.16);
  --r:20px; --r-sm:14px; --gap:12px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f5f6fa; --bg-soft:#eceef5; --card:#ffffff; --card-hi:#f2f4f9;
    --txt:#111319; --dim:#6b7280; --line:rgba(0,0,0,.07);
    --acc:#3b6fe0; --acc-soft:rgba(59,111,224,.12);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  min-height:100dvh; overflow-x:hidden;
  padding-bottom:calc(var(--safe-b) + 32px);
}
body::before{
  content:''; position:fixed; inset:-20% -20% auto -20%; height:70vh; z-index:-1;
  background:radial-gradient(45% 55% at 20% 0%,var(--acc-soft),transparent 70%),
             radial-gradient(45% 55% at 90% 10%,rgba(34,211,166,.14),transparent 70%);
  pointer-events:none;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 14px}

/* ── Шапка ───────────────────────────────────────────── */
header{
  position:sticky; top:0; z-index:30;
  padding-top:var(--safe-t);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid transparent; transition:border-color .25s;
}
header.stuck{border-bottom-color:var(--line)}
.head{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.4px;flex:1;min-width:0}
.logo .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#22d3a6);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.iconbtn{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--card); border:1px solid var(--line); transition:transform .12s,background .2s;
}
.iconbtn:active{transform:scale(.92);background:var(--card-hi)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.search{position:relative;padding-bottom:10px}
.search svg{position:absolute;left:13px;top:13px;width:19px;height:19px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round}
.search input{
  width:100%;height:46px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--card);padding:0 42px 0 40px;font-size:16px;outline:none;transition:border-color .2s,background .2s;
}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--acc);background:var(--card-hi)}
.search .clear{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:11px;display:none;place-items:center;color:var(--dim)}
.search.has .clear{display:grid}
.search .clear svg{position:static;stroke:currentColor;width:17px;height:17px}

/* ── Чипсы ───────────────────────────────────────────── */
.chips{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:2px 0 12px;margin:0 -14px;padding-left:14px;padding-right:14px;
  scroll-snap-type:x proximity;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;scroll-snap-align:start;height:40px;padding:0 15px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--dim);
  font-size:14px;font-weight:600;white-space:nowrap;transition:all .18s;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--txt);color:var(--bg);border-color:transparent}

/* ── Секции ──────────────────────────────────────────── */
.sect{margin-bottom:22px}
.sect-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding:0 2px}
.sect-head h2{font-size:15px;font-weight:750;letter-spacing:.2px}
.sect-head span{font-size:13px;color:var(--dim)}
.sect-head .spacer{flex:1}
.seg{display:flex;gap:2px;background:var(--bg-soft);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:650;color:var(--dim)}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 6px rgba(0,0,0,.18)}

/* ── Продолжить ──────────────────────────────────────── */
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 4px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.mini{
  flex:0 0 auto;width:132px;scroll-snap-align:start;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--card);padding:10px;transition:transform .12s;
}
.mini:active{transform:scale(.96)}
.mini .cv{height:52px;border-radius:10px;display:grid;place-items:center;font-size:26px;margin-bottom:8px}
.mini b{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{color:var(--dim);font-size:11.5px}

/* ── Сетка игр ───────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--gap)}
.card{
  position:relative;border-radius:var(--r);overflow:hidden;background:var(--card);
  border:1px solid var(--line);transition:transform .14s ease,background .2s;display:block;
}
@media (hover:hover){.card:hover{background:var(--card-hi);transform:translateY(-2px)}}
.card:active{transform:scale(.965)}
.card .cover{
  position:relative;aspect-ratio:1/.92;display:grid;place-items:center;font-size:52px;
  background:linear-gradient(140deg,var(--c1),var(--c2));
}
.card .cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.35))}
.card .cover .em{position:relative;z-index:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.card .badge{
  position:absolute;top:8px;left:8px;z-index:2;font-size:11px;font-weight:700;letter-spacing:.3px;
  padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(6px);
}
.card .star{
  position:absolute;top:6px;right:6px;z-index:2;width:34px;height:34px;border-radius:11px;
  display:grid;place-items:center;color:#fff;font-size:16px;text-shadow:0 2px 6px rgba(0,0,0,.5);
  opacity:.55;transition:opacity .2s,transform .12s;
}
.card .star.on{opacity:1;color:#ffd54a}
.card .star:active{transform:scale(.85)}
.card .info{padding:10px 11px 12px}
.card .info b{display:block;font-size:14.5px;font-weight:680;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .info small{display:block;margin-top:3px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:46px 16px;color:var(--dim)}
.empty .big{font-size:40px;margin-bottom:8px}

/* ── Кнопка вверх ────────────────────────────────────── */
#top{
  position:fixed;right:14px;bottom:calc(var(--safe-b) + 16px);z-index:25;
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);color:var(--txt);
  opacity:0;pointer-events:none;transform:translateY(12px);transition:all .22s;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
#top.show{opacity:1;pointer-events:auto;transform:none}
#top svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Шторка действий ─────────────────────────────────── */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);animation:fade .2s}
.sheet .panel{
  position:relative;width:100%;max-width:520px;background:var(--bg-soft);
  border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:10px 16px calc(var(--safe-b) + 18px);animation:up .26s cubic-bezier(.2,.9,.25,1);
}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet .who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sheet .who .cv{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;flex:0 0 auto}
.sheet .who b{display:block;font-size:16px}
.sheet .who small{color:var(--dim);font-size:12.5px}
.sheet .acts{display:grid;gap:8px}
.sheet .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{
  height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  font-size:14px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--acc);border-color:transparent;color:#fff}
.sheet .hint{margin-top:10px;font-size:12px;color:var(--dim);text-align:center;word-break:break-all}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 76px);transform:translate(-50%,10px);
  background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:650;
  opacity:0;pointer-events:none;transition:all .22s;z-index:70;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{text-align:center;color:var(--dim);font-size:12px;padding:26px 0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header id="hdr">
  <div class="wrap">
    <div class="head">
      <div class="logo"><span class="dot">🎮</span>Игры</div>
      <button class="iconbtn" id="btn-random" title="Случайная игра" aria-label="Случайная игра">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="iconbtn" id="btn-install" hidden title="Установить на телефон" aria-label="Установить приложение">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 19h16"/></svg>
      </button>
    </div>
    <div class="search" id="searchbox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Поиск игры" aria-label="Поиск игры">
      <button class="clear" id="qclear" aria-label="Очистить"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap">
  <section class="sect" id="sect-continue" hidden>
    <div class="sect-head"><h2>Продолжить</h2></div>
    <div class="rail" id="rail"></div>
  </section>

  <section class="sect">
    <div class="sect-head">
      <h2 id="list-title">Все игры</h2>
      <span id="count">0</span>
      <span class="spacer"></span>
      <div class="seg" id="sort">
        <button data-sort="new" class="on">Новые</button>
        <button data-sort="top">Топ</button>
        <button data-sort="az">А-Я</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="big">🔍</div>
      Ничего не нашлось
    </div>
  </section>

  <footer>Каждая игра — своя ссылка. Сохраняй в закладки и делись.</footer>
</main>

<button id="top" aria-label="Наверх"><svg viewBox="0 0 24 24"><path d="M12 20V5m0 0-6 6m6-6 6 6"/></svg></button>

<div class="sheet" id="sheet" hidden>
  <div class="bg" data-close></div>
  <div class="panel">
    <div class="grab"></div>
    <div class="who">
      <div class="cv" id="sh-cv">🎮</div>
      <div>
        <b id="sh-title"></b>
        <small id="sh-sub"></small>
      </div>
    </div>
    <div class="acts">
      <button class="btn primary" id="sh-play">Играть</button>
      <div class="row">
        <button class="btn" id="sh-fav">☆ В избранное</button>
        <button class="btn" id="sh-link">Ссылка</button>
        <button class="btn" id="sh-share">Поделиться</button>
      </div>
      <div class="hint" id="sh-url"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<noscript><div class="wrap" style="padding:20px 14px">Для работы сайта нужен JavaScript.</div></noscript>

<script src="games.js"></script>
<script>
(function () {
  'use strict';

  /* ── Данные ───────────────────────────────────────── */
  const FALLBACK = [
    { slug:'utki', title:'Утки', desc:'', url:'games/utki/', cover:'🦆', tags:['аркада'], colors:['#f7b733','#fc4a1a'], date:'2026-09-17', pinned:true },
    { slug:'fishing', title:'Рыбалка', desc:'', url:'games/fishing/', cover:'🎣', tags:['симулятор'], colors:['#38bdf8','#0ea5e9'], date:'2026-09-17' }
  ];
  const POOL = ['#f7b733','#fc4a1a','#5b8cff','#22d3a6','#a855f7','#ec4899','#38bdf8','#facc15','#f97316','#14b8a6'];

  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem('hub.' + k)); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('hub.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  let games = (Array.isArray(window.GAMES) && window.GAMES.length ? window.GAMES : FALLBACK).filter(g => g && g.title && g.url);

  // ?draft=1 — предпросмотр черновика из админки (виден только в этом браузере)
  if (new URLSearchParams(location.search).has('draft')) {
    const draft = store.get('hubdraft', null);
    if (Array.isArray(draft) && draft.length) games = draft;
  }
  let plays = store.get('plays', {});
  let recents = store.get('recents', {});
  let favs = store.get('favs', []);
  let sort = 'new';
  let tag = 'all';
  let query = '';

  const $ = s => document.querySelector(s);
  const grid = $('#grid'), rail = $('#rail'), chips = $('#chips'), sheet = $('#sheet');

  /* ── Утилиты ──────────────────────────────────────── */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const color = g => (g.colors && g.colors[0]) || POOL[hash(g.slug || g.title) % POOL.length];
  const color2 = g => (g.colors && g.colors[1]) || POOL[(hash(g.slug || g.title) + 4) % POOL.length];
  function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  const isExt = g => /^https?:/i.test(g.url);
  const link = g => g.url;
  // запуск через обёртку: игра разворачивается на весь экран
  const launch = g => isExt(g) ? g.url : 'play.html?g=' + encodeURIComponent(g.slug);
  const isFav = g => favs.indexOf(g.slug) > -1;
  const playCount = g => plays[g.slug] || 0;

  function toast(text) {
    const t = $('#toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 1600);
  }
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  /* ── Фильтр / сортировка ──────────────────────────── */
  function visible() {
    const q = query.trim().toLowerCase();
    let list = games.filter(g => {
      if (tag === 'fav' && !isFav(g)) return false;
      if (tag !== 'all' && tag !== 'fav' && !(g.tags || []).map(t => t.toLowerCase()).includes(tag)) return false;
      if (!q) return true;
      return (g.title + ' ' + (g.desc || '') + ' ' + (g.tags || []).join(' ')).toLowerCase().includes(q);
    });
    const d = g => Date.parse(g.date || 0) || 0;
    if (sort === 'new') list.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || d(b) - d(a));
    if (sort === 'top') list.sort((a, b) => playCount(b) - playCount(a) || d(b) - d(a));
    if (sort === 'az') list.sort((a, b) => a.title.localeCompare(b.title, 'ru'));
    return list;
  }

  /* ── Разметка ─────────────────────────────────────── */
  function cardHTML(g) {
    const tags = g.tags || [];
    return '<a class="card" href="' + esc(launch(g)) + '" data-slug="' + esc(g.slug) + '"' +
      (isExt(g) ? ' target="_blank" rel="noopener"' : '') +
      ' style="--c1:' + esc(color(g)) + ';--c2:' + esc(color2(g)) + '">' +
      '<div class="cover">' +
        (g.pinned ? '<span class="badge">NEW</span>' : '') +
        '<button class="star' + (isFav(g) ? ' on' : '') + '" data-fav="' + esc(g.slug) + '" aria-label="В избранное">' + (isFav(g) ? '★' : '☆') + '</button>' +
        '<span class="em">' + esc(g.cover || g.title.slice(0, 1).toUpperCase()) + '</span>' +
      '</div>' +
      '<div class="info"><b>' + esc(g.title) + '</b><small>' + esc(tags.slice(0, 2).join(' · ') || 'игра') + '</small></div>' +
    '</a>';
  }

  function renderChips() {
    const tags = [];
    games.forEach(g => (g.tags || []).forEach(t => { const k = t.toLowerCase(); if (tags.indexOf(k) < 0) tags.push(k); }));
    const list = [{ id: 'all', label: 'Все' }, { id: 'fav', label: '★ Избранное' }].concat(tags.map(t => ({ id: t, label: t })));
    chips.innerHTML = list.map(c => '<button class="chip' + (tag === c.id ? ' on' : '') + '" data-tag="' + esc(c.id) + '">' + esc(c.label) + '</button>').join('');
  }

  function renderRail() {
    const recent = games.filter(g => recents[g.slug]).sort((a, b) => recents[b.slug] - recents[a.slug]).slice(0, 8);
    $('#sect-continue').hidden = recent.length === 0;
    rail.innerHTML = recent.map(g =>
      '<a class="mini" href="' + esc(launch(g)) + '" data-slug="' + esc(g.slug) + '"' + (isExt(g) ? ' target="_blank" rel="noopener"' : '') + '>' +
        '<div class="cv" style="background:linear-gradient(140deg,' + esc(color(g)) + ',' + esc(color2(g)) + ')">' + esc(g.cover || '🎮') + '</div>' +
        '<b>' + esc(g.title) + '</b><small>' + (playCount(g) ? playCount(g) + ' запусков' : 'недавно') + '</small>' +
      '</a>').join('');
  }

  function renderGrid() {
    const list = visible();
    $('#count').textContent = list.length === 1 ? '1 игра' : list.length + ' игр';
    $('#list-title').textContent = tag === 'fav' ? 'Избранное' : tag === 'all' ? 'Все игры' : tag;
    grid.innerHTML = list.map(cardHTML).join('');
    $('#empty').hidden = list.length > 0;
  }

  function render() { renderChips(); renderRail(); renderGrid(); }

  /* ── События: тап по игре ─────────────────────────── */
  let pressTimer = null, longPressed = false;

  document.addEventListener('pointerdown', e => {
    const card = e.target.closest('.card, .mini');
    if (!card || e.target.closest('[data-fav]')) return;
    longPressed = false;
    pressTimer = setTimeout(() => {
      longPressed = true;
      openSheet(card.dataset.slug);
      buzz(15);
    }, 430);
  }, { passive: true });

  ['pointerup', 'pointercancel', 'pointermove', 'scroll'].forEach(ev =>
    document.addEventListener(ev, () => { clearTimeout(pressTimer); }, { passive: true }));

  document.addEventListener('click', e => {
    const favBtn = e.target.closest('[data-fav]');
    if (favBtn) {
      e.preventDefault(); e.stopPropagation();
      toggleFav(favBtn.dataset.fav);
      return;
    }
    const card = e.target.closest('.card, .mini');
    if (!card) return;
    if (longPressed) { e.preventDefault(); longPressed = false; return; }
    markPlayed(card.dataset.slug);
  });

  document.addEventListener('contextmenu', e => {
    const card = e.target.closest('.card, .mini');
    if (!card) return;
    e.preventDefault();
    openSheet(card.dataset.slug);
  });

  function toggleFav(slug) {
    const i = favs.indexOf(slug);
    if (i < 0) { favs.push(slug); toast('В избранном'); } else { favs.splice(i, 1); toast('Убрано'); }
    store.set('favs', favs);
    buzz(10);
    render();
    if (!sheet.hidden) openSheet(slug, true);
  }

  function markPlayed(slug) {
    const g = games.find(x => x.slug === slug);
    if (!g) return;
    plays[slug] = (plays[slug] || 0) + 1;
    recents[slug] = Date.now();
    store.set('plays', plays);
    store.set('recents', recents);
  }

  /* ── Шторка ───────────────────────────────────────── */
  let sheetGame = null;

  function openSheet(slug, keep) {
    const g = games.find(x => x.slug === slug);
    if (!g) return;
    sheetGame = g;
    $('#sh-cv').textContent = g.cover || '🎮';
    $('#sh-cv').style.background = 'linear-gradient(140deg,' + color(g) + ',' + color2(g) + ')';
    $('#sh-title').textContent = g.title;
    $('#sh-sub').textContent = (g.tags || []).join(' · ') + (playCount(g) ? ' · ' + playCount(g) + ' запусков' : '');
    $('#sh-fav').textContent = isFav(g) ? '★ В избранном' : '☆ В избранное';
    $('#sh-url').textContent = 'прямая ссылка: ' + new URL(link(g), location.href).href;
    if (!keep) { buzz(12); history.pushState({ sheet: 1 }, ''); }
    sheet.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeSheet() {
    sheet.hidden = true;
    sheetGame = null;
    document.body.style.overflow = '';
  }

  sheet.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
  window.addEventListener('popstate', () => { if (!sheet.hidden) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

  $('#sh-play').addEventListener('click', () => {
    if (!sheetGame) return;
    markPlayed(sheetGame.slug);
    if (isExt(sheetGame)) window.open(link(sheetGame), '_blank', 'noopener');
    else location.href = launch(sheetGame);
  });
  $('#sh-fav').addEventListener('click', () => sheetGame && toggleFav(sheetGame.slug));
  $('#sh-link').addEventListener('click', async () => {
    if (!sheetGame) return;
    const url = new URL(link(sheetGame), location.href).href;
    try { await navigator.clipboard.writeText(url); toast('Ссылка скопирована'); }
    catch (e) { window.prompt('Ссылка на игру:', url); }
  });
  $('#sh-share').addEventListener('click', async () => {
    if (!sheetGame) return;
    const url = new URL(link(sheetGame), location.href).href;
    const data = { title: sheetGame.title, text: sheetGame.desc || sheetGame.title, url: url };
    if (navigator.share) { try { await navigator.share(data); } catch (e) {} }
    else { try { await navigator.clipboard.writeText(url); toast('Ссылка скопирована'); } catch (e) {} }
  });

  /* ── Поиск / чипсы / сортировка ───────────────────── */
  const qEl = $('#q'), qBox = $('#searchbox');
  let qTimer;
  qEl.addEventListener('input', () => {
    qBox.classList.toggle('has', qEl.value.length > 0);
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { query = qEl.value; renderGrid(); }, 120);
  });
  $('#qclear').addEventListener('click', () => {
    qEl.value = ''; query = ''; qBox.classList.remove('has'); renderGrid(); qEl.blur();
  });

  chips.addEventListener('click', e => {
    const b = e.target.closest('[data-tag]');
    if (!b) return;
    tag = b.dataset.tag;
    buzz(8);
    renderChips(); renderGrid();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('#sort').addEventListener('click', e => {
    const b = e.target.closest('[data-sort]');
    if (!b) return;
    sort = b.dataset.sort;
    [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
    renderGrid();
  });

  $('#btn-random').addEventListener('click', () => {
    const list = visible();
    if (!list.length) return toast('Пусто');
    const g = list[Math.floor(Math.random() * list.length)];
    buzz(12);
    markPlayed(g.slug);
    location.href = launch(g);
  });

  /* ── Скролл: рамка шапки + кнопка вверх ───────────── */
  const hdr = $('#hdr'), top = $('#top');
  let raf = false;
  window.addEventListener('scroll', () => {
    if (raf) return;
    raf = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      hdr.classList.toggle('stuck', y > 4);
      top.classList.toggle('show', y > 500);
      raf = false;
    });
  }, { passive: true });
  top.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  /* ── PWA ──────────────────────────────────────────── */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  let installEvent = null;
  const btnInstall = $('#btn-install');
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    installEvent = e;
    btnInstall.hidden = false;
  });
  btnInstall.addEventListener('click', async () => {
    if (!installEvent) return;
    installEvent.prompt();
    await installEvent.userChoice;
    installEvent = null;
    btnInstall.hidden = true;
  });

  render();
})();
</script>
</body>
</html>
