<script>
// === ARCHIVE PAGE LOGIC ===
let allArticles = [];
let currentCategory = 'all';
let currentPage = 1;
const perPage = 6;

function escapeHTML(value) {
  const div = document.createElement('div');
  div.textContent = value == null ? '' : String(value);
  return div.innerHTML;
}

function trackArchiveEvent(name, params) {
  if (window.One1GameAnalytics && typeof window.One1GameAnalytics.track === 'function') {
    window.One1GameAnalytics.track(name, params || {});
  }
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    allArticles = window.allArticles || [];
    // Read ?category= from URL
    const params = new URLSearchParams(window.location.search);
    const catParam = params.get('category');
    if (catParam) {
      currentCategory = catParam;
    }
    initFilters();
    filterAndDisplay();
    initSearch();
  }, 100);
});

function initFilters() {
  const catOrder = ['Технологии', 'Гайды', 'Консоли', 'Аналитика', 'Тренды', 'Разработка', 'Мнение', 'Во что поиграть?'];
  const cats = [...new Set(allArticles.map(a => a.category))].sort((a, b) => {
    const ai = catOrder.indexOf(a), bi = catOrder.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });
  const categories = ['all', ...cats];
  const filterEl = document.getElementById('category-filter');
  filterEl.innerHTML = categories.map(c => {
    const safeCategory = escapeHTML(c);
    const label = c === 'all' ? 'Все' : safeCategory;
    return `<button type="button" class="cat-pill${c === currentCategory ? ' active' : ''}" data-category="${safeCategory}" aria-pressed="${c === currentCategory}">${label}</button>`;
  }).join('');

  filterEl.addEventListener('click', e => {
    if (e.target.classList.contains('cat-pill')) {
      filterEl.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentCategory = e.target.dataset.category;
      currentPage = 1;
      filterEl.querySelectorAll('.cat-pill').forEach(b => b.setAttribute('aria-pressed', String(b === e.target)));
      trackArchiveEvent('archive_filter', { category: currentCategory });
      filterAndDisplay();
    }
  });
}

function initSearch() {
  const input = document.getElementById('article-search');
  if (!input) return;
  input.addEventListener('input', () => {
    currentPage = 1;
    trackArchiveEvent('archive_search', { has_query: Boolean(input.value.trim()) });
    filterAndDisplay();
  });
}

function filterAndDisplay() {
  const query = (document.getElementById('article-search')?.value || '').toLowerCase().trim();
  let filtered = allArticles;

  if (currentCategory !== 'all') {
    filtered = filtered.filter(a => a.category === currentCategory);
  } else {
    // В «Все» не показываем игры — они в отдельном разделе
    filtered = filtered.filter(a => a.category !== 'Во что поиграть?');
  }
  if (query) {
    filtered = filtered.filter(a =>
      a.title.toLowerCase().includes(query) ||
      a.excerpt.toLowerCase().includes(query) ||
      (a.category || '').toLowerCase().includes(query)
    );
  }

  const totalPages = Math.ceil(filtered.length / perPage);
  const start = (currentPage - 1) * perPage;
  const pageArticles = filtered.slice(start, start + perPage);

  const container = document.getElementById('articles-list');
  if (pageArticles.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-search"></i></div><h3>Ничего не найдено</h3><p>Попробуйте изменить запрос или категорию.</p></div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  // Производные WebP-варианты: -800.webp достаточно для ленты
  const srcsetAttr = (src, isLead) => {
    if (!/\.webp$/i.test(src)) return '';
    const small = src.replace(/\.webp$/i, '-800.webp');
    const sizes = isLead
      ? '(min-width: 900px) 1100px, 100vw'
      : '(min-width: 1220px) 190px, (min-width: 640px) 140px, 92px';
    return ` srcset="${small} 800w, ${src} 1344w" sizes="${sizes}"`;
  };

  const pad3 = n => String(n).padStart(3, '0');

  container.innerHTML = pageArticles.map((a, idx) => {
    const isFirst = (currentPage === 1 && idx === 0);
    const safeUrl = escapeHTML(a.url || '#');
    const safeImage = escapeHTML(a.image || '');
    const safeTitle = escapeHTML(a.title || '');
    const safeCategory = escapeHTML(a.category || '');
    const safeExcerpt = escapeHTML(a.excerpt || '');
    const safeDate = escapeHTML(a.date || '');
    const safeReadTime = escapeHTML(a.readTime || '');
    const meta = [safeDate, safeReadTime].filter(Boolean).join(' · ');
    return `
    <a href="${safeUrl}" class="entry${isFirst ? ' entry--lead' : ''}">
      <span class="entry-no">${pad3(start + idx + 1)}</span>
      ${safeImage ? `<span class="entry-thumb fx"><img src="${safeImage}" alt="${safeTitle}" loading="${isFirst ? 'eager' : 'lazy'}" fetchpriority="${isFirst ? 'high' : 'auto'}" decoding="async" width="1344" height="768"${srcsetAttr(safeImage, isFirst)}></span>` : '<span class="entry-thumb fx"></span>'}
      <span class="entry-main">
        <span class="entry-top">
          ${safeCategory ? `<span class="entry-cat">#${safeCategory.toLowerCase()}</span>` : ''}
          ${meta ? `<span class="entry-meta">${meta}</span>` : ''}
        </span>
        <span class="entry-title">${safeTitle}</span>
        ${safeExcerpt ? `<span class="entry-excerpt">${safeExcerpt}</span>` : ''}
        ${isFirst ? '<span class="entry-open">открыть материал</span>' : ''}
      </span>
    </a>`;
  }).join('');

  // Pagination
  const pagEl = document.getElementById('pagination');
  if (totalPages <= 1) { pagEl.innerHTML = ''; return; }
  let pagHTML = '';
  for (let i = 1; i <= totalPages; i++) {
    pagHTML += `<button class="page-btn${i === currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`;
  }
  pagEl.innerHTML = pagHTML;
  pagEl.querySelectorAll('.page-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPage = parseInt(btn.dataset.page, 10);
      trackArchiveEvent('archive_page', { page: currentPage });
      filterAndDisplay();
      window.scrollTo({ top: 300, behavior: 'smooth' });
    });
  });
}
</script>

<!-- Card mouse tracking (spotlight effect) -->
<script>
document.addEventListener('mouseover', e => {
  const card = e.target.closest('.article-card');
  if (!card) return;
  const rect = card.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;
  card.style.setProperty('--mouse-x', x + '%');
  card.style.setProperty('--mouse-y', y + '%');
});
</script>
