<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Восстановление пароля — L2 x3 DUO PLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0a0b0e;
    --panel: #15171d;
    --panel-raised: #1c1f27;
    --hairline: rgba(184,147,62,0.22);
    --gold: #b8933e;
    --gold-bright: #e6c56d;
    --blood: #7a1b26;
    --blood-bright: #b8384a;
    --parchment: #cdc7b8;
    --parchment-dim: #8e8a7d;
    --muted: #5c5f6a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(184,147,62,0.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 10%, rgba(122,27,38,0.10), transparent 55%),
      var(--ink);
    color: var(--parchment);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }
  a{ color:inherit; text-decoration:none; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: .72rem;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--gold);
    display:flex; align-items:center; gap:.7em;
    justify-content:center;
  }
  .eyebrow::before, .eyebrow::after{
    content:''; height:1px; width:28px; background: var(--hairline);
  }

  .topbar{
    position: sticky; top:0; z-index: 50;
    display:flex; align-items:center; justify-content:space-between;
    padding: 1.1rem 4vw;
    background: rgba(10,11,14,0.72);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--hairline);
  }
  .logo{ font-family:'Yeseva One', serif; font-size:1.25rem; color: var(--parchment); letter-spacing:.02em;}
  .logo span{ color: var(--gold);}
  .nav-links{ display:flex; gap:2rem; font-size:.88rem; color: var(--parchment-dim);}
  .nav-links a{ transition: color .2s; }
  .nav-links a:hover{ color: var(--gold-bright); }

  .page-section{
    position:relative;
    max-width: 520px;
    margin: 0 auto;
    padding: 5rem 1.5rem 4rem;
    text-align:center;
  }
  .page-section::before, .page-section::after{
    content:''; position:absolute; width:26px; height:26px;
    border: 1px solid var(--hairline);
    top: 1.4rem;
  }
  .page-section::before{ left:.4rem; border-right:none; border-bottom:none; }
  .page-section::after{ right:.4rem; border-left:none; border-bottom:none; }

  .page-section h1{
    font-family:'Yeseva One', serif;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    line-height: 1.15;
    color: var(--parchment);
    margin: 1.3rem 0 .6rem;
    text-shadow: 0 0 30px rgba(184,147,62,0.12);
  }
  .page-desc{
    color: var(--parchment-dim);
    font-size: .93rem;
    margin-bottom: 2.4rem;
  }

  .form-card{ max-width: 400px; margin: 0 auto; }
  .field{ margin-bottom: 1.2rem; text-align:left; }
  .field label{
    display: block;
    font-family:'JetBrains Mono', monospace;
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--parchment-dim);
    margin-bottom: .45rem;
  }
  .field input{
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: .8rem 1rem;
    color: var(--parchment);
    font-size: .93rem;
    font-family: 'JetBrains Mono', monospace;
    transition: border-color .2s, box-shadow .2s;
    outline: none;
  }
  .field input:focus{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,147,62,0.08);
  }
  .field input.input-error{ border-color: var(--blood-bright); }
  .field-hint{
    display: block;
    font-size: .74rem;
    margin-top: .35rem;
    min-height: 1.1em;
    color: var(--muted);
    transition: color .2s;
  }
  .field-hint.error{ color: var(--blood-bright); }

  .btn{
    padding: .85rem 1.8rem;
    font-size: .92rem;
    font-weight:600;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor:pointer;
    transition: transform .18s, box-shadow .18s, background .18s;
    display:inline-block;
    width: 100%;
  }
  .btn-primary{
    background: linear-gradient(160deg, var(--gold-bright), var(--gold));
    color: #191307;
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 8px 24px rgba(184,147,62,0.28); }
  .btn-primary:disabled{ opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

  .form-msg{
    margin-top: 1rem;
    text-align: center;
    font-size: .84rem;
    padding: .75rem 1rem;
    border-radius: 3px;
    line-height: 1.5;
  }
  .form-msg.success{ background: rgba(184,147,62,0.08); color: var(--gold-bright); }
  .form-msg.error{ background: rgba(122,27,38,0.12); color: var(--blood-bright); }
  .form-msg small{ display:inline-block; margin-top:.3rem; opacity:.7; }

  .form-footer-link{ text-align:center; margin-top:1.5rem; font-size:.84rem; color: var(--parchment-dim); }
  .form-footer-link a{ color: var(--gold); transition: color .2s; }
  .form-footer-link a:hover{ color: var(--gold-bright); }

  .footer{
    text-align:center; padding: 2.5rem 1.5rem 3rem;
    font-size: .78rem; color: var(--muted);
    border-top: 1px solid var(--hairline);
  }
</style>
</head>
<body>

<nav class="topbar">
  <a href="index.html" class="logo">L2<span>·</span>Server</a>
  <div class="nav-links">
    <a href="index.html">Главная</a>
    <a href="register.html">Регистрация</a>
  </div>
</nav>

<section class="page-section">
  <p class="eyebrow">Восстановление доступа</p>
  <h1>Забыли пароль?</h1>
  <p class="page-desc">Новый пароль придёт на email, указанный при регистрации.</p>

  <form class="form-card" id="recover-form" novalidate>
    <div class="field">
      <label for="rec-email">Email</label>
      <input type="email" id="rec-email" placeholder="example@mail.com" autocomplete="email" required>
      <span class="field-hint" id="hint-recover"></span>
    </div>
    <button type="submit" class="btn btn-primary" id="rec-btn">Восстановить пароль</button>
    <div class="form-msg" id="rec-msg"></div>
  </form>

  <p class="form-footer-link"><a href="register.html">Вернуться к регистрации</a></p>
</section>

<footer class="footer">
  <p>Lineage 2 — зарегистрированный товарный знак NCSoft Corporation. Неофициальный проект.</p>
</footer>

<script>
const API = 'https://l2advps.duckdns.org';

function showHint(id, text, error) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'field-hint' + (error ? ' error' : '');
}

const recForm = document.getElementById('recover-form');
const recEmail = document.getElementById('rec-email');
const recMsg = document.getElementById('rec-msg');
const recBtn = document.getElementById('rec-btn');

recForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = recEmail.value.trim();
  recMsg.className = 'form-msg';
  recMsg.textContent = '';

  if (!email) { showHint('hint-recover', 'Email обязателен', true); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showHint('hint-recover', 'Некорректный email', true); return; }

  showHint('hint-recover', '', false);
  recBtn.disabled = true;
  recBtn.textContent = 'Отправка...';

  try {
    const resp = await fetch(`${API}/api/recover`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await resp.json();
    if (data.success) {
      recMsg.className = 'form-msg success';
      recMsg.innerHTML = data.message + '<br><small>Проверьте папку «Спам», если письма нет во Входящих.</small>';
      recForm.reset();
    } else {
      recMsg.className = 'form-msg error';
      recMsg.textContent = data.error || 'Не удалось восстановить';
    }
  } catch(err) {
    recMsg.className = 'form-msg error';
    recMsg.textContent = 'Сервер временно недоступен. Попробуйте позже.';
  }
  recBtn.disabled = false;
  recBtn.textContent = 'Восстановить пароль';
});

recEmail.addEventListener('input', () => {
  showHint('hint-recover', '', false);
});
</script>

</body>
</html>
