  [0, 5, 2, 6], [0, 5, 3, 4], [0, 3, 5, 6], [0, 6, 5, 4], [0, 2, 5, 4],
];

const GENRES = {
  ambient: {
    label: 'Ambient',
    kicker: 'Generated Ambient',
    bpm: [72, 108],
    modes: ['aeolian', 'dorian', 'phrygian', 'lydian', 'mixolydian', 'pentMin', 'hirajoshi'],
    swing: [0.02, 0.08],
    reverb: [0.32, 0.38, 0.45],
    delay: 0.22,
    noiseMul: 1,
    drums: false,
    bass808: false,
    master: 0.68,
    highShelf: 1.8,
    dustLP: 20000,
    crackle: 0,
    palettes: PALETTES,
    coverStyles: COVER_STYLES,
    names: { adj: NAME_ADJ_1, adj2: NAME_ADJ_2, noun: NAME_NOUN },
    progressions: PROGRESSIONS,
  },
  hipHop: {
    label: 'Hip Hop',
    kicker: 'Generated Hip Hop',
    bpm: [80, 96],
    modes: ['aeolian', 'dorian', 'phrygian', 'pentMin'],
    keyRoots: [33, 36, 38, 40, 41],
    swing: [0.08, 0.16],
    // один короткий конволювер: бит-ориентированный жанр и быстрее рендерится
    reverb: [0.24, 0, 0],
    delay: 0.12,
    noiseMul: 0.35,
    drums: true,
    bass808: true,
    beatStyles: HIPHOP_SUBSTYLES,
    master: 0.6,
    highShelf: -1.5,
    dustLP: 10500,
    crackle: 0.6,
    palettes: PALETTES_HIPHOP,
    coverStyles: COVER_STYLES_HIPHOP,
    names: { adj: NAME_HH_ADJ, adj2: NAME_HH_ADJ_2, noun: NAME_HH_NOUN },
    progressions: HIPHOP_PROGRESSIONS,
  },
};

function scheduleHipHop(off, o) {
  const { dryDest, kickDest, musicBus, reverbShort, subDest, sidechain, bassDuck,
          sub, scale, keyRoot, progression, sec, beatSec, barSec, swingPct } = o;
  const stepSec = beatSec / 4;
  // свинг в процентах (54-62%) — сдвиг off-восьмых, «живой» грув, а не «пьяный»
  const swingOff = (swingPct - 0.5) * 2 * stepSec;

  const noiseData = generateNoiseBuffer('white', 1);
  const noiseBuf = off.createBuffer(2, noiseData.len, SR);
  noiseBuf.getChannelData(0).set(noiseData.ch0);
  noiseBuf.getChannelData(1).set(noiseData.ch1);

  function curveFor(k) {
    const c = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) {
      const x = (i / 1023) * 2 - 1;
      c[i] = Math.tanh(x * k) / Math.tanh(k);
    }
    return c;
  }

  // грязь семплера (SP-1200/MPC) на драм-шине
  const drive = off.createWaveShaper();
  drive.curve = curveFor(1.7);

  const drumBus = off.createGain();
  drumBus.gain.value = 0.92;
  drumBus.connect(dryDest);
  const room = off.createGain();
  room.gain.value = 0.14;
  drumBus.connect(room).connect(reverbShort.input);
  drive.connect(drumBus);

  // 808: сатурация добавляет гармоники, чтобы низ читался и на мелких динамиках
  const subDrive = off.createWaveShaper();
  subDrive.curve = curveFor(2.2);
  const subGain = off.createGain();
  subGain.gain.value = 0.5;
  subDrive.connect(subGain).connect(subDest);

  function noiseHit(t, type, freq, q, vel, dur, pan, target) {
    const src = off.createBufferSource();
    src.buffer = noiseBuf;
    const f = off.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = off.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0004, t + dur);
    const p = off.createStereoPanner(); p.pan.value = pan;
    src.connect(f).connect(g).connect(p).connect(target || drive);
    src.start(t, Math.random() * 0.5, dur + 0.05);
  }

  // кик: низ 80-120 Гц + транзиент, сухой (реверб на кик не вешаем)
  function kick(t, vel) {
    const body = off.createOscillator();
    body.type = 'sine';
    body.frequency.setValueAtTime(150, t);
    body.frequency.exponentialRampToValueAtTime(50, t + 0.09);
    const punch = off.createBiquadFilter();
    punch.type = 'peaking'; punch.frequency.value = 95; punch.Q.value = 1.1; punch.gain.value = 4.5;
    const g = off.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0006, t + 0.4);
    body.connect(punch).connect(g).connect(kickDest);
    body.start(t); body.stop(t + 0.46);

    noiseHit(t, 'highpass', 2600, 0.6, vel * 0.2, 0.012, 0, kickDest);

    // кик дакает 808 и атмосферу — классический пампинг
    sidechain.gain.setValueAtTime(0.55, t);
    sidechain.gain.linearRampToValueAtTime(1, t + 0.22);
    if (bassDuck) {
      bassDuck.gain.setValueAtTime(0.45, t);
      bassDuck.gain.linearRampToValueAtTime(1, t + 0.18);
    }
  }

  // снейр: крек + тело; основной чуть позади сетки (ленивый, тяжёлый грув)
  function snare(t, vel, ghost) {
    const tt = t + (ghost ? 0 : 0.007 + Math.random() * 0.008);
    noiseHit(tt, 'bandpass', ghost ? 1700 : 2400, 0.9, vel * 0.85, ghost ? 0.09 : 0.16, rand(-0.05, 0.05));
    const body = off.createOscillator();
    body.type = 'triangle';
    body.frequency.setValueAtTime(ghost ? 168 : 195, tt);
    body.frequency.exponentialRampToValueAtTime(140, tt + 0.07);
    const g = off.createGain();
    g.gain.setValueAtTime(0, tt);
    g.gain.linearRampToValueAtTime(vel * (ghost ? 0.22 : 0.5), tt + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0006, tt + (ghost ? 0.07 : 0.13));
    body.connect(g).connect(drive);
    body.start(tt); body.stop(tt + 0.16);
  }

  // клэп подмешивается под снейр тише и с разведением по панораме
  function clapLayer(t, vel) {
    for (let i = 0; i < 3; i++) {
      noiseHit(t + i * 0.012, 'bandpass', 1150, 1.1, vel * (1 - i * 0.16), 0.13, i % 2 ? 0.16 : -0.16);
    }
  }

  function hat(t, vel, open) {
    const ahead = -0.003 - Math.random() * 0.004;   // хэты чуть впереди — драйвят грув
    noiseHit(Math.max(0, t + ahead), 'highpass', open ? 7200 : 8600, 0.7, vel,
             open ? 0.24 : 0.032 + Math.random() * 0.02, rand(-0.3, 0.3));
  }

  function roll(t, count, spread, vel0, vel1) {
    for (let i = 0; i < count; i++) {
      hat(t + i * spread, vel0 + (vel1 - vel0) * (i / (count - 1)), false);
    }
  }

  let lastSubMidi = null;

  // 808 = бас и кик одновременно: длинный хвост, глиссандо между нотами
  function sub808(t, midi, len) {
    const f = midiToFreq(midi);
    const canGlide = lastSubMidi !== null && Math.abs(lastSubMidi - midi) <= 7 && Math.random() < sub.subGlide;
    const osc = off.createOscillator();
    osc.type = 'sine';
    if (canGlide) {
      osc.frequency.setValueAtTime(midiToFreq(lastSubMidi), t);
      osc.frequency.exponentialRampToValueAtTime(f, t + 0.09);
    } else {
      osc.frequency.setValueAtTime(f, t);
    }
    const g = off.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(subGain.gain.value * 0.9, t + 0.012);
    g.gain.setValueAtTime(subGain.gain.value * 0.9, t + len * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0006, t + len);
    osc.connect(g).connect(subDrive);

    const click = off.createOscillator();
    click.type = 'triangle';
    click.frequency.value = f * 4;
    const cg = off.createGain();
    cg.gain.setValueAtTime(0.0001, t);
    cg.gain.linearRampToValueAtTime(0.06, t + 0.006);
    cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    click.connect(cg).connect(subDrive);

    osc.start(t); osc.stop(t + len + 0.15);
    click.start(t); click.stop(t + 0.12);
    lastSubMidi = midi;
  }

  // «нарезанный сэмпл»: короткие аккордовые стабы с 7-ступенями, тёмный фильтр
  function chordStab(t, deg, lenBeats) {
    const dur = Math.max(0.18, lenBeats * beatSec * 0.6);
    const pan = rand(-0.25, 0.25);
    const cutoff = 1400 + Math.random() * 1300;
    [0, 2, 4, 6].forEach(k => {
      const si = (deg + k) % scale.length;
      const oct = Math.floor((deg + k) / scale.length);
      const midi = keyRoot + scale[si] + oct * 12 + 12;
      if (midi > 96) return;
      const f = midiToFreq(midi);
      const o1 = off.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
      const o2 = off.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.01;
      const lp = off.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 0.9;
      const g = off.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.055 * humanizeVel(0.18), t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0022, t + dur);
      const p = off.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan + rand(-0.08, 0.08)));
      o1.connect(lp); o2.connect(lp);
      lp.connect(g).connect(p).connect(musicBus);
      o1.start(t); o2.start(t);
      o1.stop(t + dur + 0.15); o2.stop(t + dur + 0.15);
    });
  }

  const kickPats = sub.halfTime
    ? [[0, 10], [0, 6, 10], [0, 3, 10], [0, 10, 14], [0, 7, 10]]
    : [[0, 3, 7, 10], [0, 7, 10], [0, 3, 10], [0, 6, 10], [0, 7, 10, 14], [0, 3, 7, 11]];
  const kickPat = pick(kickPats);
  const openTurnaround = Math.random() > 0.35;
  const stabPats = [[0, 10], [6, 12], [3, 10], [10, 14], [0, 6, 14], [3, 7, 11]];

  const barCount = Math.max(1, Math.floor((sec.breakdownEnd - sec.introEnd) / barSec));
  const sectionEdges = [sec.verseAEnd, sec.buildEnd, sec.climaxEnd];

  for (let b = 0; b < barCount; b++) {
    const barT = sec.introEnd + b * barSec;
    const phase = barT < sec.verseAEnd - 0.05 ? 'intro' : barT < sec.climaxEnd ? 'full' : 'break';
    const deg = progression[b % progression.length];

    // 808 ведёт басовую линию по корням аккордов
    if (phase !== 'break' && Math.random() > (phase === 'intro' ? 0.6 : 0.12)) {
      const len = barSec * sub.subLen * (0.5 + Math.random() * 0.6);
      const off8 = Math.random() > 0.7 ? stepSec * 6 : 0;
      sub808(barT + off8, keyRoot + scale[deg % scale.length] - 12, len);
    }

    for (let s = 0; s < 16; s++) {
      const t = barT + s * stepSec + ((s % 4 === 2) ? swingOff : 0);
      if (t < 0 || t > DURATION - 0.8) continue;

      if (phase !== 'break') {
        if (kickPat.indexOf(s) !== -1 && (phase !== 'intro' || s === 0)) {
          kick(t, (s === 0 ? 0.6 : 0.48) * humanizeVel(0.06));
        } else if (phase === 'full' && s === 14 && Math.random() > 0.75) {
          kick(t, 0.28);
        }
        const snareSteps = sub.halfTime ? [8] : [4, 12];
        if (snareSteps.indexOf(s) !== -1 && (phase !== 'intro' || s === 12)) {
          snare(t, 0.4 * humanizeVel(0.06), false);
          if (Math.random() > 0.3) clapLayer(t + 0.006, 0.12);
        }
        if (phase === 'full' && sub.ghost && (s === 7 || s === 10 || s === 15) && Math.random() > 0.72) {
          snare(t, 0.1 + Math.random() * 0.06, true);
        }
      } else if (s === 0 || s === 8) {
        kick(t, 0.38);
      }

      if (phase === 'full') {
        if (sub.hats === 'sixteenth') {
          hat(t, (s % 4 === 0 ? 0.19 : s % 2 === 0 ? 0.12 : 0.085) * humanizeVel(0.24), false);
        } else if (s % 2 === 0) {
          hat(t, (s % 4 === 0 ? 0.16 : 0.095) * humanizeVel(0.24), false);
        } else if (Math.random() < sub.hats16) {
          hat(t, 0.07 * humanizeVel(0.3), false);
        }
        if (openTurnaround && s === 14 && b % 2 === 1) hat(t, 0.15, true);
      } else if (phase === 'break' && s === 0) {
        hat(t, 0.1, false);
      }
    }

    // трэп-роллы 32-ми с нарастанием громкости в конце фразы
    if (phase === 'full' && sub.rolls && (b + 1) % 4 === 0) {
      roll(barT + barSec - stepSec * 2, 8, stepSec / 2, 0.045, 0.19);
    }

    // снейр-филл на стыке секций
    if (phase === 'full' && sectionEdges.some(x => Math.abs(barT + barSec - x) < barSec * 0.55)) {
      for (let k = 0; k < 4; k++) snare(barT + (12 + k) * stepSec, 0.13 + k * 0.05, true);
    }

    // чопы: 2-3 стаба на бар, в интро реже
    if (phase !== 'break' || Math.random() > 0.6) {
      const stabs = pick(stabPats);
      for (const st of stabs) {
        if (phase === 'intro' && st !== 0) continue;
        const t = barT + st * stepSec + ((st % 4 === 2) ? swingOff : 0);
        if (t < 0 || t > DURATION - 1) continue;
        chordStab(t, deg, 0.5 + Math.random() * 0.7);
      }
    }
  }
}

// винил: лёгкий шип + редкие щелчки — «нашёл запись», а не стерильная сессия
function scheduleVinylCrackle(off, o) {
  const { dest, level } = o;
  if (level <= 0) return;

  const hiss = generateNoiseBuffer('brown', Math.ceil(DURATION));
  const hb = off.createBuffer(2, hiss.len, SR);
  hb.getChannelData(0).set(hiss.ch0);
  hb.getChannelData(1).set(hiss.ch1);
  const src = off.createBufferSource();
  src.buffer = hb;
  const hp = off.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 1200;
  const g = off.createGain();
  g.gain.value = 0.004 * level;
  src.connect(hp).connect(g).connect(dest);
  src.start(0); src.stop(DURATION);

  const nz = generateNoiseBuffer('white', 0.5);
  const pb = off.createBuffer(2, nz.len, SR);
  pb.getChannelData(0).set(nz.ch0);
  pb.getChannelData(1).set(nz.ch1);

  const pops = Math.floor(DURATION * 4 * level);
  for (let i = 0; i < pops; i++) {
    const t = rand(0, DURATION - 0.1);
    const ps = off.createBufferSource();
    ps.buffer = pb;
    const pf = off.createBiquadFilter();
    pf.type = 'bandpass'; pf.frequency.value = rand(2500, 6500); pf.Q.value = 1.4;
    const pg = off.createGain();
    const vel = rand(0.01, 0.05) * level;
    pg.gain.setValueAtTime(0, t);
    pg.gain.linearRampToValueAtTime(vel, t + 0.0015);
    pg.gain.exponentialRampToValueAtTime(0.0002, t + rand(0.004, 0.012));
    ps.connect(pf).connect(pg).connect(dest);
    ps.start(t, Math.random() * 0.4, 0.03);
  }
}

function createAudioBuffer(numCh, len, sr) {
  if (typeof AudioBuffer !== 'undefined') {
    try {
      return new AudioBuffer({ length: len, numberOfChannels: numCh, sampleRate: sr });
    } catch (e) {}
  }
  const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(numCh, len, sr);
  return ctx.createBuffer(numCh, len, sr);
}

async function generate(myId) {
  const t0 = performance.now();

  const genre = GENRES[currentGenre];
  const beatStyle = genre.beatStyles ? pick(Object.values(genre.beatStyles)) : null;
  const bpmRange = beatStyle ? beatStyle.bpm : genre.bpm;
  const bpm = randInt(bpmRange[0], bpmRange[1]);
  const beatSec = 60 / bpm;
  const barSec = beatSec * 4;
  const swingPct = beatStyle ? rand(beatStyle.swingPct[0], beatStyle.swingPct[1]) : 0.5;

  const keyRoot = genre.keyRoots ? pick(genre.keyRoots) : randInt(33, 45);
  const modeKey = pick(genre.modes);
  const scale = MODES[modeKey];

  const chordProg = pick(genre.progressions);
  const useHighRegister = Math.random() > 0.5;

  const padPreset = pick(PAD_PRESETS);
  const introChordIdx = pick([0, 0, 0, 1, 2, 3, 5]);
  const padFadeIn = pick([3, 4, 5, 6]);

  const bellWave = pick(['sine', 'triangle']);
  const bellHarmonic = pick([2.0, 2.76, 3.0]);
  const swing = rand(genre.swing[0], genre.swing[1]);

  const noiseType = pick(['white', 'pink', 'brown']);
  const noiseBandFreq = pick([3000, 4500, 6000, 8000]);
  const noiseQ = rand(0.4, 1.2);
  const noiseLevel = (noiseType === 'brown' ? 0.012 : noiseType === 'pink' ? 0.009 : 0.006) * genre.noiseMul;
  const noiseLfoFreq = pick([0.02, 0.05, 0.1, 0]);
  const noiseLfoAmt = noiseLfoFreq > 0 ? rand(300, 1800) : 0;
  const noiseWidth = pick([0.4, 0.6, 0.8]);
  const noiseStart = pick([3, 4, 5, 6]);
  const noiseFadeIn = 8;

  const introEnd = rand(8, 10);
  const verseAEnd = introEnd + rand(8, 12);
  const buildEnd = verseAEnd + rand(8, 12);
  const climaxEnd = buildEnd + rand(12, 16);
  const breakdownEnd = climaxEnd + rand(6, 9);
  const sec = { introEnd, verseAEnd, buildEnd, climaxEnd, breakdownEnd };

  const bassSteps = 8;
  const bassPattern = euclidean(bassSteps, randInt(3, 5));
  const bassStyle = randInt(0, 2);
  const bassSatType = randInt(0, 2);
  const bassTopWave = pick(['sawtooth', 'triangle']);

  const arpSteps = randInt(4, 6);
  const arpPattern = euclidean(arpSteps, randInt(2, arpSteps));
  const arpDir = pick(['up', 'down', 'zigzag']);

  const droneMidi = keyRoot - 12;
  const droneLevel = rand(0.018, 0.03);

  const meta = {
    genre: currentGenre,
    genreLabel: genre.label,
    mode: modeKey,
    bpm,
    keyRoot,
  };

  await nextFrame();
  if (myId !== generationId) return null;

  const off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, SR * DURATION, SR);

  function makeReverb(irData, g) {
    const b = off.createBuffer(2, irData.len, SR);
    b.getChannelData(0).set(irData.ch0);
    b.getChannelData(1).set(irData.ch1);
    const c = off.createConvolver();
    c.buffer = b;
    const gain = off.createGain();
    gain.gain.value = g;
    c.connect(gain);
    return { input: c, output: gain };
  }

  const reverbShort  = makeReverb(IR_CACHE[0].data, genre.reverb[0]);
  const reverbMedium = genre.reverb[1] > 0 ? makeReverb(IR_CACHE[1].data, genre.reverb[1]) : null;
  const reverbLong   = genre.reverb[2] > 0 ? makeReverb(IR_CACHE[2].data, genre.reverb[2]) : null;

  const delayL = off.createDelay(2.0); delayL.delayTime.value = beatSec * 0.75;
  const delayR = off.createDelay(2.0); delayR.delayTime.value = beatSec * 0.5;
  const fbL = off.createGain(); fbL.gain.value = 0.35;
  const fbR = off.createGain(); fbR.gain.value = 0.35;
  const pL = off.createStereoPanner(); pL.pan.value = -0.6;
  const pR = off.createStereoPanner(); pR.pan.value = 0.6;

  delayL.connect(fbL).connect(delayR);
  delayR.connect(fbR).connect(delayL);
  delayL.connect(pL);
  delayR.connect(pR);

  const delayBus = off.createGain();
  delayBus.gain.value = genre.delay;
  pL.connect(delayBus);
  pR.connect(delayBus);

  const master = off.createGain();
  master.gain.value = genre.master;

  const eqLow = off.createBiquadFilter();
  eqLow.type = 'lowshelf'; eqLow.frequency.value = 110; eqLow.gain.value = 2;

  const eqMid = off.createBiquadFilter();
  eqMid.type = 'peaking'; eqMid.frequency.value = 2500; eqMid.Q.value = 0.6; eqMid.gain.value = 1;

  const eqHigh = off.createBiquadFilter();
  eqHigh.type = 'highshelf'; eqHigh.frequency.value = 10000; eqHigh.gain.value = genre.highShelf;

  // «пыль»: у хип-хопа срезаем верх — эффект прогретого винила/ленты
  const dustLP = off.createBiquadFilter();
  dustLP.type = 'lowpass'; dustLP.frequency.value = beatStyle && beatStyle.dust ? beatStyle.dust : genre.dustLP; dustLP.Q.value = 0.6;

  const declutter = off.createBiquadFilter();
  declutter.type = 'peaking'; declutter.frequency.value = 300; declutter.Q.value = 1.0; declutter.gain.value = -2.5;

  const masterComp = off.createDynamicsCompressor();
  masterComp.threshold.value = -16;
  masterComp.knee.value = 10;
  masterComp.ratio.value = 2;
  masterComp.attack.value = 0.04;
  masterComp.release.value = 0.35;

  const masterLimiter = off.createDynamicsCompressor();
  masterLimiter.threshold.value = -1.5;
  masterLimiter.knee.value = 4;
  masterLimiter.ratio.value = 12;
  masterLimiter.attack.value = 0.005;
  masterLimiter.release.value = 0.1;

  eqLow.connect(eqMid).connect(eqHigh).connect(dustLP).connect(declutter)
       .connect(masterComp).connect(masterLimiter).connect(master);
  master.connect(off.destination);

  const bassBus = off.createGain();
  const bassDuck = off.createGain();
  bassDuck.gain.value = 1;
  bassBus.connect(bassDuck);
  const bassEQ = off.createBiquadFilter();
  bassEQ.type = 'peaking'; bassEQ.frequency.value = 200; bassEQ.Q.value = 0.8; bassEQ.gain.value = -2;

  const bassSat = off.createDynamicsCompressor();
  bassSat.threshold.value = bassSatType === 1 ? -16 : bassSatType === 0 ? -20 : -28;
  bassSat.knee.value    = bassSatType === 1 ? 8   : 14;
  bassSat.ratio.value   = bassSatType === 1 ? 8   : bassSatType === 0 ? 6 : 3;
  bassSat.attack.value = 0.008;
  bassSat.release.value = 0.15;

  const bassComp = off.createDynamicsCompressor();
  bassComp.threshold.value = -16;
  bassComp.knee.value = 6;
  bassComp.ratio.value = 3;
  bassComp.attack.value = 0.01;
  bassComp.release.value = 0.18;

  bassBus.connect(bassEQ).connect(bassSat).connect(bassComp);

  const musicBus = off.createGain();
  const sidechain = off.createGain();
  sidechain.gain.value = 1.0;
  musicBus.connect(sidechain);

  const droneBus = off.createGain();

  bassComp.connect(eqLow);
  bassComp.connect(reverbShort.input);
  sidechain.connect(eqLow);
  sidechain.connect(reverbShort.input);
  if (reverbMedium) sidechain.connect(reverbMedium.input);
  if (reverbLong) sidechain.connect(reverbLong.input);
  sidechain.connect(delayL);
  sidechain.connect(delayR);
  droneBus.connect(eqLow);
  reverbShort.output.connect(eqLow);
  if (reverbMedium) reverbMedium.output.connect(eqLow);
  if (reverbLong) reverbLong.output.connect(eqLow);
  delayBus.connect(eqLow);

  function density(t, layer) {
    let v = 1;

    if (t < sec.introEnd) {
      v = 0.35;
    } else if (t < sec.verseAEnd) {
      const p = (t - sec.introEnd) / (sec.verseAEnd - sec.introEnd);
      v = 0.35 + 0.25 * smootherstep(p);
    } else if (t < sec.buildEnd) {
      const p = (t - sec.verseAEnd) / (sec.buildEnd - sec.verseAEnd);
      v = 0.6 + 0.35 * smootherstep(p);
    } else if (t < sec.climaxEnd) {
      const p = (t - sec.buildEnd) / (sec.climaxEnd - sec.buildEnd);
      v = 0.95 + 0.05 * Math.sin(p * Math.PI);
    } else if (t < sec.breakdownEnd) {
      const p = (t - sec.climaxEnd) / (sec.breakdownEnd - sec.climaxEnd);
      v = 1 - 0.6 * smootherstep(p);
    } else {
      const p = (t - sec.breakdownEnd) / Math.max(0.001, DURATION - sec.breakdownEnd);
      v = 0.4 * smoothDecay(p);
    }

    if (layer === 'bass') {
      const bassInStart = sec.introEnd;
      const bassInEnd = sec.introEnd + 2.5;
      const bassOutStart = sec.climaxEnd - 1;
      const bassOutEnd = sec.climaxEnd + 2.5;

      if (t < bassInStart) v = 0;
      else if (t < bassInEnd) v *= smootherstep((t - bassInStart) / (bassInEnd - bassInStart));
      else if (t < bassOutStart) v *= 1;
      else if (t < bassOutEnd) v *= 1 - smootherstep((t - bassOutStart) / (bassOutEnd - bassOutStart)) * 0.7;
      else if (t < sec.breakdownEnd) v *= 0.3;
      else v *= 0.15;
    }

    if (layer === 'arp') {
      const arpInStart = sec.verseAEnd - 0.5;
      const arpInEnd = sec.verseAEnd + 3;
      const arpOutStart = sec.climaxEnd - 1;
      const arpOutEnd = sec.climaxEnd + 3;

      if (t < arpInStart) v = 0;
      else if (t < arpInEnd) v *= smootherstep((t - arpInStart) / (arpInEnd - arpInStart));
      else if (t < arpOutStart) v *= 1;
      else if (t < arpOutEnd) v *= 1 - smootherstep((t - arpOutStart) / (arpOutEnd - arpOutStart));
      else v = 0;
    }

    if (layer === 'pad') {
      v = v * 0.65 + 0.35;
    }

    if (layer === 'bell') {
      const bellIn = sec.introEnd * 0.7;
      const bellInEnd = sec.introEnd + 2;
      const bellOutStart = DURATION - 6;
      const bellOutEnd = DURATION - 1;

      if (t < bellIn) v *= 0.3;
      else if (t < bellInEnd) v *= 0.3 + 0.7 * smootherstep((t - bellIn) / (bellInEnd - bellIn));
      else if (t < bellOutStart) v *= 1;
      else if (t < bellOutEnd) v *= 1 - smootherstep((t - bellOutStart) / (bellOutEnd - bellOutStart));
      else v *= 0;
    }

    return Math.max(0, Math.min(1, v));
  }

  await nextFrame();
  if (myId !== generationId) return null;

  {
    const f = midiToFreq(droneMidi);
    const o1 = off.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
    const o2 = off.createOscillator(); o2.type = 'sine'; o2.frequency.value = f;
    o2.detune.value = rand(-8, 8);

    const g = off.createGain();
    g.gain.setValueAtTime(0, 0);
    g.gain.linearRampToValueAtTime(droneLevel, 8);
    g.gain.setValueAtTime(droneLevel, DURATION - 12);
    g.gain.linearRampToValueAtTime(0, DURATION);

    const lfo = off.createOscillator();
    lfo.frequency.value = rand(0.04, 0.12);
    const lfoG = off.createGain();
    lfoG.gain.value = 6;
    lfo.connect(lfoG).connect(o2.detune);
    lfo.start(0); lfo.stop(DURATION);

    const filt = off.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 100; filt.Q.value = 0.5;

    o1.connect(filt); o2.connect(filt);
    filt.connect(g).connect(droneBus);
    o1.start(0); o1.stop(DURATION);
    o2.start(0); o2.stop(DURATION);
  }

  {
    const sectionLen = barSec * 4;
    let t = 0, i = 0;
    while (t < DURATION) {
      const chordPos = (i + introChordIdx) % chordProg.length;
      const deg = chordProg[chordPos];
      const baseMidi = keyRoot + scale[deg % scale.length] + 12 * Math.floor(deg / scale.length);
      const realDur = Math.min(sectionLen, DURATION - t);
      if (realDur < 2) break;

      const d = density(t, 'pad');
      const tH = humanizeTime(0.01);

      ['L', 'R'].forEach(side => {
        const pan = off.createStereoPanner();
        pan.pan.value = side === 'L' ? -0.72 : 0.72;

        const padGain = off.createGain();
        const peak = 0.075 * d;

        const atk = Math.max(2.5, (i === 0 ? padFadeIn * padPreset.attackMul
                            : Math.min(4, realDur * 0.4) * padPreset.attackMul));
        const rel = Math.max(2.5, Math.min(4, realDur * 0.35));

        const sT = Math.max(0, t + tH);
        padGain.gain.setValueAtTime(0, sT);
        padGain.gain.linearRampToValueAtTime(peak, sT + atk);
        padGain.gain.setValueAtTime(peak, sT + realDur - rel);
        padGain.gain.linearRampToValueAtTime(0, sT + realDur);
        padGain.connect(pan).connect(musicBus);

        const hp = off.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 140; hp.Q.value = 0.6;

        const lp = off.createBiquadFilter();
        lp.type = 'lowpass';
        const cB = 350 + padPreset.brightness * 1100;
        lp.frequency.setValueAtTime(cB * 0.7, sT);
        lp.frequency.linearRampToValueAtTime(cB * 1.3, sT + realDur * 0.6);
        lp.frequency.linearRampToValueAtTime(cB * 0.85, sT + realDur);
        lp.Q.value = 0.6;

        const notch = off.createBiquadFilter();
        notch.type = 'peaking'; notch.frequency.value = 1500;
        notch.Q.value = 1.2; notch.gain.value = -4;

        hp.connect(lp).connect(notch).connect(padGain);

        const d1 = side === 'L' ? -padPreset.detune : -padPreset.detune * 0.5;
        const d2 = side === 'L' ? padPreset.detune * 0.5 : padPreset.detune;
        [d1, d2].forEach(dt => {
          const osc = off.createOscillator();
          osc.type = padPreset.wave;
          osc.frequency.value = midiToFreq(baseMidi);
          osc.detune.value = dt;
          osc.connect(hp);
          osc.start(sT);
          osc.stop(sT + realDur + 0.2);
        });

        if (side === 'L') {
          const sub = off.createOscillator();
          sub.type = 'sine';
          sub.frequency.value = midiToFreq(baseMidi - 12);
          const sg = off.createGain();
          sg.gain.value = padPreset.subLevel;
          sub.connect(sg).connect(padGain);
          sub.start(sT);
          sub.stop(sT + realDur + 0.2);
        }
      });

      t += realDur * 0.92;
      i++;
    }
  }

  await nextFrame();
  if (myId !== generationId) return null;

  // в хип-хопе бас — это 808 из бит-движка, эмбиентная басовая линия не нужна
  if (!genre.bass808) {
    const stepSec = barSec / bassSteps;
    for (let bar = 0; bar * barSec < DURATION; bar++) {
      const barStart = bar * barSec;
      const deg = chordProg[bar % chordProg.length];
      const bassMidi = keyRoot + scale[deg % scale.length] - 12;
      const useFifth = Math.random() > 0.7 && (barStart > sec.buildEnd);
      const finalBassMidi = useFifth ? bassMidi + 7 : bassMidi;

      for (let s = 0; s < bassSteps; s++) {
        if (!bassPattern[s]) continue;
        const t = barStart + s * stepSec + humanizeTime(0.008);
        if (t >= DURATION - 1 || t < 0) continue;
        const d = density(t, 'bass');
        if (d < 0.02) continue;

        let noteDur;
        if (bassStyle === 0) noteDur = stepSec * 0.7;
        else if (bassStyle === 1) noteDur = stepSec * 1.8;
        else noteDur = stepSec * (0.7 + Math.random() * 0.8);
        if (s === 0 && Math.random() > 0.6) noteDur *= 1.4;

        const f = midiToFreq(finalBassMidi);
        const peak = 0.22 * d * humanizeVel(0.08);

        const sub = off.createOscillator(); sub.type = 'sine'; sub.frequency.value = f;
        const subG = off.createGain();
        subG.gain.setValueAtTime(0, t);
        subG.gain.linearRampToValueAtTime(peak * 0.85, t + 0.025);
        subG.gain.setValueAtTime(peak * 0.85, t + noteDur * 0.6);
        subG.gain.linearRampToValueAtTime(peak * 0.5, t + noteDur);
        subG.gain.linearRampToValueAtTime(0.001, t + noteDur + 0.35);
        const subHP = off.createBiquadFilter();
        subHP.type = 'highpass'; subHP.frequency.value = 32;
        sub.connect(subHP).connect(subG).connect(bassBus);
        sub.start(t); sub.stop(t + noteDur + 0.5);

        const o1 = off.createOscillator(); o1.type = bassTopWave; o1.frequency.value = f;
        o1.detune.value = rand(-6, 6);
        const o2 = off.createOscillator(); o2.type = bassTopWave; o2.frequency.value = f;
        o2.detune.value = rand(-12, 12);

        const tf = off.createBiquadFilter();
        tf.type = 'lowpass';
        const cT = 280 + d * 320 + (barStart > sec.buildEnd ? 120 : 0);
        tf.frequency.setValueAtTime(cT * 0.85, t);
        tf.frequency.linearRampToValueAtTime(cT * 1.15, t + 0.1);
        tf.frequency.linearRampToValueAtTime(cT, t + 0.2);
        tf.Q.value = 1.2;

        const topG = off.createGain();
        topG.gain.setValueAtTime(0, t);
        topG.gain.linearRampToValueAtTime(peak * 0.45, t + 0.03);
        topG.gain.setValueAtTime(peak * 0.45, t + noteDur * 0.6);
        topG.gain.linearRampToValueAtTime(peak * 0.25, t + noteDur);
        topG.gain.linearRampToValueAtTime(0.001, t + noteDur + 0.35);

        o1.connect(tf); o2.connect(tf);
        tf.connect(topG).connect(bassBus);
        o1.start(t); o1.stop(t + noteDur + 0.5);
        o2.start(t); o2.stop(t + noteDur + 0.5);

        const send = off.createGain();
        send.gain.value = 0.1;
        topG.connect(send).connect(reverbShort.input);

        const sideRelease = Math.min(noteDur + 0.4, stepSec * 0.92);
        sidechain.gain.cancelScheduledValues(t);
        sidechain.gain.setValueAtTime(1.0, t);
        sidechain.gain.linearRampToValueAtTime(0.88, t + 0.04);
        sidechain.gain.linearRampToValueAtTime(1.0, t + sideRelease);
      }
    }
  }

  await nextFrame();
  if (myId !== generationId) return null;

  {
    const themeLen = randInt(5, 8);
    const theme = [];
    let curDeg = randInt(0, scale.length * 2 - 1);
    for (let i = 0; i < themeLen; i++) {
      theme.push(curDeg);
      curDeg = Math.max(0, Math.min(scale.length * 3 - 1, curDeg + pick([-2, -1, -1, 0, 1, 1, 2])));
    }

    function playTheme(startT, transpose, mul, variation) {
      let t = startT;
      for (let idx = 0; idx < theme.length; idx++) {
        if (t >= DURATION) break;
        const deg = theme[idx] + transpose;
        const oct = Math.floor(deg / scale.length);
        const nIn = ((deg % scale.length) + scale.length) % scale.length;
        const midi = keyRoot + scale[nIn] + oct * 12 + (useHighRegister ? 12 : 0);
        const f = midiToFreq(midi);
        const d = density(t, 'bell');
        const sw = (idx % 2 === 1) ? swing * beatSec : 0;
        const nT = t + sw + humanizeTime(0.012);

        if (d > 0.02 && nT >= 0) {
          const peak = 0.085 * d * mul * humanizeVel(0.12);

          const g = off.createGain();
          g.gain.setValueAtTime(0, nT);
          g.gain.linearRampToValueAtTime(peak, nT + 0.025);
          g.gain.linearRampToValueAtTime(peak * 0.5, nT + 1.2);
          g.gain.linearRampToValueAtTime(0.0001, nT + rand(2.5, 4));

          const hp = off.createBiquadFilter();
          hp.type = 'highpass'; hp.frequency.value = 500; hp.Q.value = 0.5;

          const pres = off.createBiquadFilter();
          pres.type = 'peaking'; pres.frequency.value = 3000;
          pres.Q.value = 1.0; pres.gain.value = 2;

          hp.connect(pres).connect(g).connect(musicBus);

          const o1 = off.createOscillator();
          o1.type = bellWave; o1.frequency.value = f;
          o1.connect(hp);
          o1.start(nT); o1.stop(nT + 4.5);

          const g2 = off.createGain();
          g2.gain.setValueAtTime(0, nT);
          g2.gain.linearRampToValueAtTime(peak * 0.3, nT + 0.02);
          g2.gain.linearRampToValueAtTime(peak * 0.15, nT + 0.8);
          g2.gain.linearRampToValueAtTime(0.0001, nT + rand(1.5, 2.5));
          g2.connect(musicBus);

          const o2 = off.createOscillator();
          o2.type = 'sine'; o2.frequency.value = f * bellHarmonic;
          o2.connect(g2);
          o2.start(nT); o2.stop(nT + 3);

          const sS = off.createGain(); sS.gain.value = 0.18;
          g.connect(sS).connect(reverbShort.input);
          if (reverbMedium) {
            const sM = off.createGain(); sM.gain.value = 0.32;
            g.connect(sM).connect(reverbMedium.input);
          }
          if (reverbLong) {
            const sL = off.createGain(); sL.gain.value = 0.45;
            g.connect(sL).connect(reverbLong.input);
          }

          const sD = off.createGain(); sD.gain.value = 0.18;
          g.connect(sD).connect(delayL);
        }

        t += beatSec * pick([0.5, 1, 1, 1.5, 2]) * variation;
      }
      return t;
    }

    let cursor = sec.introEnd * 0.5;
    let trans = 0;
    let part = 0;
    while (cursor < DURATION - 3 && part < 15) {
      const mul = part === 0 ? 0.7 : 1.0;
      const variation = part === 0 ? 1.4 : rand(0.85, 1.15);
      cursor = playTheme(cursor, trans, mul, variation);
      trans = pick([0, 2, 4, -2, 3]);
      cursor += beatSec * rand(1.5, 3.5);
      part++;
    }
  }

  await nextFrame();
  if (myId !== generationId) return null;

  {
    const stepSec = barSec / arpSteps;
    for (let bar = 0; bar * barSec < DURATION; bar++) {
      const barStart = bar * barSec;
      const deg = chordProg[bar % chordProg.length];

      for (let s = 0; s < arpSteps; s++) {
        if (!arpPattern[s]) continue;
        const sw = (s % 2 === 1) ? swing * stepSec : 0;
        const t = barStart + s * stepSec + sw + humanizeTime(0.01);
        if (t >= DURATION - 1 || t < 0) continue;
        const d = density(t, 'arp');
        if (d < 0.05) continue;

        let st;
        if (arpDir === 'up') st = (s % 4) * 2;
        else if (arpDir === 'down') st = (3 - (s % 4)) * 2;
        else st = [0, 4, 2, 6][s % 4];

        const aDeg = deg + st;
        const oct = Math.floor(aDeg / scale.length);
        const nIn = ((aDeg % scale.length) + scale.length) % scale.length;
        const midi = keyRoot + scale[nIn] + oct * 12 + 24;

        const pan = off.createStereoPanner();
        pan.pan.value = Math.sin(s / arpSteps * Math.PI * 2) * 0.55;

        const g = off.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.045 * d * humanizeVel(0.12), t + 0.015);
        g.gain.linearRampToValueAtTime(0.02 * d, t + stepSec * 0.5);
        g.gain.linearRampToValueAtTime(0.0001, t + stepSec * 1.4);
        g.connect(pan).connect(musicBus);

        const hp = off.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 700;
        hp.connect(g);

        const o = off.createOscillator();
        o.type = 'triangle'; o.frequency.value = midiToFreq(midi);
        o.connect(hp);
        o.start(t); o.stop(t + stepSec * 2);

        const sD = off.createGain(); sD.gain.value = 0.25;
        g.connect(sD).connect(delayL);
      }
    }
  }

  await nextFrame();
  if (myId !== generationId) return null;

  {
    const nd = generateNoiseBuffer(noiseType, 3);
    const nb = off.createBuffer(2, nd.len, SR);
    nb.getChannelData(0).set(nd.ch0);
    nb.getChannelData(1).set(nd.ch1);

    const src = off.createBufferSource();
    src.buffer = nb; src.loop = true;

    const bp = off.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = noiseBandFreq; bp.Q.value = noiseQ;

    const hp = off.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 2500;

    if (noiseLfoFreq > 0) {
      const lfo = off.createOscillator();
      lfo.frequency.value = noiseLfoFreq;
      const lfoG = off.createGain(); lfoG.gain.value = noiseLfoAmt;
      lfo.connect(lfoG).connect(bp.frequency);
      lfo.start(0); lfo.stop(DURATION);
    }

    const ng = off.createGain();
    ng.gain.setValueAtTime(0, 0);
    ng.gain.setValueAtTime(0, noiseStart);
    ng.gain.linearRampToValueAtTime(noiseLevel * 0.5, noiseStart + noiseFadeIn * 0.5);
    ng.gain.linearRampToValueAtTime(noiseLevel, noiseStart + noiseFadeIn);
    ng.gain.setValueAtTime(noiseLevel, DURATION - 8);
    ng.gain.linearRampToValueAtTime(0, DURATION - 1);

    const wL = off.createStereoPanner(); wL.pan.value = -noiseWidth;
    const wR = off.createStereoPanner(); wR.pan.value =  noiseWidth;

    src.connect(hp).connect(bp).connect(ng);
    ng.connect(wL).connect(musicBus);
    ng.connect(wR).connect(musicBus);
    src.start(0); src.stop(DURATION);
  }

  {
    const swS = sec.buildEnd - 6, swE = sec.buildEnd;
    const swd = generateNoiseBuffer('pink', 6);
    const swb = off.createBuffer(2, swd.len, SR);
    swb.getChannelData(0).set(swd.ch0);
    swb.getChannelData(1).set(swd.ch1);

    const swSrc = off.createBufferSource(); swSrc.buffer = swb;
    const swF = off.createBiquadFilter();
    swF.type = 'bandpass'; swF.Q.value = 1.5;
    swF.frequency.setValueAtTime(400, swS);
    swF.frequency.linearRampToValueAtTime(3000, swE);

    const swG = off.createGain();
    swG.gain.setValueAtTime(0, swS);
    swG.gain.linearRampToValueAtTime(0.025, swS + 3);
    swG.gain.setValueAtTime(0.025, swE - 0.5);
    swG.gain.linearRampToValueAtTime(0, swE + 0.3);

    swSrc.connect(swF).connect(swG).connect(musicBus);
    swSrc.start(swS); swSrc.stop(swE + 1);

    const bS = sec.buildEnd - 1;
    const bO = off.createOscillator();
    bO.type = 'sine';
    bO.frequency.setValueAtTime(80, bS);
    bO.frequency.linearRampToValueAtTime(50, bS + 2.5);
    bO.frequency.linearRampToValueAtTime(40, bS + 4);

    const bG = off.createGain();
    bG.gain.setValueAtTime(0, bS);
    bG.gain.linearRampToValueAtTime(0.06, bS + 0.8);
    bG.gain.setValueAtTime(0.06, bS + 1.5);
    bG.gain.linearRampToValueAtTime(0, bS + 4);

    bO.connect(bG).connect(droneBus);
    bO.start(bS); bO.stop(bS + 4.5);

    const b2S = sec.climaxEnd - 0.5;
    const b2O = off.createOscillator();
    b2O.type = 'sine';
    b2O.frequency.setValueAtTime(70, b2S);
    b2O.frequency.linearRampToValueAtTime(45, b2S + 3);

    const b2G = off.createGain();
    b2G.gain.setValueAtTime(0, b2S);
    b2G.gain.linearRampToValueAtTime(0.04, b2S + 0.8);
    b2G.gain.linearRampToValueAtTime(0, b2S + 3.5);

    b2O.connect(b2G).connect(droneBus);
    b2O.start(b2S); b2O.stop(b2S + 4);
  }

  if (genre.drums) {
    scheduleHipHopDrums(off, {
      dest: musicBus,
      kickDest: eqLow,
      sidechain,
      beatSec, barSec, sec, swing,
    });
  }

  master.gain.setValueAtTime(0, 0);
  master.gain.linearRampToValueAtTime(genre.master, 3);
  master.gain.setValueAtTime(genre.master, DURATION - 8);
  master.gain.linearRampToValueAtTime(0, DURATION);

  if (reverbLong) {
    reverbLong.output.gain.cancelScheduledValues(0);
    reverbLong.output.gain.setValueAtTime(0.15, 0);
    reverbLong.output.gain.linearRampToValueAtTime(0.45, sec.buildEnd);
    reverbLong.output.gain.linearRampToValueAtTime(0.55, sec.breakdownEnd);
    reverbLong.output.gain.linearRampToValueAtTime(0.75, DURATION - 5);
    reverbLong.output.gain.linearRampToValueAtTime(0.35, DURATION);
  }

  if (genre.drums) {
    scheduleHipHop(off, {
      dryDest: eqLow,
      kickDest: eqLow,
      musicBus,
      reverbShort,
      subDest: bassBus,
      sidechain, bassDuck,
      sub: beatStyle,
      scale, keyRoot,
      progression: chordProg,
      sec, beatSec, barSec, swingPct,
    });
    scheduleVinylCrackle(off, {
      dest: musicBus,
      level: genre.crackle * (beatStyle ? beatStyle.crackle : 1),
    });
  }

  await nextFrame();
  if (myId !== generationId) return null;

  const tR = performance.now();
  const renderP = off.startRendering();
  const timeoutP = new Promise((_, rej) =>
    setTimeout(() => rej(new Error('render timeout')), RENDER_TIMEOUT)
  );
  const rendered = await Promise.race([renderP, timeoutP]);

  const totalTime = ((performance.now() - t0) / 1000).toFixed(2);
  const renderTime = ((performance.now() - tR) / 1000).toFixed(2);
  console.log(`✅ Готово за ${totalTime}с (рендер ${renderTime}с)`);

  const up = upsampleBuffer(rendered, OUTPUT_SR);
  return { buffer: up, totalTime, meta };
}

function upsampleBuffer(buffer, targetSR) {
  if (buffer.sampleRate === targetSR) return buffer;
  const srcSR = buffer.sampleRate;
  const ratio = targetSR / srcSR;
  const srcLen = buffer.length;
  const dstLen = Math.floor(srcLen * ratio);

  const out = createAudioBuffer(buffer.numberOfChannels, dstLen, targetSR);

  for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
    const s = buffer.getChannelData(ch);
    const d = out.getChannelData(ch);
    for (let i = 0; i < dstLen; i++) {
      const si = i / ratio;
      const i0 = Math.floor(si);
      const i1 = Math.min(i0 + 1, srcLen - 1);
      const fr = si - i0;
      d[i] = s[i0] * (1 - fr) + s[i1] * fr;
    }
  }
  return out;
}

let freqData = null;

function startVisualizer() {
  if (!analyser) return;
  const n = analyser.frequencyBinCount;
  if (!freqData || freqData.length !== n) freqData = new Uint8Array(n);

  const LOG_BASE = Math.log(1.06);
  const logSpan = Math.exp(LOG_BASE * BAR_COUNT) - 1;

  function frame() {
    if (!isPlaying || !analyser) return;
    rafId = requestAnimationFrame(frame);

    analyser.getByteFrequencyData(freqData);

    for (let i = 0; i < BAR_COUNT; i++) {
      const t0 = i / BAR_COUNT;
      const t1 = (i + 1) / BAR_COUNT;
      const f0 = Math.floor((Math.exp(t0 * LOG_BASE * BAR_COUNT) - 1) / logSpan * n);
      const f1 = Math.floor((Math.exp(t1 * LOG_BASE * BAR_COUNT) - 1) / logSpan * n);

      let sum = 0, cnt = 0;
      for (let k = f0; k <= f1 && k < n; k++) { sum += freqData[k]; cnt++; }
      const v = cnt > 0 ? (sum / cnt) / 255 : 0;

      const h = Math.max(2, v * v * 42 * barCurve[i] + 2);
      barEls[i].style.height = h.toFixed(1) + 'px';
    }
  }
  frame();
}

function resetVisualizer() {
  barEls.forEach(el => { el.style.height = '2px'; });
}

function startTimeIndicator() {
  let lastUpdate = 0;
  function frame(now) {
    if (!isPlaying || !audioCtx) return;
    timeRafId = requestAnimationFrame(frame);

    if (now - lastUpdate < 200) return;
    lastUpdate = now;

    const elapsed = Math.min(DURATION, audioCtx.currentTime - playbackStartTime);
    const progress = elapsed / DURATION;

    timeFill.style.width = (progress * 100).toFixed(2) + '%';
    timeCurrent.textContent = formatTime(elapsed);
  }
  requestAnimationFrame(frame);
}

function resetTimeIndicator() {
  timeFill.style.width = '0%';
  timeCurrent.textContent = '00:00';
}

async function play(buffer) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.82;

  gainNode = audioCtx.createGain();
  gainNode.gain.value = 0.85;

  sourceNode = audioCtx.createBufferSource();
  sourceNode.buffer = buffer;
  sourceNode.connect(gainNode);
  gainNode.connect(analyser);
  gainNode.connect(audioCtx.destination);

  const mySource = sourceNode;
  mySource.onended = () => {
    if (isPlaying && sourceNode === mySource) endPlayback();
  };

  mySource.start(0);
  isPlaying = true;
  playbackStartTime = audioCtx.currentTime;

  document.body.classList.add('playing');
  playBtn.classList.add('playing');
  playLabel.textContent = 'Stop';
  saveBtn.disabled = false;
  statusLeft.textContent = 'Playing';

  startVisualizer();
  startTimeIndicator();

  clearTimeout(playbackTimeoutId);
  playbackTimeoutId = setTimeout(() => { if (isPlaying) endPlayback(); }, DURATION * 1000 + 500);
}

function endPlayback() {
  if (!isPlaying && !audioCtx) return;

  isPlaying = false;
  document.body.classList.remove('playing');
  playBtn.classList.remove('playing');
  playLabel.textContent = 'Generate';
  statusLeft.textContent = 'Ready';

  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (timeRafId) { cancelAnimationFrame(timeRafId); timeRafId = null; }
  clearTimeout(playbackTimeoutId);
  playbackTimeoutId = null;

  const sn = sourceNode;
  sourceNode = null;
  if (sn) {
    sn.onended = null;
    try { sn.stop(); } catch (e) {}
    try { sn.disconnect(); } catch (e) {}
  }

  if (gainNode) {
    try { gainNode.disconnect(); } catch (e) {}
    gainNode = null;
  }
  if (analyser) {
    try { analyser.disconnect(); } catch (e) {}
    analyser = null;
  }
  const ac = audioCtx;
  audioCtx = null;
  if (ac) {
    try { if (ac.state !== 'closed') ac.close().catch(() => {}); } catch (e) {}
  }

  resetVisualizer();
  resetTimeIndicator();
}

function cleanup() {
  endPlayback();
  currentBuffer = null;
  currentTrackName = '';
  currentMeta = null;
  saveBtn.disabled = true;
  coverEl.classList.remove('ready');
  timeTrack.classList.remove('visible');
}

function bufferToWav(buffer) {
  const numCh = buffer.numberOfChannels;
  const len = buffer.length;
  const blockAlign = numCh * 2;
  const dataLen = len * blockAlign;
  const ab = new ArrayBuffer(44 + dataLen);
  const view = new DataView(ab);
  function ws(off, s) { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }

  ws(0, 'RIFF');
  view.setUint32(4, 36 + dataLen, true);
  ws(8, 'WAVE');
  ws(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true);
  view.setUint32(24, buffer.sampleRate, true);
  view.setUint32(28, buffer.sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  ws(36, 'data');
  view.setUint32(40, dataLen, true);

  const channels = [];
  for (let i = 0; i < numCh; i++) channels.push(buffer.getChannelData(i));

  let off = 44;
  for (let i = 0; i < len; i++) {
    for (let ch = 0; ch < numCh; ch++) {
      let s = Math.max(-1, Math.min(1, channels[ch][i]));
      s = s < 0 ? s * 0x8000 : s * 0x7FFF;
      view.setInt16(off, s, true);
      off += 2;
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

function textToBytes(str, nullTerminate = true) {
  const clean = str.replace(/[\u0000-\u001f]/g, '');
  const bytes = [];
  for (let i = 0; i < clean.length; i++) {
    const c = clean.charCodeAt(i);
    if (c < 0x80) {
      bytes.push(c);
    } else if (c < 0x800) {
      bytes.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
    } else {
      bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
    }
  }
  if (nullTerminate) bytes.push(0);
  return new Uint8Array(bytes);
}

function uint32BE(n) {
  return new Uint8Array([(n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff]);
}

function uint32LE(n) {
  return new Uint8Array([n & 0xff, (n >>> 8) & 0xff, (n >>> 16) & 0xff, (n >>> 24) & 0xff]);
}

function concatBytes(arrays) {
  let total = 0;
  for (const a of arrays) total += a.length;
  const out = new Uint8Array(total);
  let off = 0;
  for (const a of arrays) {
    out.set(a, off);
    off += a.length;
  }
  return out;
}

function createAPICFrame(mimeType, description, pictureData) {
  const mimeBytes = textToBytes(mimeType);
  const descBytes = textToBytes(description);
  const picBytes = new Uint8Array(pictureData);

  return concatBytes([
    new Uint8Array([0x00]),
    mimeBytes,
    new Uint8Array([0x03]),
    descBytes,
    new Uint8Array([0x00, 0x00, 0x00]),
    picBytes,
  ]);
}

function createTextFrame(id, text) {
  const idBytes = textToBytes(id, false);
  const textBytes = textToBytes(text);
  const header = new Uint8Array([0x03]);
  const size = uint32BE(textBytes.length);
  const flags = new Uint8Array([0x00, 0x00]);
  return concatBytes([header, idBytes, size, flags, textBytes]);
}

function createCommentFrame(text) {
  const header = new Uint8Array([0x03]);
  const idBytes = textToBytes('COMM', false);
  const encoding = new Uint8Array([0x03]);
  const lang = textToBytes('eng', false);
  const shortDesc = textToBytes('');
  const textBytes = textToBytes(text);
  const size = uint32BE(encoding.length + lang.length + shortDesc.length + textBytes.length);
  const flags = new Uint8Array([0x00, 0x00]);
  return concatBytes([header, idBytes, size, flags, encoding, lang, shortDesc, textBytes]);
}

function createID3v2Tag({ title, artist, album, coverBlob }) {
  return new Promise((resolve) => {
    if (!coverBlob) {
      const frames = concatBytes([
        createTextFrame('TIT2', title),
        createTextFrame('TPE1', artist),
        createTextFrame('TALB', album),
      ]);
      const size = frames.length;
      const header = concatBytes([
        textToBytes('ID3', false),
        new Uint8Array([0x03, 0x00, 0x00]),
        new Uint8Array([
          (size >>> 21) & 0x7f,
          (size >>> 14) & 0x7f,
          (size >>> 7) & 0x7f,
          size & 0x7f,
        ]),
      ]);
      resolve(concatBytes([header, frames]));
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      const picBytes = new Uint8Array(reader.result);
      const apicFrame = createAPICFrame('image/jpeg', 'Cover', picBytes);
      const frames = concatBytes([
        createTextFrame('TIT2', title),
        createTextFrame('TPE1', artist),
        createTextFrame('TALB', album),
        createCommentFrame('Generated by Cosmic Drift'),
        apicFrame,
      ]);
      const size = frames.length;
      const header = concatBytes([
        textToBytes('ID3', false),
        new Uint8Array([0x03, 0x00, 0x00]),
        new Uint8Array([
          (size >>> 21) & 0x7f,
          (size >>> 14) & 0x7f,
          (size >>> 7) & 0x7f,
          size & 0x7f,
        ]),
      ]);
      resolve(concatBytes([header, frames]));
    };
    reader.onerror = () => resolve(new Uint8Array(0));
    reader.readAsArrayBuffer(coverBlob);
  });
}

function canvasToJpegBlob(canvas, quality = 0.9) {
  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
  });
}

function float32ToInt16(float32) {
  const out = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    let s = Math.max(-1, Math.min(1, float32[i]));
    s = s < 0 ? s * 0x8000 : s * 0x7FFF;
    out[i] = s;
  }
  return out;
}

async function encodeMP3(buffer, onProgress) {
  const channels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length;

  const left = float32ToInt16(buffer.getChannelData(0));
  const right = channels > 1 ? float32ToInt16(buffer.getChannelData(1)) : left;

  const encoder = new lamejs.Mp3Encoder(2, sampleRate, MP3_BITRATE);
  const blockSize = 1152;
  const chunks = [];

  for (let i = 0; i < length; i += blockSize) {
    const leftChunk = left.subarray(i, Math.min(i + blockSize, length));
    const rightChunk = right.subarray(i, Math.min(i + blockSize, length));
    const mp3buf = encoder.encodeBuffer(leftChunk, rightChunk);
    if (mp3buf.length > 0) chunks.push(new Uint8Array(mp3buf));

    if (onProgress && i % (blockSize * 40) === 0) {
      onProgress(i / length);
      await nextFrame();
    }
  }

  const end = encoder.flush();
  if (end.length > 0) chunks.push(new Uint8Array(end));

  return concatBytes(chunks);
}

async function exportWithCover() {
  if (!currentBuffer || !currentTrackName) return;

  saveBtn.classList.add('downloading');
  saveBtn.disabled = true;
  const originalText = saveBtn.textContent;
  saveBtn.textContent = 'Encoding';
  statusLeft.textContent = 'Encoding';

  try {
    await nextFrame();

    const durationText = formatTime(DURATION);
    const kickerText = currentMeta
      ? `${formatModeName(currentMeta.mode)} · ${currentMeta.bpm} BPM`
      : 'Generated Ambient';

    const fullCoverCanvas = renderFullCover(
      hashString(currentTrackName),
      currentTrackName,
      kickerText,
      durationText
    );

    const coverBlob = await canvasToJpegBlob(fullCoverCanvas, 0.92);

    const coverPreviewUrl = URL.createObjectURL(coverBlob);

    const mp3Data = await encodeMP3(currentBuffer, (p) => {
      saveBtn.textContent = `${Math.floor(p * 100)}%`;
    });

    const id3Tag = await createID3v2Tag({
      title: currentTrackName,
      artist: 'Cosmic Drift',
      album: `Generative ${currentMeta ? currentMeta.genreLabel : GENRES[currentGenre].label} · ${new Date().toISOString().slice(0, 10)}`,
      coverBlob,
    });

    const finalBlob = new Blob([id3Tag, mp3Data], { type: 'audio/mpeg' });

    const safeName = sanitizeFilename(currentTrackName) || 'cosmic-drift';
    const ts = new Date().toISOString().slice(0, 10);
    downloadBlob(finalBlob, `${safeName}-${ts}.mp3`);

    setTimeout(() => URL.revokeObjectURL(coverPreviewUrl), 30000);

    showToast('Saved with cover', 'success');
    statusLeft.textContent = 'Ready';
  } catch (e) {
    console.error(e);
    showToast('Export failed');
    statusLeft.textContent = 'Error';
  } finally {
    saveBtn.classList.remove('downloading');
    saveBtn.disabled = false;
    saveBtn.textContent = originalText;
  }
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function sanitizeFilename(name) {
  return name.replace(/[^a-zA-Z0-9 _-]/g, '').trim().replace(/\s+/g, '-');
}

function formatModeName(mode) {
  return mode
    .replace(/([A-Z])/g, ' $1')
    .replace(/^./, c => c.toUpperCase())
    .trim();
}

document.querySelectorAll('.transport-btn').forEach(btn => {
  btn.addEventListener('pointermove', (e) => {
    const rect = btn.getBoundingClientRect();
    btn.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width * 100) + '%');
    btn.style.setProperty('--my', ((e.clientY - rect.top) / rect.height * 100) + '%');
  });
});

document.querySelectorAll('.genre-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentGenre = btn.dataset.genre;
    const genre = GENRES[currentGenre];
    document.querySelectorAll('.genre-btn').forEach(b => b.classList.toggle('active', b === btn));
    coverKicker.textContent = genre.kicker;
    statusRight.textContent = `${genre.label} · Generative`;
    showToast(`${genre.label} · ${genre.bpm[0]}–${genre.bpm[1]} BPM`);
  });
});

playBtn.addEventListener('click', async () => {
  if (isPlaying) {
    endPlayback();
    return;
  }

  if (isGenerating) {
    generationId++;
    isGenerating = false;
    playBtn.classList.remove('generating');
    playLabel.textContent = 'Generate';
    statusLeft.textContent = 'Ready';
    return;
  }

  generationId++;
  const myId = generationId;
  isGenerating = true;

  cleanup();
  playBtn.classList.add('generating');
  playLabel.textContent = 'Rendering';
  statusLeft.textContent = 'Rendering';

  trackCounter++;
  stamp.textContent = `№ ${String(trackCounter).padStart(3, '0')}`;

  currentTrackName = generateTrackName();
  coverTitle.textContent = currentTrackName;
  coverKicker.textContent = 'Generating…';

  try {
    const result = await generate(myId);
    if (!result || myId !== generationId) {
      isGenerating = false;
      playBtn.classList.remove('generating');
      playLabel.textContent = 'Generate';
      statusLeft.textContent = 'Ready';
      return;
    }

    currentBuffer = result.buffer;
    currentMeta = result.meta;
    saveBtn.disabled = false;
    isGenerating = false;
    playBtn.classList.remove('generating');
    playLabel.textContent = 'Stop';

    const seed = hashString(currentTrackName + Date.now() + Math.random());
    drawCover(seed);

    coverKicker.textContent = `${currentMeta.genreLabel} · ${formatModeName(currentMeta.mode)} · ${currentMeta.bpm} BPM`;
    coverDuration.textContent = formatTime(DURATION);

    statusLeft.textContent = 'Ready';
    statusRight.textContent = `${formatModeName(currentMeta.mode)} · ${currentMeta.genreLabel}`;

    timeTrack.classList.add('visible');

    await play(result.buffer);
  } catch (e) {
    console.error(e);
    isGenerating = false;
    playBtn.classList.remove('generating');
    playLabel.textContent = 'Generate';
    statusLeft.textContent = 'Error';
    showToast(/timeout/i.test(e && e.message) ? 'Render timeout — try again' : 'Generation failed');
  }
});

saveBtn.addEventListener('click', () => {
  exportWithCover();
});

window.addEventListener('beforeunload', () => {
  if (audioCtx && audioCtx.state !== 'closed') audioCtx.close().catch(() => {});
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    playBtn.click();
  }
});

drawCover(hashString('Cosmic Drift'));
