function smoothstep(t) {
  t = Math.max(0, Math.min(1, t));
  return t * t * (3 - 2 * t);
}

function smootherstep(t) {
  t = Math.max(0, Math.min(1, t));
  return t * t * t * (t * (t * 6 - 15) + 10);
}

function smoothDecay(t) {
  t = Math.max(0, Math.min(1, t));
  return 1 - smootherstep(t);
}

function generateTrackName(genreKey = currentGenre) {

  if (Math.random() < 0.6) {

  return `${a} ${pick(bank.adj2)} ${n}`;
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

const COVER_STYLES = ['orb', 'rings', 'waves', 'shards', 'constellation', 'gradient-flow', 'spiral', 'grid'];
const COVER_STYLES_HIPHOP = ['graffiti', 'vinyl', 'boombox', 'skyline', 'cassette', 'padgrid', 'chain'];

function drawCover(seed, genreKey = currentGenre) {
  const rng = mulberry32(seed);
  const ctx = coverCanvas.getContext('2d');
  const W = coverCanvas.width;
  const H = coverCanvas.height;

  const genre = GENRES[genreKey] || GENRES.ambient;
  const palettes = genre.palettes;
  const coverStyles = genre.coverStyles;
  const palette = palettes[Math.floor(rng() * palettes.length)];
  const style = coverStyles[Math.floor(rng() * coverStyles.length)];
  const accentPick = () => palette.accent[Math.floor(rng() * palette.accent.length)];

  const g = ctx.createLinearGradient(0, 0, W * (0.5 + rng()), H);
  g.addColorStop(0, palette.bg[0]);
  g.addColorStop(0.5, palette.bg[1]);
  g.addColorStop(1, palette.bg[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  if (genreKey === 'hipHop') {
    drawHipHopCover(ctx, style, palette, rng, W, H);
  } else if (style === 'orb') {
    const cx = W * (0.35 + rng() * 0.3);
    const cy = H * (0.35 + rng() * 0.3);
    const r = W * (0.18 + rng() * 0.15);

    for (let i = 0; i < 3; i++) {
      const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * (1 + i * 0.4));
      grd.addColorStop(0, accentPick() + 'cc');
      grd.addColorStop(0.5, accentPick() + '40');
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(cx, cy, r * (1 + i * 0.4), 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = 0; i < 220; i++) {
      const a = rng() * Math.PI * 2;
      const d = rng() * W * 0.9;
      const x = cx + Math.cos(a) * d;
      const y = cy + Math.sin(a) * d;
      if (x < 0 || x > W || y < 0 || y > H) continue;
      const size = rng() * 1.8 + 0.3;
      ctx.fillStyle = palette.star + Math.floor((rng() * 0.6 + 0.2) * 255).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (style === 'rings') {
    const cx = W * (0.3 + rng() * 0.4);
    const cy = H * (0.3 + rng() * 0.4);
    const rings = 8 + Math.floor(rng() * 8);

    for (let i = 0; i < rings; i++) {
      const r = (i + 1) * W * 0.055;
      ctx.strokeStyle = accentPick() + Math.floor(rng() * 100 + 30).toString(16).padStart(2, '0');
      ctx.lineWidth = rng() * 4 + 1;
      ctx.beginPath();
      ctx.arc(cx, cy, r, rng() * Math.PI * 2, rng() * Math.PI * 2 + Math.PI * 0.5);
      ctx.stroke();
    }

    for (let i = 0; i < 140; i++) {
      const x = rng() * W;
      const y = rng() * H;
      ctx.fillStyle = palette.star + Math.floor((rng() * 0.5 + 0.15) * 255).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.arc(x, y, rng() * 1.5 + 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (style === 'waves') {
    const lines = 12 + Math.floor(rng() * 10);
    for (let i = 0; i < lines; i++) {
      const yBase = (i / lines) * H + rng() * 20;
      ctx.strokeStyle = accentPick() + Math.floor(rng() * 90 + 25).toString(16).padStart(2, '0');
      ctx.lineWidth = rng() * 2.5 + 0.5;
      ctx.beginPath();
      const waves = 2 + Math.floor(rng() * 3);
      const amp = 20 + rng() * 60;
      for (let x = 0; x <= W; x += 6) {
        const y = yBase + Math.sin(x / W * Math.PI * waves + rng()) * amp;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    for (let i = 0; i < 80; i++) {
      ctx.fillStyle = palette.star + Math.floor((rng() * 0.35 + 0.1) * 255).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.arc(rng() * W, rng() * H, rng() * 1.2 + 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (style === 'shards') {
    const shards = 30 + Math.floor(rng() * 40);
    for (let i = 0; i < shards; i++) {
      const cx = rng() * W;
      const cy = rng() * H;
      const size = 20 + rng() * 100;
      const points = 3 + Math.floor(rng() * 3);
      ctx.fillStyle = accentPick() + Math.floor(rng() * 70 + 20).toString(16).padStart(2, '0');
      ctx.beginPath();
      for (let p = 0; p <= points; p++) {
        const a = (p / points) * Math.PI * 2 + rng();
        const r = size * (0.6 + rng() * 0.6);
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (p === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }
  } else if (style === 'constellation') {
    const points = 30 + Math.floor(rng() * 30);
    const pts = [];
    for (let i = 0; i < points; i++) {
      pts.push({ x: rng() * W, y: rng() * H, s: rng() * 2.5 + 0.5 });
    }
    ctx.strokeStyle = palette.star + '30';
    ctx.lineWidth = 0.6;
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x;
        const dy = pts[i].y - pts[j].y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 8000) {
          ctx.globalAlpha = 1 - d2 / 8000;
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
    for (const p of pts) {
      const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s * 10);
      grd.addColorStop(0, palette.star + '90');
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.s * 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.star;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (style === 'gradient-flow') {
    const blobs = 6 + Math.floor(rng() * 5);
    for (let i = 0; i < blobs; i++) {
      const cx = rng() * W;
      const cy = rng() * H;
      const r = W * (0.15 + rng() * 0.35);
      const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      const c = accentPick();
      grd.addColorStop(0, c + 'a0');
      grd.addColorStop(0.6, c + '30');
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);
    }
    for (let i = 0; i < 120; i++) {
      ctx.fillStyle = palette.star + Math.floor((rng() * 0.5 + 0.1) * 255).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.arc(rng() * W, rng() * H, rng() * 1.2 + 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (style === 'spiral') {
    const cx = W * (0.4 + rng() * 0.2);
    const cy = H * (0.4 + rng() * 0.2);
    const arms = 2 + Math.floor(rng() * 3);
    const count = 500 + Math.floor(rng() * 500);
    for (let i = 0; i < count; i++) {
      const t = i / count;
      const arm = i % arms;
      const angle = t * Math.PI * 6 + (arm / arms) * Math.PI * 2;
      const r = t * W * 0.55;
      const x = cx + Math.cos(angle) * r + (rng() - 0.5) * 14;
      const y = cy + Math.sin(angle) * r + (rng() - 0.5) * 14;
      const alpha = (1 - t) * 0.6 + 0.1;
      ctx.fillStyle = accentPick() + Math.floor(alpha * 255).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.arc(x, y, rng() * 2 + 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    const cols = 14 + Math.floor(rng() * 8);
    const rows = 14 + Math.floor(rng() * 8);
    const cellW = W / cols;
    const cellH = H / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (rng() > 0.55) continue;
        const alpha = rng() * 0.5 + 0.1;
        ctx.fillStyle = accentPick() + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        const pad = rng() * cellW * 0.3;
        ctx.fillRect(c * cellW + pad, r * cellH + pad, cellW - pad * 2, cellH - pad * 2);
      }
    }
    for (let i = 0; i < 90; i++) {
      ctx.fillStyle = palette.star + Math.floor((rng() * 0.4 + 0.1) * 255).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.arc(rng() * W, rng() * H, rng() * 1 + 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.globalCompositeOperation = 'source-over';

  const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.85);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  coverEl.classList.add('ready');
}

function drawHipHopCover(ctx, style, palette, rng, W, H) {
  ctx.globalCompositeOperation = 'source-over';
  const accent = () => palette.accent[Math.floor(rng() * palette.accent.length)];
  const hex = a => Math.floor(a * 255).toString(16).padStart(2, '0');

  function rr(x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  if (style === 'graffiti') {
    const strokes = 4 + Math.floor(rng() * 4);
    for (let i = 0; i < strokes; i++) {
      const c = accent();
      const x0 = W * (0.04 + rng() * 0.16);
      const x1 = W * (0.68 + rng() * 0.28);
      const y0 = H * (0.1 + rng() * 0.55);
      const y1 = y0 + (rng() - 0.5) * H * 0.28;
      const lw = W * (0.026 + rng() * 0.022);
      for (let p = 0; p < 3; p++) {
        ctx.strokeStyle = c + (p === 0 ? 'ee' : '55');
        ctx.lineWidth = Math.max(2, lw - p * 3);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x0, y0 + (rng() - 0.5) * 12);
        ctx.bezierCurveTo(W * rng(), y0 - H * 0.14, W * rng(), y1 + H * 0.14, x1, y1);
        ctx.stroke();
      }
      for (let d = 0; d < Math.floor(rng() * 3); d++) {
        const dx = x0 + (x1 - x0) * (0.15 + rng() * 0.7);
        const dy = y0 + (y1 - y0) * (0.15 + rng() * 0.7);
        const dh = H * (0.02 + rng() * 0.07);
        ctx.fillStyle = c + 'aa';
        rr(dx, dy, W * 0.009, dh, W * 0.0045);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(dx + W * 0.0045, dy + dh, W * 0.006, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (let i = 0; i < 700; i++) {
      ctx.fillStyle = accent() + hex(0.03 + rng() * 0.12);
      ctx.beginPath();
      ctx.arc(rng() * W, rng() * H, rng() * 2.6 + 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (style === 'vinyl') {
    const cx = W * (0.32 + rng() * 0.36);
    const cy = H * (0.3 + rng() * 0.22);
    const R = W * 0.34;

    ctx.fillStyle = '#07070a';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < 110; i++) {
      const r = R * (0.36 + (i / 110) * 0.64);
      ctx.strokeStyle = i % 2 ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.025)';
      ctx.lineWidth = rng() * 1.7 + 0.3;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    }

    const c1 = accent(), c2 = accent();
    const lr = R * 0.36;
    ctx.fillStyle = c1;
    ctx.beginPath(); ctx.arc(cx, cy, lr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c2 + 'cc';
    for (let i = 0; i < 6; i++) {
      const a0 = (i / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, lr, a0, a0 + Math.PI / 6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#0a0a0c';
    ctx.beginPath(); ctx.arc(cx, cy, W * 0.013, 0, Math.PI * 2); ctx.fill();

    const sheen = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    sheen.addColorStop(0, 'rgba(255,255,255,0.12)');
    sheen.addColorStop(0.45, 'rgba(255,255,255,0)');
    sheen.addColorStop(1, 'rgba(255,255,255,0.07)');
    ctx.fillStyle = sheen;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < 420; i++) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.05 + rng() * 0.25).toFixed(2) + ')';
      ctx.lineWidth = rng() * 0.9 + 0.2;
      const a = rng() * Math.PI * 2;
      const r = R * (0.4 + rng() * 0.6);
      const len = 2 + rng() * 16;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.lineTo(cx + Math.cos(a) * (r + len), cy + Math.sin(a) * (r + len));
      ctx.stroke();
    }
  } else if (style === 'boombox') {
    const bw = W * 0.8, bh = H * 0.32;
    const bx = (W - bw) / 2, by = H * 0.34;
    const c = accent();

    ctx.strokeStyle = c + 'cc';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(bx + bw * 0.26, by);
    ctx.quadraticCurveTo(W / 2, by - bh * 0.62, bx + bw * 0.74, by);
    ctx.stroke();

    ctx.fillStyle = 'rgba(18,18,22,0.95)';
    rr(bx, by, bw, bh, 16); ctx.fill();
    ctx.lineWidth = 4; ctx.stroke();

    const sr = bh * 0.33;
    [bx + bw * 0.17, bx + bw * 0.83].forEach(sx => {
      const sy = by + bh * 0.5;
      ctx.fillStyle = '#0b0b10';
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = c + '99';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(sx, sy, sr * 0.68, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(sx, sy, sr * 0.3, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 20; i++) {
        const a = (i / 20) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(sx + Math.cos(a) * sr * 0.32, sy + Math.sin(a) * sr * 0.32);
        ctx.lineTo(sx + Math.cos(a) * sr * 0.64, sy + Math.sin(a) * sr * 0.64);
        ctx.stroke();
      }
    });

    ctx.fillStyle = 'rgba(44,44,52,0.92)';
    rr(W / 2 - bw * 0.19, by + bh * 0.2, bw * 0.38, bh * 0.44, 8); ctx.fill();
    ctx.strokeStyle = c + '77'; ctx.lineWidth = 2; ctx.stroke();
    [W / 2 - bw * 0.08, W / 2 + bw * 0.08].forEach(rx => {
      ctx.fillStyle = '#141418';
      ctx.beginPath(); ctx.arc(rx, by + bh * 0.42, bh * 0.11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = c + '88';
      ctx.beginPath(); ctx.arc(rx, by + bh * 0.42, bh * 0.11, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(rx - bh * 0.07, by + bh * 0.42);
      ctx.lineTo(rx + bh * 0.07, by + bh * 0.42);
      ctx.stroke();
    });

    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = (i === 1 ? accent() : '#5a5a66') + 'dd';
      rr(bx + bw * 0.3 + i * bw * 0.085, by + bh * 0.78, bw * 0.055, bh * 0.14, 3);
      ctx.fill();
    }
  } else if (style === 'skyline') {
    const c = accent();
    const horizon = H * 0.86;

    const moonX = W * (0.12 + rng() * 0.2), moonY = H * (0.1 + rng() * 0.12);
    const mg = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, W * 0.1);
    mg.addColorStop(0, palette.star + 'ee');
    mg.addColorStop(0.35, palette.star + '40');
    mg.addColorStop(1, 'transparent');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(moonX, moonY, W * 0.1, 0, Math.PI * 2); ctx.fill();

    let x = -W * 0.02;
    while (x < W) {
      const w = W * (0.06 + rng() * 0.1);
      const h = H * (0.16 + rng() * 0.44);
      const y = horizon - h;
      ctx.fillStyle = 'rgba(8,8,12,0.94)';
      ctx.fillRect(x, y, w, h);

      const cols = Math.max(2, Math.floor(w / 17));
      const rows = Math.max(3, Math.floor(h / 22));
      for (let r0 = 0; r0 < rows; r0++) {
        for (let c0 = 0; c0 < cols; c0++) {
          if (rng() > 0.34) continue;
          const lit = rng() > 0.45 ? c : palette.star;
          ctx.fillStyle = lit + hex(0.3 + rng() * 0.55);
          ctx.fillRect(x + 7 + c0 * 17, y + 9 + r0 * 22, 7, 10);
        }
      }
      if (rng() > 0.7) {
        ctx.strokeStyle = c + 'aa';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(x + w / 2, y);
        ctx.lineTo(x + w / 2, y - H * 0.06);
        ctx.stroke();
      }
      x += w + W * 0.012;
    }

    const gg = ctx.createLinearGradient(0, horizon - H * 0.15, 0, horizon + H * 0.1);
    gg.addColorStop(0, 'transparent');
    gg.addColorStop(1, c + '3a');
    ctx.fillStyle = gg;
    ctx.fillRect(0, horizon - H * 0.15, W, H * 0.25);
  } else if (style === 'cassette') {
    const cw = W * 0.74, ch = H * 0.44;
    const cx = (W - cw) / 2, cy = H * 0.3;
    const c = accent();

    ctx.fillStyle = 'rgba(26,24,28,0.96)';
    rr(cx, cy, cw, ch, 14); ctx.fill();
    ctx.strokeStyle = c + 'cc'; ctx.lineWidth = 4; ctx.stroke();

    ctx.fillStyle = 'rgba(10,10,12,0.96)';
    rr(cx + cw * 0.1, cy + ch * 0.16, cw * 0.8, ch * 0.38, 10); ctx.fill();
    ctx.strokeStyle = palette.star + '44'; ctx.lineWidth = 1.5; ctx.stroke();

    [0.32, 0.68].forEach(f => {
      const rx = cx + cw * f, ry = cy + ch * 0.35;
      const rrad = ch * 0.14;
      ctx.fillStyle = accent() + 'dd';
      ctx.beginPath(); ctx.arc(rx, ry, rrad, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#0d0d10'; ctx.lineWidth = 2.5;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.lineTo(rx + Math.cos(a) * rrad * 0.7, ry + Math.sin(a) * rrad * 0.7);
        ctx.stroke();
      }
      ctx.fillStyle = '#0d0d10';
      ctx.beginPath(); ctx.arc(rx, ry, rrad * 0.26, 0, Math.PI * 2); ctx.fill();
    });

    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = (i % 2 ? palette.star : c) + '88';
      ctx.fillRect(cx + cw * 0.1, cy + ch * (0.64 + i * 0.075), cw * (0.5 + rng() * 0.4), 3);
    }

    [[0.05, 0.07], [0.95, 0.07], [0.05, 0.93], [0.95, 0.93]].forEach(([fx, fy]) => {
      ctx.strokeStyle = palette.star + '55';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx + cw * fx, cy + ch * fy, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + cw * fx - 4, cy + ch * fy);
      ctx.lineTo(cx + cw * fx + 4, cy + ch * fy);
      ctx.stroke();
    });
  } else if (style === 'padgrid') {
    const cols = 4, rows = 4;
    const padW = W * 0.14;
    const gap = W * 0.035;
    const totalW = cols * padW + (cols - 1) * gap;
    const x0 = (W - totalW) / 2;
    const y0 = H * 0.3;

    ctx.fillStyle = 'rgba(14,14,18,0.85)';
    rr(x0 - gap * 0.7, y0 - gap * 0.7, totalW + gap * 1.4, rows * padW + (rows - 1) * gap + gap * 1.4, 18);
    ctx.fill();

    for (let r = 0; r < rows; r++) {
      for (let k = 0; k < cols; k++) {
        const px = x0 + k * (padW + gap);
        const py = y0 + r * (padW + gap);
        const lit = rng() > 0.55;
        const c = accent();
        if (lit) {
          ctx.shadowColor = c;
          ctx.shadowBlur = 22;
        }
        ctx.fillStyle = lit ? c + 'ee' : 'rgba(38,38,46,0.9)';
        rr(px, py, padW, padW, 10);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = lit ? palette.star + 'aa' : 'rgba(255,255,255,0.09)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    const sy = y0 + rows * padW + (rows - 1) * gap + gap * 0.6;
    ctx.fillStyle = 'rgba(10,12,14,0.9)';
    rr(x0, sy, totalW, H * 0.05, 6); ctx.fill();
    ctx.strokeStyle = accent() + 'cc';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let i = 0; i <= totalW; i += 6) {
      const y = sy + H * 0.025 + Math.sin(i / 24) * H * 0.012 * (0.4 + rng());
      if (i === 0) ctx.moveTo(x0 + i, y);
      else ctx.lineTo(x0 + i, y);
    }
    ctx.stroke();
  } else {
    const c = accent();
    const links = 8 + Math.floor(rng() * 5);
    const cx = W * (0.3 + rng() * 0.4);
    const cy = H * (0.34 + rng() * 0.16);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((rng() - 0.5) * 1.4);
    for (let i = -links; i <= links; i++) {
      const lx = i * W * 0.095;
      ctx.save();
      ctx.translate(lx, Math.abs(i) * H * 0.028);
      ctx.rotate(i % 2 ? Math.PI / 2 : 0);
      ctx.strokeStyle = (Math.abs(i) % 3 === 0 ? palette.star : c) + 'cc';
      ctx.lineWidth = W * 0.016;
      ctx.beginPath();
      ctx.ellipse(0, 0, W * 0.042, W * 0.028, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    const mr = W * 0.16;
    const mg2 = ctx.createRadialGradient(cx, cy + mr * 0.9, 0, cx, cy + mr * 0.9, mr);
    mg2.addColorStop(0, palette.star + '55');
    mg2.addColorStop(1, 'transparent');
    ctx.fillStyle = mg2;
    ctx.beginPath(); ctx.arc(cx, cy + mr * 0.9, mr, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = accent() + 'ee';
    ctx.beginPath(); ctx.arc(cx, cy + mr * 0.9, mr * 0.66, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = palette.star + 'cc';
    ctx.lineWidth = W * 0.01;
    ctx.beginPath(); ctx.arc(cx, cy + mr * 0.9, mr * 0.78, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(10,10,12,0.75)';
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i / 5) * Math.PI * 2;
      ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * mr * 0.34, cy + mr * 0.9 + Math.sin(a) * mr * 0.34);
    }
    ctx.closePath();
    ctx.fill();
  }

  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.01 + rng() * 0.05).toFixed(3) + ')';
    ctx.fillRect(rng() * W, rng() * H, 1.6, 1.6);
  }
}

function renderFullCover(seed, title, kicker, durationText) {
  const W = 640;
  const H = 640;
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = W;
  tempCanvas.height = H;

  const mainCtx = coverCanvas.getContext('2d');
  const ctx = tempCanvas.getContext('2d');

  ctx.drawImage(coverCanvas, 0, 0);

  overlay.width = W;
  overlay.height = H;
  const oCtx = overlay.getContext('2d');

  const pad = 1.8 * 24;

  bottomGrad.addColorStop(0, 'rgba(0,0,0,0)');
  bottomGrad.addColorStop(0.5, 'rgba(0,0,0,0.15)');
  bottomGrad.addColorStop(1, 'rgba(0,0,0,0.75)');
  oCtx.fillStyle = bottomGrad;
  oCtx.fillRect(0, 0, W, H);

  const topGrad = oCtx.createLinearGradient(0, 0, 0, H * 0.25);
  topGrad.addColorStop(0, 'rgba(0,0,0,0.4)');
  topGrad.addColorStop(1, 'rgba(0,0,0,0)');
  oCtx.fillStyle = topGrad;
  oCtx.fillRect(0, 0, W, H * 0.25);

  oCtx.font = '500 22px "JetBrains Mono", monospace';
  oCtx.fillStyle = 'rgba(232, 228, 255, 0.72)';
  oCtx.textBaseline = 'top';
  oCtx.textAlign = 'left';
  oCtx.shadowColor = 'rgba(0,0,0,0.9)';
  oCtx.shadowBlur = 12;
  oCtx.fillText('SIDE A', pad, pad);
  oCtx.textAlign = 'right';
  oCtx.fillText(durationText, W - pad, pad);

  oCtx.textAlign = 'left';
  oCtx.font = '400 22px "JetBrains Mono", monospace';
  oCtx.fillStyle = 'rgba(232, 228, 255, 0.65)';
  oCtx.fillText(kicker.toUpperCase(), pad, H - pad - 220);

  const titleSize = computeTitleSize(title, W - pad * 2, 100);
  oCtx.font = `italic 300 ${titleSize}px "Fraunces", Georgia, serif`;
  oCtx.fillStyle = '#ffffff';
  oCtx.shadowColor = 'rgba(0,0,0,1)';
  oCtx.shadowBlur = 24;

  const lines = wrapText(oCtx, title, W - pad * 2);
  const lineHeight = titleSize * 1.05;
  const startY = H - pad - 40 - (lines.length - 1) * lineHeight;

  for (let i = 0; i < lines.length; i++) {
    oCtx.fillText(lines[i], pad, startY + i * lineHeight);
  }

  const underlineY = H - pad + 10;
  const underlineGrad = oCtx.createLinearGradient(pad, 0, pad + W * 0.55, 0);
  underlineGrad.addColorStop(0, 'rgba(232, 228, 255, 0.55)');
  underlineGrad.addColorStop(1, 'rgba(232, 228, 255, 0)');
  oCtx.shadowBlur = 0;
  oCtx.fillStyle = underlineGrad;
  oCtx.fillRect(pad, underlineY, W * 0.55, 2);

  ctx.drawImage(overlay, 0, 0);

  return tempCanvas;
}

function computeTitleSize(text, maxWidth, maxSize) {
  const testCanvas = document.createElement('canvas');
  const testCtx = testCanvas.getContext('2d');
  let size = maxSize;
  while (size > 28) {
    testCtx.font = `italic 300 ${size}px "Fraunces", Georgia, serif`;
    const w = testCtx.measureText(text).width;
    if (w <= maxWidth) return size;
    size -= 4;
  }
  return 28;
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const word of words) {
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width <= maxWidth) {
      current = test;
    } else {
      if (current) lines.push(current);
      current = word;
    }
  }
  if (current) lines.push(current);
  return lines.length > 0 ? lines : [text];
}

function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function humanizeTime(a = 0.012) { return (Math.random() - 0.5) * 2 * a; }

function euclidean(steps, pulses) {
  const p = new Array(steps).fill(0);
  let bucket = 0;
  for (let i = 0; i < steps; i++) {
    bucket += pulses;
    if (bucket >= steps) { bucket -= steps; p[i] = 1; }
  }
  return p;
}

function formatTime(seconds) {
  const s = Math.max(0, seconds);
  const m = Math.floor(s / 60);

  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
}

const IR_CACHE = [];

function buildIR(duration, decay, preDelaySec, brightness) {
  const preDelay = Math.floor(SR * preDelaySec);
  const len = Math.floor(SR * duration) + preDelay;
  const ch0 = new Float32Array(len);
  const ch1 = new Float32Array(len);
  for (let ch = 0; ch < 2; ch++) {
    const d = ch === 0 ? ch0 : ch1;
    for (let i = 0; i < preDelay; i++) d[i] = 0;
    let last = 0;
    const inv = 1 / (len - preDelay);
    for (let i = preDelay; i < len; i++) {
      const t = (i - preDelay) * inv;
      const w = Math.random() * 2 - 1;
      last = last * (1 - brightness) + w * brightness;
      const env = smootherstep(1 - t);
      d[i] = last * 3 * env * Math.pow(1 - t, decay * 0.5);
    }
  }
  return { ch0, ch1, len };
}

(function initCache() {
  IR_CACHE.push({ name: 'short',  data: buildIR(1.8, 2.4, 0.015, 0.05) });
  IR_CACHE.push({ name: 'medium', data: buildIR(3.2, 2.2, 0.025, 0.05) });
  IR_CACHE.push({ name: 'long',   data: buildIR(6.5, 2.4, 0.04,  0.035) });
})();

function generateNoiseBuffer(type, duration) {
  const len = Math.floor(SR * duration);
  const ch0 = new Float32Array(len);
  const ch1 = new Float32Array(len);
  let lp0 = 0, lp1 = 0;
  const coef = type === 'brown' ? 0.98 : type === 'pink' ? 0.92 : 0.3;
  for (let i = 0; i < len; i++) {
    const w0 = Math.random() * 2 - 1;
    const w1 = Math.random() * 2 - 1;
    lp0 = lp0 * coef + w0 * (1 - coef);
    lp1 = lp1 * coef + w1 * (1 - coef);
    const s = type === 'brown' ? 6 : type === 'pink' ? 3 : 1;
    ch0[i] = lp0 * s;
    ch1[i] = lp1 * s;
  }
  return { ch0, ch1, len };
}
