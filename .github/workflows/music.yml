name: Обновление музыки

on:
  schedule:
    # Каждый день в 03:40 UTC (08:40 по Екатеринбургу)
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Обновить подборки, страницы и sitemap
        run: node music/generate.cjs

      - name: Закоммитить изменения
        run: |
          git config user.name 'Music Bot'
          git config user.email 'bot@github.com'
          git add music
          git diff --quiet && git diff --staged --quiet || (git commit -m "Автообновление: музыка Audius" && git push)
