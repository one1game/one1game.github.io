name: Dev.to Cross-post

# Кросспост новых редакционных статей на Dev.to (canonical_url указывает на one1game.org).
# Автосгенерированные страницы игр пропускаются — как в Telegram и Bluesky.
# Ручной запуск (workflow_dispatch) публикует тестовую заметку.
# Секрет (Settings → Secrets → Actions): DEVTO_API_KEY

on:
  push:
    branches: [main]
    paths:
      - 'archive/**.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cross-post new articles
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, time, urllib.error, urllib.request

          KEY = os.environ.get('DEVTO_API_KEY', '').strip()
          EVENT = os.environ.get('EVENT', '').strip()
          BASE = 'https://one1game.org'
          MAX_POSTS = 2

          if not KEY:
              print('Dev.to: нет API-ключа — пропускаю')
              raise SystemExit(0)

          GAME_KEYWORDS = re.compile(r'статистика игроков', re.IGNORECASE)
          GAME_SUFFIX = re.compile(r':\s*цена, отзывы и статистика игроков\s*$', re.IGNORECASE)
          SITE_SUFFIX = re.compile(r'\s*\|\s*One1Game\s*$', re.IGNORECASE)

          # Русские категории → теги Dev.to (латиница, строчные, максимум 4).
          TAG_MAP = {
              'разработка': ['gamedev', 'development'],
              'ии и технологии': ['ai', 'technology'],
              'кино': ['movies'],
              'игры': ['gaming'],
              'обзоры': ['gaming'],
          }

          def meta(html, pattern):
              found = re.search(pattern, html, re.IGNORECASE | re.DOTALL)
              return found.group(1).strip() if found else ''

          def is_game_page(html, title):
              if GAME_KEYWORDS.search(meta(html, r'<meta\s+name=["\']keywords["\']\s+content=["\'](.*?)["\']')):
                  return True
              return bool(GAME_SUFFIX.search(SITE_SUFFIX.sub('', title)))

          def abs_url(u):
              if u.startswith('http'):
                  return u
              if u.startswith('//'):
                  return 'https:' + u
              return BASE + '/' + re.sub(r'^(\.\./)+', '', u.lstrip('/'))

          def strip_tags(s):
              return re.sub(r'[ \t]+', ' ', re.sub(r'<[^>]+>', '', s)).strip()

          INLINE = [
              (re.compile(r'<img\b[^>]*?src="([^"]+)"[^>]*?alt="([^"]*)"[^>]*?>', re.S | re.I),
               lambda m: f'![{m.group(2)}]({abs_url(m.group(1))})'),
              (re.compile(r'<img\b[^>]*?src="([^"]+)"[^>]*?>', re.S | re.I),
               lambda m: f'![]({abs_url(m.group(1))})'),
              (re.compile(r'<a\b[^>]*href="([^"]+)"[^>]*>(.*?)</a>', re.S | re.I),
               lambda m: (f'[{strip_tags(m.group(2))}]({abs_url(m.group(1))})'
                          if strip_tags(m.group(2)) else '')),
              # Пустые <strong>/<em>/<i> — это иконки Font Awesome, их вырезаем.
              (re.compile(r'<(strong|b)[^>]*>(.*?)</\1>', re.S | re.I),
               lambda m: (f'**{strip_tags(m.group(2))}**' if strip_tags(m.group(2)) else '')),
              (re.compile(r'<(em|i)[^>]*>(.*?)</\1>', re.S | re.I),
               lambda m: (f'*{strip_tags(m.group(2))}*' if strip_tags(m.group(2)) else '')),
          ]

          def inline(s):
              for pat, rep in INLINE:
                  s = pat.sub(rep, s)
              return strip_tags(s)

          BLOCK = re.compile(r'<(h2|h3|h4|p|blockquote|figure|ul|ol|div)\b([^>]*)>(.*?)</\1>', re.S | re.I)

          def to_markdown(body):
              body = re.sub(r'<div class="ad-[^"]*".*?</div>', '', body, flags=re.S | re.I)
              parts = []
              for m in BLOCK.finditer(body):
                  tag, inner = m.group(1).lower(), m.group(3)
                  if tag in ('ul', 'ol'):
                      items = [inline(i) for i in re.findall(r'<li\b[^>]*>(.*?)</li>', inner, re.S | re.I)]
                      lines = [f'- {i}' for i in items if i]
                      if lines:
                          parts.append('\n'.join(lines))
                      continue
                  text = inline(inner)
                  if not text:
                      continue
                  parts.append({'h2': '## ', 'h3': '### ', 'h4': '#### ',
                                'blockquote': '> '}.get(tag, '') + text)
              return '\n\n'.join(parts)

          def post(article):
              req = urllib.request.Request('https://dev.to/api/articles',
                                           data=json.dumps({'article': article}).encode(), method='POST')
              req.add_header('api-key', KEY)
              req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read().decode() or '{}')
              except urllib.error.HTTPError as err:
                  try:
                      body = json.loads(err.read().decode() or '{}')
                  except Exception:
                      body = {}
                  return err.code, body

          if EVENT == 'workflow_dispatch':
              status, res = post({
                  'title': 'Проверка связи — автопост из GitHub Actions',
                  'body_markdown': f'Тестовая заметка. Основной сайт: {BASE}',
                  'published': True, 'canonical_url': BASE, 'tags': ['gamedev'],
              })
              print(f'Dev.to: тест — HTTP {status} {res.get("url", res)}')
              raise SystemExit(0)

          # Только статьи, добавленные в этом пуше. Старые не перепостим:
          # сравниваем с состоянием до пуша и берём лишь новые файлы (A).
          base = os.environ.get('BEFORE', '').strip()
          if not base or set(base) == {'0'}:
              base = 'HEAD~1'
          try:
              changed = subprocess.run(
                  ['git', 'diff', '--name-only', '--diff-filter=A', base, 'HEAD', '--', 'archive/*.html'],
                  capture_output=True, text=True, check=True).stdout.split()
          except subprocess.CalledProcessError:
              changed = []

          if not changed:
              print('Dev.to: новых статей нет')
              raise SystemExit(0)

          sent = 0
          for path in changed:
              if sent >= MAX_POSTS:
                  break
              if not os.path.exists(path):
                  continue
              with open(path, encoding='utf-8') as f:
                  html = f.read()

              title = SITE_SUFFIX.sub('', meta(html, r'<title>(.*?)</title>') or path)
              if is_game_page(html, title):
                  print(f'Dev.to: пропускаю автостраницу игры {path}')
                  continue

              category = (meta(html, r'<a class="article-category[^"]*"[^>]*>(.*?)</a>') or '').strip().lower()
              tags = (TAG_MAP.get(category) or ['gaming'])[:4]

              url = f'{BASE}/{path.lstrip("/")}'
              article = re.search(r'<article class="article-body">(.*?)</article>', html, re.S | re.I)
              body = to_markdown(article.group(1) if article else '')
              body += f'\n\n---\n\nЧитать полностью на One1Game: [{url}]({url})'

              status, res = post({'title': title, 'body_markdown': body, 'published': True,
                                  'canonical_url': url, 'tags': tags})
              if status in (200, 201):
                  sent += 1
                  print(f'Dev.to: опубликовано {path} → {res.get("url", "")}')
              else:
                  print(f'Dev.to: ошибка {status} для {path} — {res}')
              time.sleep(2)

          print(f'Dev.to: опубликовано статей — {sent}')
          PY
