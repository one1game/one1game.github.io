name: Update YouTube fallback

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-fallback
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh public RSS fallback
        run: python3 _generate_youtube_fallback.py

      - name: Commit changed fallback
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- youtube-feed-fallback.json; then
            echo 'No fallback changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube-feed-fallback.json
          git commit -m 'chore: refresh YouTube fallback feed'
          git push
