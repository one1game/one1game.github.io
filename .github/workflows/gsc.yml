name: Google Search Console

# Работа с Google Search Console API через сервисный аккаунт.
#   push → повторная отправка sitemap.xml.
#   ручной запуск и еженедельный cron → сводка за неделю: клики, показы, CTR, топ-запросы.
# Секрет (Settings → Secrets → Actions): GSC_SERVICE_ACCOUNT_JSON — содержимое JSON-ключа целиком.
# Сервисный аккаунт должен быть добавлен в Search Console → Пользователи и права (права «Полный»).

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gsc:
    runs-on: ubuntu-latest
    steps:
      # Без checkout снимок некуда коммитить: «fatal: not in a git directory».
      - uses: actions/checkout@v5

      - name: Install google-auth
        run: pip install --quiet google-auth requests

      - name: Talk to Search Console API
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          EVENT: ${{ github.event_name }}
          HOST: one1game.org
        run: |
          python - <<'PY'
          import datetime, json, os, urllib.error, urllib.parse, urllib.request

          raw = os.environ.get('GSC_SERVICE_ACCOUNT_JSON', '').strip()
          event = os.environ.get('EVENT', '').strip()
          host = os.environ.get('HOST', '').strip()

          if not raw:
              print('GSC: нет сервисного JSON — пропускаю')
              raise SystemExit(0)

          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          info = json.loads(raw)
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/webmasters'])
          creds.refresh(Request())
          token = creds.token

          API = 'https://www.googleapis.com/webmasters/v3'

          def call(path, method='GET', body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(f'{API}{path}', data=data, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      payload = resp.read().decode()
                      return resp.status, (json.loads(payload) if payload else {})
              except urllib.error.HTTPError as err:
                  try:
                      payload = json.loads(err.read().decode() or '{}')
                  except Exception:
                      payload = {}
                  return err.code, payload

          status, sites = call('/sites')
          entries = sites.get('siteEntry', [])
          site = next((s['siteUrl'] for s in entries if host in s.get('siteUrl', '')), None)
          if not site:
              print(f'GSC: сайт {host} не найден в Search Console — {entries}')
              raise SystemExit(1)

          enc = urllib.parse.quote(site, safe='')

          if event == 'push':
              sitemap = urllib.parse.quote(f'https://{host}/sitemap.xml', safe='')
              status, _ = call(f'/sites/{enc}/sitemaps/{sitemap}', method='PUT')
              print(f'GSC: sitemap отправлен — HTTP {status}')
              raise SystemExit(0)

          # Ручной запуск и cron — сводка за неделю (данные GSC отстают ~2 дня).
          end = datetime.date.today() - datetime.timedelta(days=3)
          start = end - datetime.timedelta(days=7)
          status, data = call(f'/sites/{enc}/searchAnalytics/query', method='POST', body={
              'startDate': start.isoformat(),
              'endDate': end.isoformat(),
              'dimensions': ['query'],
              'rowLimit': 10,
          })

          print(f'GSC: {site} — {start} … {end}')
          for row in data.get('rows', []):
              keys = row.get('keys', [''])
              print(f"  {keys[0][:60]:60} клики {int(row.get('clicks', 0)):>5}  "
                    f"показы {int(row.get('impressions', 0)):>7}  CTR {row.get('ctr', 0) * 100:5.1f}%")
          if not data.get('rows'):
              print('  данных нет')

          # Полный снимок, а не десять строк в лог: запросы и страницы целиком
          # кладём в репозиторий, чтобы по ним можно было строить гипотезы,
          # а не догадки. Кладём только при изменении.
          def pull(dim, limit):
              st, d = call(f'/sites/{enc}/searchAnalytics/query', method='POST', body={
                  'startDate': start.isoformat(),
                  'endDate': end.isoformat(),
                  'dimensions': [dim],
                  'rowLimit': limit,
              })
              if st != 200:
                  print(f'GSC: {dim} не отдался — HTTP {st} {d}')
                  return []
              return d.get('rows', [])

          def pack(rows, key):
              return [{key: r['keys'][0],
                       'clicks': int(r.get('clicks', 0)),
                       'impressions': int(r.get('impressions', 0)),
                       'ctr': round(r.get('ctr', 0), 4),
                       'position': round(r.get('position', 0), 1)} for r in rows]

          snapshot = {
              'range': [start.isoformat(), end.isoformat()],
              'queries': pack(pull('query', 1000), 'query'),
              'pages': pack(pull('page', 500), 'page'),
          }
          path = 'scripts/data/gsc-snapshot.json'
          body = json.dumps(snapshot, ensure_ascii=False, indent=1)
          prev = open(path, encoding='utf-8').read() if os.path.exists(path) else ''
          if body + '\n' == prev:
              print('GSC: снимок не изменился')
          else:
              os.makedirs('scripts/data', exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(body + '\n')
              print(f'GSC: снимок сохранён — запросов {len(snapshot["queries"])}, '
                    f'страниц {len(snapshot["pages"])}')
          PY

      # Отвечает на вопрос, который по цифрам кликов не решается: страница
      # в индексе или её там нет. Это разные болезни и лечатся по-разному.
      - name: Статус индексации (URL Inspection API)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/gsc_inspect.py

      - name: Сохранить снимок в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # На push-запуске снимка нет — git add не должен валить джоб.
          git add scripts/data/gsc-snapshot.json scripts/data/gsc-index.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Снимок поисковых запросов Google: $(date -u +'%Y-%m-%d')"
          git push
