name: Generate Sitemap & Home

on:
  push:
    paths:
      - 'articles-data.js'
  workflow_dispatch:  # кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run generators
        run: |
          python generate-sitemap.py
          python generate-home.py
          python generate-archive.py
          python scripts/gen_category_hubs.py
      - name: Commit and push
        run: |
          git config --global user.name 'Sitemap Bot'
          git config --global user.email 'bot@github.com'
          git add sitemap.xml index.html archive.html category
          git diff --quiet && git diff --staged --quiet || (git commit -m "Автогенерация: sitemap, статичные главная и лента статей, хабы категорий" && git push)
