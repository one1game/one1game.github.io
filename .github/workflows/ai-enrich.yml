name: ИИ-обогащение страниц игр (Gemini → Groq → Cloudflare)

on:
  schedule:
    - cron: "0 5 * * *" # ежедневно 05:00 UTC (08:00 МСК)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v5

      - name: Установка Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: ИИ-обогащение (Gemini → Groq → Cloudflare)
        env:
          MODE: "enrich"
          ENRICH_LIMIT: "150"
          ARCHIVE_DIR: "archive"
          DELAY_MS: "800"
          # Основные провайдеры (бесплатные тиры). Что задано — то и используется.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Принимаем и CLOUDFLARE_ACCOUNT_ID, и CLOUDFLARE_ACCOUNT — что настроено в секретах.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/generate-games.js

      - name: Коммит и пуш изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ articles-data.js
          git diff --quiet --cached || git commit -m "ИИ-обогащение страниц игр: $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
