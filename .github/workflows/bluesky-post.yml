name: Bluesky Post

# Автопост новых редакционных статей в Bluesky.
# Автосгенерированные страницы игр пропускаются — как в Telegram.
# Ручной запуск (workflow_dispatch) публикует тестовое сообщение.
# Секреты (Settings → Secrets → Actions):
#   BLUESKY_APP_PASSWORD — app password из Настроек Bluesky (не основной пароль!)
#   BLUESKY_HANDLE       — опционально, по умолчанию one1game.bsky.social

on:
  push:
    branches: [main]
    paths:
      - 'archive/**.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Post new articles
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || 'one1game.bsky.social' }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import datetime, json, os, re, subprocess, time, urllib.error, urllib.request

          HANDLE = os.environ.get('BLUESKY_HANDLE', '').strip() or 'one1game.bsky.social'
          PASSWORD = os.environ.get('BLUESKY_APP_PASSWORD', '').strip()
          EVENT = os.environ.get('EVENT', '').strip()
          BASE = 'https://one1game.github.io'
          PDS = 'https://bsky.social'
          COLLECTION = 'app.bsky.feed.post'
          MAX_POSTS = 3

          if not PASSWORD:
              print('Bluesky: нет app password — пропускаю')
              raise SystemExit(0)

          # Автосгенерированные страницы игр (scripts/generate-games.js) не постим.
          GAME_KEYWORDS = re.compile(r'статистика игроков', re.IGNORECASE)
          GAME_SUFFIX = re.compile(r':\s*цена, отзывы и статистика игроков\s*$', re.IGNORECASE)
          SITE_SUFFIX = re.compile(r'\s*\|\s*One1Game\s*$', re.IGNORECASE)

          def xrpc(method, payload, token=None):
              req = urllib.request.Request(f'{PDS}/xrpc/{method}',
                                           data=json.dumps(payload).encode(), method='POST')
              req.add_header('Content-Type', 'application/json')
              if token:
                  req.add_header('Authorization', f'Bearer {token}')
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read().decode() or '{}')
              except urllib.error.HTTPError as err:
                  try:
                      body = json.loads(err.read().decode() or '{}')
                  except Exception:
                      body = {}
                  return err.code, body

          def meta(html, pattern):
              found = re.search(pattern, html, re.IGNORECASE | re.DOTALL)
              return found.group(1).strip() if found else ''

          def is_game_page(html, title):
              if GAME_KEYWORDS.search(meta(html, r'<meta\s+name=["\']keywords["\']\s+content=["\'](.*?)["\']')):
                  return True
              return bool(GAME_SUFFIX.search(SITE_SUFFIX.sub('', title)))

          status, session = xrpc('com.atproto.server.createSession',
                                 {'identifier': HANDLE, 'password': PASSWORD})
          did, jwt = session.get('did'), session.get('accessJwt')
          if not jwt:
              print(f'Bluesky: не удалось войти — HTTP {status} {session}')
              raise SystemExit(1)

          def publish(text, url, title, desc):
              record = {
                  '$type': COLLECTION,
                  'text': text[:300],
                  'langs': ['ru'],
                  'createdAt': datetime.datetime.now(datetime.timezone.utc)
                      .isoformat(timespec='milliseconds').replace('+00:00', 'Z'),
              }
              if url:
                  record['embed'] = {'$type': 'app.bsky.embed.external', 'external': {
                      'uri': url, 'title': title[:300], 'description': (desc or title)[:300]}}
              return xrpc('com.atproto.repo.createRecord',
                          {'repo': did, 'collection': COLLECTION, 'record': record}, jwt)

          if EVENT == 'workflow_dispatch':
              status, res = publish('✅ Проверка связи — автопост из GitHub Actions.',
                                    BASE, 'One1Game', 'Игры, ИИ и Кино: обзоры, гайды и разработка')
              print(f'Bluesky: тест — HTTP {status} {res.get("uri", res)}')
              raise SystemExit(0)

          # Только статьи, добавленные в этом пуше. Старые не перепостим:
          # сравниваем с состоянием до пуша и берём лишь новые файлы (A).
          base = os.environ.get('BEFORE', '').strip()
          if not base or set(base) == {'0'}:
              base = 'HEAD~1'
          try:
              changed = subprocess.run(
                  ['git', 'diff', '--name-only', '--diff-filter=A', base, 'HEAD', '--', 'archive/*.html'],
                  capture_output=True, text=True, check=True).stdout.split()
          except subprocess.CalledProcessError:
              changed = []

          if not changed:
              print('Bluesky: новых статей нет')
              raise SystemExit(0)

          sent = 0
          for path in changed:
              if sent >= MAX_POSTS:
                  break
              if not os.path.exists(path):
                  continue
              with open(path, encoding='utf-8') as f:
                  html = f.read()

              title = SITE_SUFFIX.sub('', meta(html, r'<title>(.*?)</title>') or path)
              if is_game_page(html, title):
                  print(f'Bluesky: пропускаю автостраницу игры {path}')
                  continue

              desc = meta(html, r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']')
              url = f'{BASE}/{path.lstrip("/")}'

              status, res = publish(f'{title}\n\n{url}', url, title, desc)
              if status in (200, 201):
                  sent += 1
                  print(f'Bluesky: опубликовано {path} → {res.get("uri", "")}')
              else:
                  print(f'Bluesky: ошибка {status} для {path} — {res}')
              time.sleep(2)

          print(f'Bluesky: опубликовано постов — {sent}')
          PY
