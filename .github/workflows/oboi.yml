name: Обновление игровых обоев

on:
  schedule:
    # Каждый день в 03:20 UTC (08:20 по Екатеринбургу)
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Обновить подборки и sitemap
        run: node oboi/generate.cjs

      - name: Закоммитить изменения
        run: |
          git config user.name 'Wallpaper Bot'
          git config user.email 'bot@github.com'
          git add oboi
          git diff --quiet && git diff --staged --quiet || (git commit -m "Автообновление: игровые обои" && git push)
