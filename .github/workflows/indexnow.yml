name: IndexNow

# Сообщает Яндексу и Bing об изменившихся страницах — быстрая индексация.
# Ключ берётся из секрета INDEXNOW_KEY, а если его нет — из <key>.txt в корне репозитория.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  # Пуш из workflow сделан GITHUB_TOKEN, а такой пуш не запускает другие
  # workflow. Событие workflow_run срабатывает всегда, поэтому новые игры
  # попадают в IndexNow и без секрета с личным токеном.
  workflow_run:
    workflows:
      - "Обновление страниц игр (Steam + SteamSpy)"
      - "Обновление данных всех игр (Steam)"
      - "Generate Sitemap & Home"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Для workflow_run GITHUB_SHA — последний коммит основной ветки, то
          # есть уже вместе с пушем бота. head_sha здесь не годится: это SHA
          # до коммита, который сделал сам джоб обновления.
          fetch-depth: 2

      - name: Submit changed pages
        env:
          SECRET_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          HOST=one1game.org

          if [ -n "${SECRET_KEY:-}" ]; then
            KEY="$SECRET_KEY"
          else
            KEY=$(ls *.txt 2>/dev/null | sed -n 's/^\([0-9a-f]\{32\}\)\.txt$/\1/p' | head -n1)
          fi
          if [ -z "${KEY:-}" ]; then
            echo "IndexNow: ключ не найден — пропускаю"
            exit 0
          fi

          CHANGED=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.html' 2>/dev/null || true)
          PATHS=$(printf '%s\n' "$CHANGED" \
            | sed -e 's#^index\.html$##' -e 's#/index\.html$#/#' -e 's#\.html$##' \
            | grep -v '^404\.html$' \
            | grep -v '^$' \
            | sort -u || true)

          if [ -z "$CHANGED" ]; then
            echo "IndexNow: изменённых HTML-страниц нет"
            exit 0
          fi

          URLS=$( { printf '%s\n' "$PATHS" | sed "s#^#https://$HOST/#"; echo "https://$HOST/"; } \
            | grep -v '^$' | sort -u | jq -R . | jq -s .)
          echo "Отправляю URL:"; echo "$URLS"

          # Ждём не фиксированные 90 секунд, а реальной готовности деплоя:
          # отправить IndexNow на URL, который ещё отдаёт 404, хуже, чем не
          # отправить вообще — робот придёт по ссылке и получит ошибку.
          FIRST=$(printf '%s\n' "$PATHS" | head -n1)
          PROBE="https://$HOST/$FIRST"
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PROBE" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Деплой готов примерно через $((i * 15)) с — отправляю IndexNow"
              break
            fi
            sleep 15
          done

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}" \
            -w "\nHTTP %{http_code}\n"
