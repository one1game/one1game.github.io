name: Telegram Post

# Автопост новых статей в Telegram-канал.
# Секреты (Settings → Secrets → Actions):
#   TELEGRAM_BOT_TOKEN — токен бота от @BotFather
#   TELEGRAM_CHAT_ID   — id канала (отрицательный, вида -100...), например -1002196230157
# Ручной запуск (workflow_dispatch) присылает тестовое сообщение — так удобно проверять связь.

on:
  push:
    branches: [main]
    paths:
      - 'archive/**.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Post new articles
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID || '-1002196230157' }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, urllib.request, urllib.parse, time

          token = os.environ.get('TG_TOKEN', '').strip()
          chat = os.environ.get('TG_CHAT', '').strip()
          event = os.environ.get('EVENT', '').strip()
          if not token or not chat:
              print('Telegram: нет токена или chat_id — пропускаю')
              raise SystemExit(0)

          BASE = 'https://one1game.org'
          API = f'https://api.telegram.org/bot{token}/sendMessage'

          # Автосгенерированные страницы игр (scripts/generate-games.js) в канал
          # не отправляем — ни старые, ни новые. Это технические SEO-страницы,
          # а не редакционные статьи. Признак: keywords содержат "статистика игроков"
          # (у ИИ-обогащённых страниц заголовок свой, но keywords остаются теми же).
          GAME_KEYWORDS = re.compile(r'статистика игроков', re.IGNORECASE)
          GAME_SUFFIX = re.compile(r':\s*цена, отзывы и статистика игроков\s*$', re.IGNORECASE)
          SITE_SUFFIX = re.compile(r'\s*\|\s*One1Game\s*$', re.IGNORECASE)

          def send(text):
              data = urllib.parse.urlencode({
                  'chat_id': chat,
                  'text': text,
                  'parse_mode': 'HTML',
                  'disable_web_page_preview': 'false',
              }).encode()
              req = urllib.request.Request(API, data=data)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.status

          def esc(text):
              return text.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')

          def meta(html, pattern):
              found = re.search(pattern, html, re.IGNORECASE | re.DOTALL)
              return found.group(1).strip() if found else ''

          def is_game_page(html, title):
              # Ключевой признак — keywords автосгенерированной карточки игры.
              if GAME_KEYWORDS.search(meta(html, r'<meta\s+name=["\']keywords["\']\s+content=["\'](.*?)["\']')):
                  return True
              # Запасной признак — заголовок вида "…: цена, отзывы и статистика игроков".
              return bool(GAME_SUFFIX.search(SITE_SUFFIX.sub('', title)))

          # Ручной запуск — просто проверяем связь
          if event == 'workflow_dispatch':
              try:
                  status = send(f'✅ <b>Проверка связи</b>\n\nTelegram-автопост подключён.\n\n<a href="{BASE}/">{BASE}</a>')
                  print(f'Telegram: тестовое сообщение отправлено, HTTP {status}')
              except Exception as err:
                  print(f'Telegram: ошибка отправки — {err}')
              raise SystemExit(0)

          # Только статьи, добавленные в этом пуше. Старые не перепостим:
          # сравниваем с состоянием до пуша и берём лишь новые файлы (A).
          base = os.environ.get('BEFORE', '').strip()
          if not base or set(base) == {'0'}:
              base = 'HEAD~1'
          try:
              changed = subprocess.run(
                  ['git', 'diff', '--name-only', '--diff-filter=A', base, 'HEAD', '--', 'archive/*.html'],
                  capture_output=True, text=True, check=True).stdout.split()
          except subprocess.CalledProcessError:
              changed = []

          if not changed:
              print('Telegram: новых статей нет')
              raise SystemExit(0)

          sent = 0
          for path in changed:
              if sent >= 5:
                  break
              if not os.path.exists(path):
                  continue
              with open(path, encoding='utf-8') as f:
                  html = f.read()

              title = meta(html, r'<title>(.*?)</title>') or path
              if is_game_page(html, title):
                  print(f'Telegram: пропускаю автостраницу игры {path}')
                  continue

              desc = meta(html, r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']')
              url = f'{BASE}/' + re.sub(r'\.html$', '', path.lstrip("/"))

              text = f'<b>{esc(title)}</b>'
              if desc:
                  text += f'\n\n{esc(desc)}\n'
              text += f'\n<a href="{url}">{url}</a>'

              try:
                  status = send(text)
                  sent += 1
                  print(f'Telegram: отправлено {path} → HTTP {status}')
              except Exception as err:
                  print(f'Telegram: ошибка для {path}: {err}')
              time.sleep(2)

          print(f'Telegram: отправлено сообщений — {sent}')
          PY
