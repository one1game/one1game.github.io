name: Telegram Post

# Автопост новых статей в Telegram-канал.
# Работает, если в Settings → Secrets → Actions заданы:
#   TELEGRAM_BOT_TOKEN — токен бота от @BotFather
#   TELEGRAM_CHAT_ID   — id канала (например -1001234567890) или @username
# Без секретов workflow просто ничего не делает.

on:
  push:
    branches: [main]
    paths:
      - 'archive/**.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Post new articles
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, urllib.request, urllib.parse, time

          token = os.environ.get('TG_TOKEN', '').strip()
          chat = os.environ.get('TG_CHAT', '').strip()
          if not token or not chat:
              print('Telegram: секреты не заданы — пропускаю')
              raise SystemExit(0)

          BASE = 'https://one1game.github.io'
          try:
              changed = subprocess.run(
                  ['git', 'diff', '--name-only', '--diff-filter=AM', 'HEAD~1', 'HEAD', '--', 'archive/*.html'],
                  capture_output=True, text=True, check=True).stdout.split()
          except subprocess.CalledProcessError:
              changed = []

          if not changed:
              print('Telegram: новых статей нет')
              raise SystemExit(0)

          def meta(html, pattern):
              m = re.search(pattern, html, re.IGNORECASE | re.DOTALL)
              return m.group(1).strip() if m else ''

          def esc(text):
              return (text.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;'))

          for path in changed[:5]:
              if not os.path.exists(path):
                  continue
              with open(path, encoding='utf-8') as f:
                  html = f.read()
              title = meta(html, r'<title>(.*?)</title>') or path
              desc = meta(html, r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']')
              url = f'{BASE}/{path.lstrip("/")}'

              text = f'<b>{esc(title)}</b>'
              if desc:
                  text += f'\n\n{esc(desc)}\n'
              text += f'\n<a href="{url}">{url}</a>'

              data = urllib.parse.urlencode({
                  'chat_id': chat,
                  'text': text,
                  'parse_mode': 'HTML',
                  'disable_web_page_preview': 'false',
              }).encode()
              req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      print(f'Telegram: отправлено {path} → {resp.status}')
              except Exception as err:
                  print(f'Telegram: ошибка для {path}: {err}')
              time.sleep(2)
          PY
